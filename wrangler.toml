name = "kardo"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ═══════════════════════════════════════════════════════════
# Cron Triggers — تنظيف تلقائي
# ═══════════════════════════════════════════════════════════
# يعمل كل ساعة لـ:
#   1. مسح manual_card_reveal منتهية الصلاحية (PAN/CVV)
#   2. مسح rate_limits القديمة
[triggers]
crons = ["0 * * * *"]

# ═══════════════════════════════════════════════════════════
# Observability — مراقبة الأداء
# ═══════════════════════════════════════════════════════════
[observability]
enabled = true
head_sampling_rate = 1

# ═══════════════════════════════════════════════════════════
# Security Headers (اختياري — يطبقها Cloudflare تلقائياً)
# ═══════════════════════════════════════════════════════════
[placement]
mode = "smart"
