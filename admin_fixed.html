<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020617">
<meta name="robots" content="noindex,nofollow">
<title>كاردو — لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#020617;--s1:#0D1421;--s2:#131C2C;--s3:#1A2436;--s4:#232F45;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);--tx:#F8FAFC;--tx-2:#94A3B8;--tx-3:#5F6E88;--g:#10B981;--g-2:#0E9E70;--g-3:#34D399;--g-soft:rgba(16,185,129,.10);--g-line:rgba(16,185,129,.30);--bad:#EF5F5F;--bad-soft:rgba(239,95,95,.10);--bad-line:rgba(239,95,95,.30);--warn:#F59E0B;--warn-soft:rgba(245,158,11,.10);--info:#4A9EFF;--info-soft:rgba(74,158,255,.10);--spring:cubic-bezier(.34,1.4,.44,1);--ease:cubic-bezier(.22,1,.36,1);--swift:cubic-bezier(.4,0,.2,1);--rail:280px;--bar-h:64px;--dock-h:68px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(70vw 55vh at 88% -8%,rgba(16,185,129,.07),transparent 60%),radial-gradient(60vw 45vh at -8% 4%,rgba(52,211,153,.04),transparent 58%)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;width:100%}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--g);outline-offset:3px;border-radius:8px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--s4);border-radius:8px}
svg{width:19px;height:19px;flex:none;display:inline-block;vertical-align:middle}
.mono{font-family:'IBM Plex Mono',monospace}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-weight:700}
.hidden{display:none!important}
.shell{display:grid;grid-template-columns:1fr;min-height:100vh;position:relative;z-index:1}
@media(min-width:1024px){.shell{grid-template-columns:1fr var(--rail)}}
.rail{display:none;grid-column:2;position:sticky;top:0;height:100vh;flex-direction:column;padding:22px 14px;border-inline-start:1px solid var(--line);background:linear-gradient(180deg,rgba(13,20,33,.6),rgba(2,6,23,.95));backdrop-filter:blur(20px);overflow-y:auto}
@media(min-width:1024px){.rail{display:flex}}
.main{grid-column:1;min-width:0;padding-bottom:calc(var(--dock-h) + env(safe-area-inset-bottom) + 16px)}
@media(min-width:1024px){.main{padding-bottom:32px}}
.wrap{padding:20px 16px;max-width:1440px;margin:0 auto}
@media(min-width:640px){.wrap{padding:28px}}
.bar{position:sticky;top:0;z-index:40;height:var(--bar-h);display:flex;align-items:center;gap:12px;padding:0 16px;background:rgba(2,6,23,.82);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.bar-title{font-size:17px;font-weight:800;letter-spacing:-.025em}
.bar-actions{margin-inline-start:auto;display:flex;gap:8px}
.iconbtn{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;color:var(--tx-2);border:1px solid transparent;transition:all .18s}
.iconbtn:hover{background:var(--s2);color:var(--tx);border-color:var(--line)}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px;margin-bottom:22px}
.brand .en{font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.brand .ar{font-size:11px;color:var(--tx-3)}
.nav-group{margin:16px 0 8px;padding:0 12px;font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--tx-3);text-transform:uppercase;opacity:.65}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:11px;color:var(--tx-2);font-size:14px;font-weight:600;position:relative;margin-bottom:3px;transition:all .16s}
.nav:hover{background:var(--s1);color:var(--tx)}
.nav.on{background:var(--s2);color:var(--tx)}
.nav.on::before{content:'';position:absolute;inset-inline-start:0;top:24%;bottom:24%;width:3px;border-radius:99px;background:var(--g)}
.nav.on svg{color:var(--g)}
.nav .cnt{margin-inline-start:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--g);color:#04121B;font-size:11px;font-weight:800;display:grid;place-items:center}
.rail-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
.rail-user{display:flex;align-items:center;gap:11px;padding:0 4px 12px}
.rail-av{width:36px;height:36px;border-radius:11px;background:var(--g-soft);color:var(--g);display:grid;place-items:center;font-weight:800}
.rail-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-role{font-size:11px;color:var(--tx-3)}
.h1{font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.2}
.h2{font-size:17px;font-weight:800;letter-spacing:-.022em;line-height:1.3}
.h3{font-size:14.5px;font-weight:700}
.sub{color:var(--tx-2);font-size:13.5px;line-height:1.6}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--tx-3);text-transform:uppercase}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--tx-2);margin-bottom:8px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 14px;gap:12px}
.box{background:linear-gradient(180deg,var(--s1),rgba(2,6,23,.75));border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;transition:border-color .25s}
.box:hover{border-color:var(--line-2)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);margin-bottom:18px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1100px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{background:linear-gradient(180deg,var(--s1),rgba(2,6,23,.5));border:1px solid var(--line);border-radius:14px;padding:16px;transition:border-color .25s,transform .25s}
.kpi:hover{border-color:var(--g-line);transform:translateY(-2px)}
.kpi-i{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;margin-bottom:12px}
.kpi-v{font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.kpi-k{font-size:11.5px;color:var(--tx-3);margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:11px;font-weight:700;font-size:13.5px;font-family:inherit;background:linear-gradient(135deg,var(--g),var(--g-2));color:#04121B;box-shadow:0 8px 18px -8px rgba(16,185,129,.55);transition:transform .18s;position:relative;overflow:hidden}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.42;cursor:not-allowed;background:var(--s3);color:var(--tx-3);box-shadow:none}
.btn svg{width:16px;height:16px}
.btn.line{background:transparent;border:1px solid var(--line-2);color:var(--tx);box-shadow:none}
.btn.line:hover:not(:disabled){background:var(--s2)}
.btn.ghost{background:var(--s2);color:var(--tx);box-shadow:none}
.btn.dark{background:var(--s1);border:1px solid var(--line-2);color:var(--tx);box-shadow:none}
.btn.dark:hover:not(:disabled){border-color:var(--g);color:var(--g)}
.btn.bad{background:transparent;border:1px solid rgba(239,95,95,.35);color:var(--bad);box-shadow:none}
.btn.sm{padding:8px 13px;font-size:12.5px;border-radius:10px}
.btn.wide{width:100%}
.btn.loading{color:transparent;pointer-events:none}
.btn.loading::after{content:'';position:absolute;width:16px;height:16px;border:2.5px solid rgba(4,18,27,.3);border-top-color:#04121B;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.inp{background:var(--s2);border:1.5px solid var(--line-2);border-radius:12px;padding:12px 14px;color:var(--tx);font-size:14px;font-family:inherit}
.inp:focus{outline:none;border-color:var(--g);background:var(--s3);box-shadow:0 0 0 3px var(--g-soft)}
textarea.inp{resize:vertical;line-height:1.7;min-height:90px}
.scrollx{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--s1)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:700px}
.tbl th{text-align:right;padding:12px 14px;color:var(--tx-3);font-size:11.5px;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--s2);position:sticky;top:0;z-index:1}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--g-soft);color:var(--g)}
.chip.wait{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.off{background:var(--s3);color:var(--tx-3)}
.empty{text-align:center;padding:46px 20px;color:var(--tx-2)}
.empty .ei{width:64px;height:64px;border-radius:18px;margin:0 auto 16px;display:grid;place-items:center;background:var(--s2);color:var(--tx-3)}
.empty .ei svg{width:28px;height:28px}
.empty .et{font-weight:800;color:var(--tx);font-size:15px;margin-bottom:6px}
.note{background:var(--warn-soft);border:1px solid rgba(245,158,11,.28);color:#F0C878;padding:12px 15px;border-radius:12px;font-size:13px;margin-bottom:14px}
.note.bad{background:var(--bad-soft);border-color:var(--bad-line);color:#F5A0A0}
.note.ok{background:var(--g-soft);border-color:var(--g-line);color:var(--g-3)}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.grid3{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:720px){.grid3{grid-template-columns:repeat(3,1fr)}}
.flex-b{display:flex;justify-content:space-between;align-items:center;gap:12px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spark{display:flex;align-items:flex-end;gap:3px;height:80px}
.spark i{flex:1;background:var(--g);border-radius:3px 3px 0 0;min-height:3px;opacity:.85}
.ov{position:fixed;inset:0;z-index:120;background:rgba(2,6,23,.72);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.ov.show{display:flex}
@media(min-width:640px){.ov{align-items:center}}
.sheet{background:var(--s1);border:1px solid var(--line);border-bottom:none;width:100%;max-width:540px;border-radius:24px 24px 0 0;padding:22px;max-height:92vh;overflow-y:auto}
@media(min-width:640px){.sheet{border-radius:20px}}
.sheet-head{display:flex;gap:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:min(92vw,400px);pointer-events:none}
.toast{background:var(--s3);border:1px solid var(--line-2);padding:13px 15px;border-radius:12px;font-size:13.5px;font-weight:600;display:flex;gap:10px;box-shadow:0 20px 44px -16px rgba(0,0,0,.9);pointer-events:auto}
.toast.ok{border-color:var(--g-line);background:linear-gradient(180deg,rgba(16,185,129,.15),rgba(13,20,33,.95))}
.toast.bad{border-color:var(--bad-line);background:linear-gradient(180deg,rgba(239,95,95,.15),rgba(13,20,33,.95))}
.toast svg{width:18px;height:18px;flex:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 15px;border-radius:10px;font-size:12.5px;font-weight:700;border:1px solid var(--line);background:var(--s1);color:var(--tx-3);transition:all .16s;font-family:inherit}
.tab:hover{color:var(--tx)}
.tab.on{background:var(--s2);border-color:var(--g-line);color:var(--tx)}
.sw{width:46px;height:26px;border-radius:99px;background:var(--line-2);position:relative;transition:background .22s;flex:none;cursor:pointer;border:none}
.sw::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:inset-inline-start .24s}
.sw.on{background:var(--g)}
.sw.on::after{inset-inline-start:23px}
.sw-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.sw-row:last-child{border-bottom:none}
.sw-lbl{font-size:13.5px;font-weight:600}
.sw-desc{font-size:11.5px;color:var(--tx-3);margin-top:2px}
.field{display:grid;grid-template-columns:1fr 130px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:none}
.field .n{font-size:13.5px;font-weight:600}
.field .d{font-size:11.5px;color:var(--tx-3);margin-top:2px}
.field input{text-align:center;padding:10px}
.dock{position:fixed;inset:auto 0 0 0;z-index:50;display:grid;height:var(--dock-h);padding-bottom:env(safe-area-inset-bottom);background:rgba(2,6,23,.94);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
@media(min-width:1024px){.dock{display:none}}
.dk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:700;color:var(--tx-3);padding:0 4px;position:relative}
.dk.on{color:var(--g)}
.dk.on::before{content:'';position:absolute;top:0;left:50%;width:22px;height:2.5px;border-radius:0 0 4px 4px;background:var(--g);transform:translateX(-50%)}
.dk svg{width:20px;height:20px}
.dk .cnt{position:absolute;top:6px;inset-inline-end:14px;min-width:15px;height:15px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center}
#gate{min-height:100vh;display:none;place-items:center;padding:20px}
#gate.show{display:grid}
.gate-card{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:30px 26px;width:min(100%,420px);text-align:center}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="gate-head">
      <span id="gateMark"></span>
      <div>
        <div class="gate-title">Kardo</div>
        <div class="gate-sub">لوحة التحكم</div>
      </div>
    </div>
    <p class="sub" style="margin-bottom:20px">هذه الصفحة للمصرّح لهم فقط.</p>
    <label class="lbl">البريد الإلكتروني</label>
    <input class="inp" id="gEmail" type="email" dir="ltr" placeholder="admin@kardo.ly" autocomplete="email" style="margin-bottom:14px">
    <label class="lbl">كلمة المرور</label>
    <input class="inp" id="gPass" type="password" dir="ltr" placeholder="••••••••" autocomplete="current-password" style="margin-bottom:20px">
    <button class="btn wide" id="gGo">تسجيل الدخول</button>
    <div id="gErr" class="note bad hidden" style="margin-top:14px"></div>
  </div>
</div>

<div id="app" style="display:none">
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <span id="railMark"></span>
      <div><div class="en">Kardo</div><div class="ar">لوحة التحكم</div></div>
    </div>
    <nav id="navRail"></nav>
    <div class="rail-foot">
      <div class="rail-user">
        <div class="rail-av" id="railAv">A</div>
        <div style="min-width:0;flex:1">
          <div class="rail-name" id="railName">—</div>
          <div class="rail-role">مسؤول النظام</div>
        </div>
      </div>
      <button class="nav" id="railOut"></button>
    </div>
  </aside>
  <div class="main">
    <header class="bar">
      <div class="bar-title" id="barTitle">نظرة عامة</div>
      <div class="bar-actions">
        <button class="iconbtn" id="refreshBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>
        </button>
      </div>
    </header>
    <main class="wrap" id="view"></main>
  </div>
</div>
<nav class="dock" id="navDock"></nav>
</div>

<div id="toasts"></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, deleteDoc, addDoc, onSnapshot, collection, query, orderBy, limit } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyC-GntWur6r_Ow_v0wTNymQqQa6brzgvW8",
  authDomain: "kardo-1c657.firebaseapp.com",
  projectId: "kardo-1c657",
  storageBucket: "kardo-1c657.firebasestorage.app",
  messagingSenderId: "593934928630",
  appId: "1:593934928630:web:d36ea455a284e974043ad7"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const S = { admin: null, page: 'home', unsub: [], users: [], cardOrders: [], cards: [], deposits: [], tickets: [], vipPlans: [], vipSubs: [], ads: [], stats: null, filter: 'all', search: '', setTab: 'ops' };

const I = {
  home:'<path d="M3 10.4 12 3.2l9 7.2V20a1 1 0 0 1-1 1h-5v-6.5H9V21H4a1 1 0 0 1-1-1z"/>',
  card:'<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9"/>',
  cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.9 14.6a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 0 1-4 0v-.1a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H4a2 2 0 0 1 0-4h.1A1.6 1.6 0 0 0 5.2 7.6l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 2.7-1.1V3a2 2 0 0 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 0 1 0 4h-.1a1.6 1.6 0 0 0-1 .9z"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  warn:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6A2 2 0 0 0 22 18L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 2"/>',
  plus:'<path d="M12 5.5v13M5.5 12h13"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .9-1 1.6v.3"/><path d="M12 17h.01"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  award:'<circle cx="12" cy="8" r="6"/><path d="M8.2 13.7 7 22l5-3 5 3-1.2-8.3"/>',
  megaphone:'<path d="M3 11v3a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M16 9a4 4 0 0 1 0 6"/>'
};
const svg = (d, w = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

const lyd = v => Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' د.ل';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt = v => { if(!v) return '—'; const d = v.toDate ? v.toDate() : new Date(v); return isNaN(d) ? '—' : d.toLocaleDateString('ar-LY', { day: '2-digit', month: 'short' }) + ' · ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); };
const shortDate = v => { const d = v.toDate ? v.toDate() : new Date(v); return isNaN(d) ? '—' : d.toLocaleDateString('ar-LY', { day: 'numeric', month: 'short' }); };

function toast(msg, kind = '') {

}

async function adjustWallet(uid, delta, reason) {
  const userRef = doc(db, 'users', uid);
  const userSnap = await getDoc(userRef);
  if(!userSnap.exists()) throw new Error('المستخدم غير موجود');
  const oldBal = n(userSnap.data().wallet_balance);
  const newBal = Math.max(0, oldBal + delta);
  await setDoc(userRef, { wallet_balance: newBal }, { merge: true });
  await addDoc(collection(db, 'wallet_transactions'), {
    uid, type: delta > 0 ? 'credit' : 'debit', amount: Math.abs(delta),
    balance_after: newBal, reason, by: 'admin',
    admin_email: auth.currentUser.email, created_at: new Date()
  });
}

async function toggleBan(uid) {
  const userRef = doc(db, 'users', uid);
  const userSnap = await getDoc(userRef);
  if(!userSnap.exists()) throw new Error('المستخدم غير موجود');
  await setDoc(userRef, { banned: !userSnap.data().banned, banned_at: new Date() }, { merge: true });
}

async function approveDeposit(depId) {
  const depRef = doc(db, 'wallet_deposits', depId);
  const depSnap = await getDoc(depRef);
  if(!depSnap.exists()) throw new Error('الإيداع غير موجود');
  const dep = depSnap.data();
  await setDoc(depRef, { status: 'approved', approved_at: new Date(), approved_by: auth.currentUser.email }, { merge: true });
  const userRef = doc(db, 'users', dep.uid);
  const userSnap = await getDoc(userRef);
  const newBal = n(userSnap.data().wallet_balance) + n(dep.amount_usd);
  await setDoc(userRef, { wallet_balance: newBal }, { merge: true });
  await addDoc(collection(db, 'wallet_transactions'), {
    uid: dep.uid, type: 'credit', amount: n(dep.amount_usd),
    balance_after: newBal, reason: `إيداع مقبول من ${dep.method}`, by: 'admin',
    admin_email: auth.currentUser.email, created_at: new Date()
  });
}

async function rejectDeposit(depId) {
  await setDoc(doc(db, 'wallet_deposits', depId), {
    status: 'rejected', rejected_at: new Date(), rejected_by: auth.currentUser.email
  }, { merge: true });
}

async function fulfillCardOrder(orderId, cardData) {
  const orderRef = doc(db, 'manual_card_orders', orderId);
  const orderSnap = await getDoc(orderRef);
  if(!orderSnap.exists()) throw new Error('الطلب غير موجود');
  const order = orderSnap.data();
  await setDoc(orderRef, {
    status: 'completed', fulfilled_at: new Date(), fulfilled_by: auth.currentUser.email,
    ...(cardData && { card_number: cardData.card_number, expiry: cardData.expiry, cvv: cardData.cvv })
  }, { merge: true });
  if(order.kind !== 'topup' && cardData) {
    await addDoc(collection(db, 'manual_cards'), {
      uid: order.uid, order_id: orderId,
      card_number: cardData.card_number, expiry: cardData.expiry, cvv: cardData.cvv,
      name_on_card: order.name_on_card || '', amount: order.amount,
      status: 'active', created_at: new Date()
    });
  }
}

async function rejectCardOrder(orderId, reason) {
  const orderRef = doc(db, 'manual_card_orders', orderId);
  const orderSnap = await getDoc(orderRef);
  if(!orderSnap.exists()) throw new Error('الطلب غير موجود');
  const order = orderSnap.data();
  await setDoc(orderRef, {
    status: 'rejected', rejected_at: new Date(), rejected_by: auth.currentUser.email, reason
  }, { merge: true });
  const userRef = doc(db, 'users', order.uid);
  const userSnap = await getDoc(userRef);
  const newBal = n(userSnap.data().wallet_balance) + n(order.total);
  await setDoc(userRef, { wallet_balance: newBal }, { merge: true });
  await addDoc(collection(db, 'wallet_transactions'), {
    uid: order.uid, type: 'refund', amount: n(order.total),
    balance_after: newBal, reason: `استرجاع طلب: ${reason}`, by: 'admin',
    admin_email: auth.currentUser.email, created_at: new Date()
  });
}

async function replyTicket(ticketId, message) {
  const ref = doc(db, 'tickets', ticketId);
  const snap = await getDoc(ref);
  if(!snap.exists()) throw new Error('التذكرة غير موجودة');
  const messages = snap.data().messages || [];
  messages.push({ by: 'admin', admin_email: auth.currentUser.email, text: message, at: new Date() });
  await setDoc(ref, { messages, status: 'answered', updated_at: new Date() }, { merge: true });
}

async function closeTicket(ticketId) {
  await setDoc(doc(db, 'tickets', ticketId), { status: 'closed', closed_at: new Date(), closed_by: auth.currentUser.email }, { merge: true });
}

async function saveSettingsFS(payload) {
  await setDoc(doc(db, 'settings', 'main'), payload, { merge: true });
}

/* ═══ Subscribe ═══ */
function sub(q, key) {
  S.unsub.push(onSnapshot(q, s => {
    S[key] = s.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => console.warn(key, err.code)));
}

function subscribeAll() {
  sub(query(collection(db, 'users'), orderBy('created_at', 'desc'), limit(300)), 'users');
  sub(query(collection(db, 'manual_card_orders'), orderBy('created_at', 'desc'), limit(300)), 'cardOrders');
  sub(query(collection(db, 'manual_cards'), orderBy('created_at', 'desc'), limit(300)), 'cards');
  sub(query(collection(db, 'wallet_deposits'), orderBy('created_at', 'desc'), limit(200)), 'deposits');
  sub(query(collection(db, 'tickets'), orderBy('updated_at', 'desc'), limit(100)), 'tickets');
  sub(query(collection(db, 'vip_plans')), 'vipPlans');
  sub(query(collection(db, 'subscriptions'), orderBy('created_at', 'desc'), limit(200)), 'vipSubs');
  sub(query(collection(db, 'ads')), 'ads');

  // ✅ قراءة الإعدادات
  S.unsub.push(onSnapshot(doc(db, 'settings', 'main'), s => {
    if(s.exists()) {
      S.stats = S.stats || {};
      S.stats.settings = s.data();
      render();
    }
  }, err => console.warn('settings', err.code)));
}

function buildNav() {
  const groups = {};
  PAGES.forEach(p => { if(!groups[p.g]) groups[p.g] = []; groups[p.g].push(p); });
  let rail = '';
  for(const [g, items] of Object.entries(groups)) {
    rail += `<div class="nav-group">${g}</div>`;
    items.forEach(p => {
      const c = p.badge ? badges[p.badge]() : 0;
      rail += `<button class="nav ${S.page === p.k ? 'on' : ''}" data-nav="${p.k}">${svg(p.i)}<span>${p.t}</span>${c ? `<span class="cnt">${c}</span>` : ''}</button>`;
    });
  }
  $('#navRail').innerHTML = rail;
  const dk = DOCK.map(k => PAGES.find(p => p.k === k)).filter(Boolean);
  $('#navDock').style.gridTemplateColumns = `repeat(${dk.length}, 1fr)`;
  $('#navDock').innerHTML = dk.map(p => {
    const c = p.badge ? badges[p.badge]() : 0;
    return `<button class="dk ${S.page === p.k ? 'on' : ''}" data-nav="${p.k}">${c ? `<span class="cnt">${c}</span>` : ''}${svg(p.i)}<span>${p.t.replace('ال','').slice(0,6)}</span></button>`;
  }).join('');

}

window.go = k => { S.page = k; S.search = ''; S.filter = 'all'; window.scrollTo({ top: 0 }); render(); };

let _raf = null;
function render() { if(_raf) return; _raf = requestAnimationFrame(() => { _raf = null; paint(); }); }

function paint() {
  buildNav();
  $$('[data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === S.page));
  const page = PAGES.find(p => p.k === S.page);
  $('#barTitle').textContent = page ? page.t : 'لوحة التحكم';
  const V = { home: vHome, orders: vOrders, users: vUsers, deposits: vDeposits, tickets: vTickets, vip: vVip, ads: vAds, settings: vSettings };
  $('#view').innerHTML = (V[S.page] || vHome)();
  bind();
}

function bind() {
  $$('[data-nav]').forEach(b => b.onclick = () => go(b.dataset.nav));
  const rBtn = $('#refreshBtn');
  if(rBtn) rBtn.onclick = () => { rBtn.classList.add('on'); setTimeout(() => rBtn.classList.remove('on'), 400); render(); };
  $$('[data-search]').forEach(input => {
    input.oninput = e => {
      S.search = e.target.value.toLowerCase();
      clearTimeout(input._t);
      input._t = setTimeout(() => render(), 250);
    };
  });
  $$('[data-filter]').forEach(b => { b.onclick = () => { S.filter = b.dataset.filter; render(); }; });
  bindPage();
}

function bindPage() {
  if(S.page === 'orders') bindOrders();
  if(S.page === 'users') bindUsers();
  if(S.page === 'deposits') bindDeposits();
  if(S.page === 'tickets') bindTickets();
  if(S.page === 'vip') bindVip();
  if(S.page === 'ads') bindAds();
  if(S.page === 'settings') bindSettings();
}

function openFulfilSheet(orderId) {
  const o = S.cardOrders.find(x => x.id === orderId);
  if(!o) return;
  const u = S.users.find(x => x.id === o.uid);
  const isTopup = o.kind === 'topup';

  sheet(`
    <div class="sheet-head"><div style="flex:1;min-width:0">
      <div class="h2">${isTopup ? 'شحن بطاقة' : 'إصدار بطاقة جديدة'}</div>
      <div class="sub">${esc(u ? (u.name || u.email) : '—')} · ${usd(o.amount)}</div>
    </div></div>

    <div class="box" style="background:var(--s2);margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span class="sub">المبلغ</span><span class="num">${usd(o.amount)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span class="sub">الرسوم</span><span class="num">${usd(o.fee)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:8px 0"><span class="sub">الإجمالي المدفوع</span><span class="num" style="color:var(--g);font-weight:800">${usd(o.total)}</span></div>
      ${o.name_on_card ? `<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);margin-top:4px"><span class="sub">اسم حامل البطاقة</span><span class="mono" dir="ltr">${esc(o.name_on_card)}</span></div>` : ''}
    </div>

    ${!isTopup ? `
      <label class="lbl">رقم البطاقة (16 رقمًا)</label>
      <input class="inp mono" id="fPan" type="text" dir="ltr" placeholder="5395 0212 3456 7890" maxlength="19" inputmode="numeric" style="margin-bottom:14px">
      <div class="grid2" style="margin-bottom:14px">
        <div><label class="lbl">تاريخ الانتهاء</label><input class="inp mono" id="fExp" type="text" dir="ltr" placeholder="12/28" maxlength="5"></div>
        <div><label class="lbl">CVV</label><input class="inp mono" id="fCvv" type="text" dir="ltr" placeholder="123" maxlength="4" inputmode="numeric"></div>
      </div>` : `<div class="note ok" style="margin-bottom:16px">هذا الطلب <strong>لشحن بطاقة موجودة</strong>. نفّذ الشحن من Zid Cash ثم اضغط تأكيد.</div>`}

    <button class="btn wide" id="fGo" style="margin-top:8px">${isTopup ? 'تأكيد الشحن' : 'تسليم البيانات للعميل'}</button>
    <button class="btn bad wide" style="margin-top:10px" id="fRej">رفض الطلب وإرجاع المبلغ</button>
    <button class="btn line wide" style="margin-top:10px" onclick="closeSheet()">إلغاء</button>`);

  const fPan = $('#fPan'); if(fPan) fPan.oninput = e => { let v = e.target.value.replace(/\D/g, '').slice(0, 16); e.target.value = v.replace(/(.{4})/g, '$1 ').trim(); };
  const fExp = $('#fExp'); if(fExp) fExp.oninput = e => { let v = e.target.value.replace(/\D/g, '').slice(0, 4); if(v.length > 2) v = v.slice(0, 2) + '/' + v.slice(2); e.target.value = v; };
  const fCvv = $('#fCvv'); if(fCvv) fCvv.oninput = e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4); };

  $('#fGo').onclick = async () => {
    const btn = $('#fGo');
    const cardData = {};
    if(!isTopup) {
      const pan = ($('#fPan').value || '').replace(/\s+/g, '');
      const exp = $('#fExp').value || '';
      const cvv = $('#fCvv').value || '';
      if(!/^\d{16}$/.test(pan)) return toast('رقم البطاقة يجب أن يكون 16 رقمًا', 'bad');
      if(!/^\d{2}\/\d{2}$/.test(exp)) return toast('صيغة التاريخ MM/YY', 'bad');
      if(!/^\d{3}$/.test(cvv)) return toast('CVV يجب أن يكون 3 أرقام', 'bad');
      cardData.card_number = pan; cardData.expiry = exp; cardData.cvv = cvv;
    }
    btn.disabled = true; btn.classList.add('loading');
    try {
      await fulfillCardOrder(orderId, isTopup ? null : cardData);
      toast('تم التنفيذ وتسليم البيانات للعميل', 'ok');
      closeSheet();
    } catch(e) { toast(e.message, 'bad'); btn.disabled = false; btn.classList.remove('loading'); }
  };

  $('#fRej').onclick = () => {
    sheet(`<div class="h2" style="margin-bottom:10px">رفض الطلب</div>
      <div class="note bad">سيُعاد ${usd(o.total)} كاملة إلى محفظة العميل.</div>
      <label class="lbl">سبب الرفض (اختياري)</label>
      <input class="inp" id="rjWhy" placeholder="مثال: تعذّر التنفيذ" style="margin-bottom:16px">
      <button class="btn bad wide" id="rjGo">تأكيد الرفض والاسترجاع</button>
      <button class="btn line wide" style="margin-top:10px" onclick="openFulfilSheet('${esc(orderId)}')">رجوع</button>`);
    $('#rjGo').onclick = async () => {
      const btn = $('#rjGo'); btn.disabled = true; btn.classList.add('loading');
      try {
        await rejectCardOrder(orderId, $('#rjWhy').value.trim() || 'بدون سبب');
        toast('تم الرفض وأُرجع المبلغ للعميل', 'ok'); closeSheet();
      } catch(e) { toast(e.message, 'bad'); btn.disabled = false; btn.classList.remove('loading'); }
    };
  };
}

      <div class="flex-b" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="sub">إجمالي الإنفاق</span><span class="num">${usd(u.total_spent)}</span></div>

    <input class="inp" id="pNameEn" value="${esc(p.name_en)}" placeholder="Basic" dir="ltr" style="margin-bottom:14px">

      <div><label class="lbl">عدد البطاقات المسموح</label><input class="inp num" id="pCards" type="number" step="1" value="${n(p.cards_count, 3)}"></div>
    </div>
    <label class="lbl">المدة (أيام)</label>
    <input class="inp num" id="pDays" type="number" step="1" value="${n(p.duration_days, 30)}" style="margin-bottom:14px">
    <label class="lbl">المميزات (سطر لكل ميزة)</label>
    <textarea class="inp" id="pFeatures" rows="4" placeholder="دعم أولوي&#10;إصدار فوري">${Array.isArray(p.features) ? p.features.join('\n') : ''}</textarea>
    <div class="sw-row" style="margin-top:14px">
      <div><div class="sw-lbl">الأكثر طلبًا</div><div class="sw-desc">شارة على البطاقة</div></div>
      <div class="sw ${p.popular ? 'on' : ''}" id="pPopular"></div>
    </div>
    <div class="sw-row">
      <div><div class="sw-lbl">نشطة</div><div class="sw-desc">ظاهرة للعملاء</div></div>
      <div class="sw ${p.active !== false ? 'on' : ''}" id="pActive"></div>
    </div>
    <label class="lbl" style="margin-top:14px">الترتيب</label>
    <input class="inp num" id="pOrder" type="number" step="1" value="${n(p.order, 99)}" style="margin-bottom:16px">
    <button class="btn wide" id="pSave">${id ? 'حفظ التعديلات' : 'إنشاء الباقة'}</button>
    ${id ? `<button class="btn bad wide" style="margin-top:10px" id="pDel">حذف الباقة</button>` : ''}
    <button class="btn line wide" style="margin-top:10px" onclick="closeSheet()">إلغاء</button>`);

  $('#pPopular').onclick = e => e.currentTarget.classList.toggle('on');
  $('#pActive').onclick = e => e.currentTarget.classList.toggle('on');
  $('#pSave').onclick = async () => {
    const btn = $('#pSave');
    const name = $('#pName').value.trim();
    if(!name) return toast('اكتب اسم الباقة', 'bad');
    const data = {
      name, name_en: $('#pNameEn').value.trim(),
      price_usd: n($('#pPrice').value), cards_count: n($('#pCards').value),
      duration_days: n($('#pDays').value, 30),
      features: $('#pFeatures').value.split('\n').map(x => x.trim()).filter(Boolean).slice(0, 10),
      popular: $('#pPopular').classList.contains('on'),
      active: $('#pActive').classList.contains('on'),
      order: n($('#pOrder').value, 99)
    };
    if(data.price_usd <= 0) return toast('السعر غير صحيح', 'bad');
    if(data.cards_count <= 0) return toast('عدد البطاقات غير صحيح', 'bad');
    btn.disabled = true; btn.classList.add('loading');
    try {
      if(id) await setDoc(doc(db, 'vip_plans', id), data, { merge: true });
      else await addDoc(collection(db, 'vip_plans'), { ...data, created_at: new Date().toISOString() });
      toast(id ? 'تم حفظ التعديلات' : 'تم إنشاء الباقة', 'ok'); closeSheet();
    } catch(e) { toast(e.message, 'bad'); btn.disabled = false; btn.classList.remove('loading'); }
  };
  if(id) $('#pDel').onclick = async () => {
    if(!confirm('حذف هذه الباقة نهائيًا؟')) return;
    try { await deleteDoc(doc(db, 'vip_plans', id)); toast('تم حذف الباقة', 'ok'); closeSheet(); }
    catch(e) { toast(e.message, 'bad'); }
  };
}

function bindSettings() {
  $$('[data-settab]').forEach(b => { b.onclick = () => { S.setTab = b.dataset.settab; render(); }; });
  $$('[data-op]').forEach(el => {
    if(el.type === 'color' || el.type === 'number' || el.type === 'text') return;
    el.onclick = () => el.classList.toggle('on');
  });
  $$('[data-save="ops"]').forEach(b => { b.onclick = () => saveSettings(b); });
}

async function saveSettings(btn) {
  const payload = {};
  $$('.sw[data-op]').forEach(el => {
    let v = el.classList.contains('on');
    if(el.dataset.inverse) v = !v;
    payload[el.dataset.op] = v;
  });
  $$('input[data-op], textarea[data-op]').forEach(el => {
    payload[el.dataset.op] = el.type === 'number' ? n(el.value) : el.value;
  });
  if(!Object.keys(payload).length) return;
  btn.disabled = true; btn.classList.add('loading');
  try { await saveSettingsFS(payload); toast('تم حفظ الإعدادات', 'ok'); }
  catch(e) { toast(e.message, 'bad'); }
  btn.disabled = false; btn.classList.remove('loading');
}

function onTap(sel, fn) { const el = $(sel); if(el) el.onclick = fn; }
</script>
