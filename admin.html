<html lang="ar" dir="rtl">

<style>
:root{--navy:#0F172A;--navy-2:#1B2438;--emerald:#10B981;--emerald-d:#059669;
  --bg:#F8FAFC;--muted:#64748B;--border:#E2E8F0;--error:#EF4444;--warn:#F59E0B;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);
  color:var(--navy);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit;width:100%}

svg{flex:none}
.btn svg{width:16px;height:16px}
.btn.sm svg{width:14px;height:14px}
.kpi .ico svg{width:17px;height:17px}
.alert svg{width:19px;height:19px;margin-top:2px}

:focus-visible{outline:2px solid var(--emerald);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:8px}

.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
@media(min-width:1024px){.shell{grid-template-columns:1fr 258px}}
.side{display:none;background:var(--navy);color:#fff;padding:22px 17px;
  position:sticky;top:0;height:100vh;flex-direction:column;grid-column:2}
@media(min-width:1024px){.side{display:flex}}
.navlink{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 13px;border-radius:11px;color:#94A3B8;font-size:14px;
  font-weight:500;transition:.16s;margin-bottom:3px;width:100%}
.navlink:hover{background:rgba(255,255,255,.06);color:#fff}
.navlink.on{background:var(--emerald);color:#fff}
.navlink .l{display:flex;align-items:center;gap:11px}
.navlink svg{width:19px;height:19px;flex:none}
.badge{background:var(--warn);color:#fff;font-size:11px;font-weight:700;
  padding:1px 7px;border-radius:999px;min-width:20px;text-align:center}
.main{grid-column:1;min-width:0;padding-bottom:80px}
@media(min-width:1024px){.main{padding-bottom:30px}}

.top{position:sticky;top:0;z-index:30;background:rgba(248,250,252,.9);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  padding:12px 16px;display:flex;align-items:center;gap:11px}
@media(min-width:1024px){.top{padding:14px 28px}}
.wrap{padding:18px 16px;max-width:1280px}
@media(min-width:1024px){.wrap{padding:24px 28px}}

.tabbar{position:fixed;inset:auto 0 0 0;z-index:40;background:var(--navy);
  display:flex;overflow-x:auto;padding:8px}
@media(min-width:1024px){.tabbar{display:none}}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 12px;
  color:#64748B;font-size:10.5px;font-weight:500;flex:none;border-radius:10px;position:relative}
.tab.on{color:var(--emerald)}
.tab svg{width:20px;height:20px}
.tab .dot{position:absolute;top:2px;left:8px;width:7px;height:7px;
  border-radius:50%;background:var(--warn)}

.box{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:17px}
.h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
.h2{font-size:15.5px;font-weight:600}
.sub{color:var(--muted);font-size:13.5px}
.lbl{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px;display:block}

.inp{border:1px solid var(--border);border-radius:10px;padding:11px 12px;background:#fff;transition:.15s}
.inp:focus{outline:none;border-color:var(--emerald);box-shadow:0 0 0 3px rgba(16,185,129,.11)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 18px;border-radius:10px;font-weight:600;font-size:14px;
  background:var(--emerald);color:#fff;transition:.16s}
.btn:hover:not(:disabled){background:var(--emerald-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.dark{background:var(--navy)}
.btn.ghost{background:#fff;border:1px solid var(--border);color:var(--navy)}
.btn.ghost:hover:not(:disabled){background:var(--bg)}
.btn.danger{background:#fff;border:1px solid #FECACA;color:var(--error)}
.btn.sm{padding:8px 13px;font-size:12.5px;border-radius:9px}
.btn.wide{width:100%}

.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;
  font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:#D1FAE5;color:#065F46}
.pill.wait{background:#FEF3C7;color:#92400E}
.pill.bad{background:#FEE2E2;color:#991B1B}
.pill.off{background:#E2E8F0;color:#475569}

.kpis{display:grid;gap:11px;grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1180px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.kpi .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:9px}
.kpi .v{font-size:19px;font-weight:700;letter-spacing:-.03em}
.kpi .k{font-size:12px;color:var(--muted)}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:right;padding:10px 11px;color:var(--muted);font-size:11.5px;
  font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg)}
.tbl td{padding:11px;border-bottom:1px solid #F1F5F9;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.warn td{background:#FFFBEB}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}

.alert{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;
  padding:13px 15px;border-radius:12px;font-size:13.5px;margin-bottom:16px;
  display:flex;gap:10px;align-items:flex-start}
.banner{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;
  padding:11px 14px;border-radius:11px;font-size:13px;margin-bottom:16px}

.sk{background:linear-gradient(90deg,#EEF2F7 25%,#E2E8F0 37%,#EEF2F7 63%);
  background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:8px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty svg{width:40px;height:40px;margin:0 auto 12px;opacity:.32;display:block}

#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;gap:8px;width:min(92vw,400px)}
.toast{background:var(--navy);color:#fff;padding:13px 15px;border-radius:12px;font-size:14px;
  box-shadow:0 12px 30px -10px rgba(15,23,42,.5);animation:tin .26s ease}
.toast.ok{background:var(--emerald-d)}.toast.bad{background:var(--error)}
@keyframes tin{from{opacity:0;transform:translateY(-14px)}}

.ov{position:fixed;inset:0;z-index:120;background:rgba(15,23,42,.55);
  display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.ov.show{display:flex}
@media(min-width:640px){.ov{align-items:center}}
.sheet{background:#fff;width:100%;max-width:470px;border-radius:20px 20px 0 0;
  padding:22px;max-height:92vh;overflow-y:auto}
@media(min-width:640px){.sheet{border-radius:18px}}

.field{display:grid;grid-template-columns:1fr 118px;gap:11px;align-items:center;
  padding:11px 0;border-bottom:1px solid #F1F5F9}
.field:last-child{border-bottom:none}
.field .n{font-size:13.5px;font-weight:500}
.field .d{font-size:11.5px;color:var(--muted)}
.field input{text-align:center;padding:9px}

.sw{width:46px;height:26px;border-radius:999px;background:var(--border);
  position:relative;transition:.2s;flex:none;cursor:pointer}
.sw.on{background:var(--emerald)}
.sw::after{content:'';position:absolute;top:3px;right:3px;width:20px;height:20px;
  border-radius:50%;background:#fff;transition:.2s}
.sw.on::after{right:23px}

.spark{display:flex;align-items:flex-end;gap:3px;height:64px}
.spark i{flex:1;background:var(--emerald);border-radius:3px 3px 0 0;min-height:3px;opacity:.85}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hide{display:none!important}

#gate{min-height:100vh;display:grid;place-items:center;padding:22px;background:var(--navy)}
.gatebox{background:#fff;border-radius:20px;padding:28px;width:min(100%,390px)}
</style>
</head>
<body>

<div id="gate">
  <div class="gatebox">
    <div style="display:flex;align-items:center;gap:11px;margin-bottom:4px">
      <span id="gateMark"></span>
      <div><div style="font-size:21px;font-weight:700;letter-spacing:-.02em">Kardo</div>
        <div style="font-size:12px;color:var(--muted)">لوحة الإدارة</div></div>
    </div>

      <input class="inp" id="gEmail" type="email" dir="ltr" autocomplete="email"></div>
    <div style="margin-bottom:18px"><label class="lbl">كلمة المرور</label>
      <input class="inp" id="gPass" type="password" autocomplete="current-password"></div>
    <button class="btn wide dark" id="gGo">تسجيل الدخول</button>
    <p id="gErr" class="hide" style="color:var(--error);font-size:13px;margin-top:12px;text-align:center"></p>
  </div>
</div>

<div id="app" style="display:none">
<div class="shell">

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <span id="sideMark"></span>
      <div><div style="font-size:18px;font-weight:700;letter-spacing:-.02em">Kardo</div>
        <div style="font-size:11px;color:#64748B">لوحة الإدارة</div></div>
    </div>
    <div style="height:22px"></div>
    <nav id="navDesk"></nav>
    <div style="margin-top:auto;padding-top:18px;border-top:1px solid rgba(255,255,255,.09)">
      <div style="padding:0 3px 12px;font-size:12.5px">
        <div id="admName" style="font-weight:600"></div>
        <div style="color:#64748B;font-size:11px">مدير النظام</div></div>
      <button class="navlink" onclick="confirmOut()"><span class="l">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        تسجيل الخروج</span></button>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div style="display:flex;align-items:center;gap:9px" class="lg-hide">
        <span id="topMark"></span>
        <span style="font-size:16px;font-weight:700">لوحة الإدارة</span>
      </div>
      <div style="margin-inline-start:auto;display:flex;align-items:center;gap:9px">
        <span id="floatChip" class="pill off"></span>
        <button class="btn ghost sm" onclick="reconcile()">مطابقة</button>
      </div>
    </header>
    <main class="wrap" id="view"></main>
  </div>
</div>
<nav class="tabbar" id="navMob"></nav>
</div>

<div id="toasts"></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<style>@media(min-width:1024px){.lg-hide{display:none}}</style>

  setTimeout(()=>{e.style.opacity='0';e.style.transition='.25s';setTimeout(()=>e.remove(),250)},3600); }

  if(DEMO){ await new Promise(r=>setTimeout(r,480)); return {success:true, orphans:[], provider_total:2}; }

    headers:{'content-type':'application/json',authorization:'Bearer '+token},
    body: JSON.stringify(body||{}) });
  const d = await res.json().catch(()=>({success:false,error:'رد غير مفهوم'}));
  if(!d.success) throw new Error(d.error||'فشلت العملية');
  return d;

  onAuthStateChanged(auth, async user=>{
    S.unsub.forEach(u=>{try{u()}catch{}}); S.unsub=[];
    if(!user){ $('#gate').style.display='grid'; $('#app').style.display='none'; return; }
    const snap = await getDoc(doc(db,'admins',user.uid)).catch(()=>null);
    if(!snap || !snap.exists()){
      await signOut(auth);
      $('#gate').style.display='grid';
      showErr('هذا الحساب ليس لديه صلاحية إدارة.');
      return;
    }
    S.admin = {uid:user.uid, email:user.email, ...snap.data()};
    subscribe();
    boot();
  });
}

function sub(q, key){
  S.unsub.push(onSnapshot(q, s=>{
    S[key] = s.docs.map(d=>({id:d.id,...d.data()}));
    render();
  }, err=>console.warn(key, err.code)));
}
function subscribe(){
  sub(query(collection(db,'users'), orderBy('created_at','desc'), limit(200)),'users');
  sub(query(collection(db,'cards'), orderBy('created_at','desc'), limit(300)),'cards');
  sub(query(collection(db,'card_orders'), orderBy('created_at','desc'), limit(300)),'orders');
  sub(query(collection(db,'wallet_deposits'), orderBy('created_at','desc'), limit(200)),'deposits');
  sub(query(collection(db,'card_logs'), orderBy('created_at','desc'), limit(80)),'logs');
  S.unsub.push(onSnapshot(doc(db,'card_settings','pricing'), s=>{
    if(s.exists()) S.pricing = s.data(); render(); }, ()=>{}));
  S.unsub.push(onSnapshot(doc(db,'card_settings','ops'), s=>{
    if(s.exists()) S.ops = s.data(); render(); }, ()=>{}));
}

  $('#gate').style.display='none';

function exportCsv(){
  const head = ['العميل','البطاقة','آخر4','القيمة','دفع العميل','التكلفة','الربح','الحالة','التاريخ','معرّف المزود'];

    userName(c.uid), c.card_name||'', c.last4||'', n(c.amount_loaded),
    n(c.customer_paid), n(c.provider_cost), n(c.profit), c.status||'',
    dt(c.created_at), c.id
  ].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')));

  const blob = new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `kardo-cards-${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('نُزّل الملف','ok');
}

      toast('حُدّث الرصيد','ok'); closeSheet(); render();
    }catch(e){ toast(e.message,'bad'); $('#adjGo').disabled=false; }
  };

  $('#banGo').onclick = ()=>{
    sheet(`<div class="h2" style="margin-bottom:8px">
        ${u.banned?'إلغاء الإيقاف':'إيقاف'} ${esc(u.name||'المستخدم')}</div>
      <p class="sub" style="margin-bottom:18px">${u.banned
        ? 'سيتمكن المستخدم من إصدار البطاقات مرة أخرى.'
        : 'لن يتمكن المستخدم من إصدار أو شحن البطاقات. بطاقاته الحالية تبقى كما هي.'}</p>
      <button class="btn wide ${u.banned?'':'danger'}" id="banYes">تأكيد</button>
      <button class="btn ghost wide" style="margin-top:9px"
        onclick="userSheet('${esc(uid)}')">رجوع</button>`);
    $('#banYes').onclick = async ()=>{
      $('#banYes').disabled = true;
      try{
        await api('/api/admin/wallet-adjust',{uid, delta:0.0001,
          reason:(u.banned?'إلغاء إيقاف':'إيقاف')+' الحساب'});
        if(DEMO) u.banned = !u.banned;
        toast(u.banned?'أُوقف الحساب':'أُلغي الإيقاف','ok');
        closeSheet(); render();
      }catch(e){ toast('يحتاج endpoint مخصص للحظر — أضفه في الـWorker','bad'); $('#banYes').disabled=false; }
    };
  };
}
window.userSheet = userSheet;

/* ─── Deposits ─── */
function vDeposits(){
  const DST = {pending:['wait','قيد المراجعة'],approved:['ok','مقبول'],rejected:['bad','مرفوض']};
  const pend = S.deposits.filter(d=>d.status==='pending');
  const rest = S.deposits.filter(d=>d.status!=='pending');

  const row = d=>{
    const st = DST[d.status]||['off','—'];
    return `<div class="box" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;gap:11px;flex-wrap:wrap">
        <div>
          <div style="font-weight:700;font-size:16px" class="num">${usd(d.amount_usd)}
            <span style="font-weight:400;font-size:12.5px;color:var(--muted)">
              · ${n(d.amount_lyd).toLocaleString('en-US')} د.ل</span></div>
          <div style="font-size:13.5px;margin-top:2px">${esc(userName(d.uid))}</div>
          <div class="sub" style="font-size:12px">${esc(d.method||'—')} · ${dt(d.created_at)}</div>
          ${d.note?`<div class="sub" style="font-size:12px;margin-top:3px">${esc(d.note)}</div>`:''}
          ${d.proof_url?`<a href="${esc(d.proof_url)}" target="_blank" rel="noopener"
            style="color:var(--emerald-d);font-size:12.5px;font-weight:600">عرض الإثبات ↗</a>`:''}
          ${d.reject_reason?`<div style="font-size:12px;color:var(--error);margin-top:3px">
            ${esc(d.reject_reason)}</div>`:''}
        </div>
        <div style="display:flex;flex-direction:column;gap:7px;align-items:flex-end">
          <span class="pill ${st[0]}">${st[1]}</span>
          ${d.status==='pending' ? `
            <button class="btn sm" data-dep-ok="${esc(d.id)}">قبول</button>
            <button class="btn ghost sm" data-dep-no="${esc(d.id)}">رفض</button>`:''}
        </div>
      </div></div>`;
  };

  return demoBanner + `
  <div class="h1" style="margin-bottom:4px">إيداعات الرصيد</div>
  <p class="sub" style="margin-bottom:18px">
    ${pend.length ? pend.length+' طلب ينتظر المراجعة' : 'لا طلبات معلّقة'}</p>
  ${pend.length ? `<div class="h2" style="margin-bottom:11px">تنتظر المراجعة</div>
    ${pend.map(row).join('')}<div style="height:14px"></div>`:''}
  ${rest.length ? `<div class="h2" style="margin-bottom:11px">السجل</div>${rest.map(row).join('')}`:''}
  ${!S.deposits.length ? empty(I.cash,'لا إيداعات','ستظهر طلبات شحن المحفظة هنا.'):''}`;
}

async function depAction(id, action){
  const d = S.deposits.find(x=>x.id===id); if(!d) return;

  if(action==='reject'){
    sheet(`<div class="h2" style="margin-bottom:6px">رفض الإيداع</div>
      <p class="sub" style="margin-bottom:14px">${usd(d.amount_usd)} · ${esc(userName(d.uid))}</p>
      <label class="lbl">سبب الرفض — سيراه العميل</label>
      <input class="inp" id="rWhy" placeholder="مثال: لم يُستلم التحويل">
      <button class="btn wide danger" style="margin-top:16px" id="rGo">تأكيد الرفض</button>
      <button class="btn ghost wide" style="margin-top:9px" onclick="closeSheet()">إلغاء</button>`);
    $('#rGo').onclick = async ()=>{
      const why = $('#rWhy').value.trim();
      if(why.length<3) return toast('اكتب السبب','bad');
      $('#rGo').disabled = true;
      try{
        await api('/api/admin/deposit',{deposit_id:id, action:'reject', reason:why});
        if(DEMO){ d.status='rejected'; d.reject_reason=why; }
        toast('رُفض الإيداع','ok'); closeSheet(); render();
      }catch(e){ toast(e.message,'bad'); $('#rGo').disabled=false; }
    };
    return;
  }

  sheet(`<div class="h2" style="margin-bottom:6px">قبول الإيداع</div>
    <p class="sub" style="margin-bottom:8px">
      سيُضاف <strong>${usd(d.amount_usd)}</strong> إلى محفظة ${esc(userName(d.uid))}.</p>
    <div class="banner">تأكد من استلام ${n(d.amount_lyd).toLocaleString('en-US')} د.ل
      فعليًا قبل القبول.</div>
    <button class="btn wide" id="aGo">تأكيد القبول</button>
    <button class="btn ghost wide" style="margin-top:9px" onclick="closeSheet()">إلغاء</button>`);
  $('#aGo').onclick = async ()=>{
    $('#aGo').disabled = true;
    try{
      await api('/api/admin/deposit',{deposit_id:id, action:'approve'});
      if(DEMO){ d.status='approved';
        const u = S.users.find(x=>x.id===d.uid);
        if(u) u.wallet_balance = n(u.wallet_balance)+n(d.amount_usd); }
      toast('قُبل الإيداع وأُضيف الرصيد','ok'); closeSheet(); render();
    }catch(e){ toast(e.message,'bad'); $('#aGo').disabled=false; }
  };
}

/* ─── Settings ─── */
const PFIELDS = [
  ['provider_fixed_fee','رسوم المزود الثابتة','بالدولار لكل عملية · التوثيق: 1.00'],
  ['provider_pct','نسبة رسوم التمويل','% من قيمة البطاقة · التوثيق: 4'],
  ['margin','هامش ربح الإصدار','بالدولار — ربحك من كل بطاقة'],
  ['fund_margin','هامش ربح الشحن','بالدولار — ربحك من كل شحنة'],
  ['deletion_fee','رسوم إغلاق البطاقة','يخصمها المزود · التوثيق: 2.00'],
  ['min_amount','الحد الأدنى للبطاقة','بالدولار · المزود لا يقبل أقل من 10'],
  ['max_amount','الحد الأقصى للبطاقة','بالدولار'],
  ['usd_to_lyd','سعر الدولار بالدينار','لعرض الأسعار للعميل'],
];

function vSettings(){
  const p = S.pricing, o = S.ops;
  const fixed = n(p.provider_fixed_fee,1), pct = n(p.provider_pct,4), mg = n(p.margin,2.6);
  const rate = n(p.usd_to_lyd,7);
  const sample = [10,20,50,100].map(a=>{
    const cost = a + fixed + a*pct/100;
    return {a, cost, price: cost+mg, lyd: Math.ceil((cost+mg)*rate)};
  });

  return demoBanner + `
  <div class="h1" style="margin-bottom:4px">الإعدادات</div>
  <p class="sub" style="margin-bottom:18px">كل الأرقام تُحفظ في قاعدة البيانات ويستخدمها السيرفر في الحساب.</p>

  <div class="banner">
    تحقّق أولًا: أصدر بطاقة $10 عبر API واقرأ <span class="mono">total_charged</span> في الرد.
    لو كان 11.40 فالرسوم 1$+4%. لو كان 16.40 فاجعل الرسوم الثابتة 6.
  </div>

  <div style="display:grid;gap:14px;grid-template-columns:1fr;max-width:600px">

    <div class="box">
      <div class="h2" style="margin-bottom:6px">التشغيل</div>
      <p class="sub" style="font-size:12.5px;margin-bottom:14px">
        عطّل الإصدار فورًا إن حدثت مشكلة مع المزود.</p>

      <div style="display:flex;justify-content:space-between;align-items:center;
           padding:11px 0;border-bottom:1px solid #F1F5F9">
        <div><div style="font-size:13.5px;font-weight:600">إصدار البطاقات</div>
          <div class="sub" style="font-size:11.5px">يظهر القسم للعملاء</div></div>
        <div class="sw ${o.issuing_enabled?'on':''}" data-sw="issuing_enabled"></div></div>

      <div style="display:flex;justify-content:space-between;align-items:center;
           padding:11px 0;border-bottom:1px solid #F1F5F9">
        <div><div style="font-size:13.5px;font-weight:600">شحن البطاقات</div>
          <div class="sub" style="font-size:11.5px">إعادة تعبئة بطاقة موجودة</div></div>
        <div class="sw ${o.funding_enabled?'on':''}" data-sw="funding_enabled"></div></div>

      <div class="field" style="margin-top:6px">
        <div><span class="n">رصيدك عند المزود</span>
          <div class="d">يُدخل يدويًا ويُخصم تلقائيًا — المزود لا يوفّر قراءة الرصيد</div></div>
        <input class="inp num" data-ops="provider_float" type="number" step="0.01"
               value="${n(o.provider_float,0)}"></div>

      <div class="field">
        <div><span class="n">حد التنبيه</span>
          <div class="d">ينبّهك عند نزول الرصيد تحته</div></div>
        <input class="inp num" data-ops="low_balance_threshold" type="number" step="1"
               value="${n(o.low_balance_threshold,30)}"></div>

      <label class="lbl" style="margin-top:14px">رسالة التوقف — تظهر للعملاء عند تعطيل الإصدار</label>
      <input class="inp" data-ops="maintenance_message"
             value="${esc(o.maintenance_message||'')}" placeholder="الخدمة متوقفة مؤقتًا">

      <button class="btn wide" style="margin-top:16px" data-save="ops">حفظ إعدادات التشغيل</button>
    </div>

    <div class="box">
      <div class="h2" style="margin-bottom:6px">التسعير</div>
      <p class="sub" style="font-size:12.5px;margin-bottom:10px">
        السعر النهائي = قيمة البطاقة + رسوم المزود + هامشك.</p>
      ${PFIELDS.map(([k,label,desc])=>`
        <div class="field"><div><span class="n">${label}</span><div class="d">${desc}</div></div>
          <input class="inp num" data-pricing="${k}" type="number" step="0.01"
                 value="${n(S.pricing[k], k==='provider_pct'?4:k==='min_amount'?10:
                   k==='max_amount'?200:k==='usd_to_lyd'?7:k==='margin'?2.6:
                   k==='fund_margin'?1.5:k==='deletion_fee'?2:1)}"></div>`).join('')}

      <div class="field">
        <div><span class="n">نوع البطاقة (BIN)</span>
          <div class="d">539502 و525847 لا تطلبان تاريخ ميلاد من العميل</div></div>
        <select class="inp" data-pricing="default_bin" style="text-align:center">
          ${['539502','525847','537872','533171','246001'].map(b=>
            `<option ${String(S.pricing.default_bin||'539502')===b?'selected':''}>${b}</option>`).join('')}
        </select></div>

      <button class="btn wide" style="margin-top:16px" data-save="pricing">حفظ التسعير</button>
    </div>

    <div class="box">
      <div class="h2" style="margin-bottom:12px">معاينة الأسعار بالإعدادات الحالية</div>
      <div class="scrollx"><table class="tbl"><thead><tr>
        <th>البطاقة</th><th>تكلفتك</th><th>سعر العميل</th><th>بالدينار</th><th>ربحك</th>
      </tr></thead><tbody>${sample.map(s=>`<tr>
        <td class="num" style="font-weight:600">${usd(s.a)}</td>
        <td class="num" style="color:var(--muted)">${usd(s.cost)}</td>
        <td class="num" style="font-weight:600">${usd(s.price)}</td>
        <td class="num">${s.lyd.toLocaleString('en-US')} د.ل</td>
        <td class="num" style="color:var(--emerald-d);font-weight:600">${usd(mg)}</td>
      </tr>`).join('')}</tbody></table></div>
    </div>

    ${S.logs.length ? `<div class="box">
      <div class="h2" style="margin-bottom:12px">آخر العمليات</div>
      ${S.logs.slice(0,12).map(l=>`
        <div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;
             border-bottom:1px solid #F1F5F9;font-size:12.5px">
          <div style="min-width:0"><div style="font-weight:600">${esc(l.action||'—')}</div>
            <div class="sub" style="font-size:11.5px">${esc(userName(l.uid))} · ${dt(l.created_at)}</div></div>
          <span class="pill ${l.ok?'ok':'bad'}">${l.ok?'ناجحة':'فاشلة'}</span></div>`).join('')}
    </div>`:''}
  </div>`;
}

async function saveSettings(kind){
  const sel = kind==='ops' ? '[data-ops]' : '[data-pricing]';
  const attr = kind==='ops' ? 'ops' : 'pricing';
  const payload = {};

  document.querySelectorAll(sel).forEach(el=>{
    const k = el.dataset[attr];
    payload[k] = el.type==='number' ? n(el.value,0) : el.value;
  });
  document.querySelectorAll('[data-sw]').forEach(el=>{
    if(kind==='ops') payload[el.dataset.sw] = el.classList.contains('on');
  });

  const btn = document.querySelector(`[data-save="${kind}"]`);
  btn.disabled = true;
  try{
    await api('/api/admin/settings', payload);
    if(DEMO){ if(kind==='ops') S.ops={...S.ops,...payload}; else S.pricing={...S.pricing,...payload}; }
    toast('حُفظت الإعدادات','ok'); render();
  }catch(e){ toast(e.message,'bad'); btn.disabled = false; }
}

/* ─── Reconcile ─── */
window.reconcile = async ()=>{
  sheet(`<div class="h2" style="margin-bottom:6px">مطابقة البطاقات</div>
    <p class="sub" style="margin-bottom:16px">
      نقارن بطاقاتك عند المزود مع المسجّلة في النظام لكشف أي بطاقة صُدرت ولم تُحفظ.</p>
    <div id="recBox"><div class="sk" style="height:60px"></div></div>
    <button class="btn ghost wide" style="margin-top:14px" onclick="closeSheet()">إغلاق</button>`);
  try{
    const d = await api('/api/admin/reconcile');
    $('#recBox').innerHTML = d.orphans.length
      ? `<div class="alert">${svg(I.warn)}<div><strong>${d.orphans.length} بطاقة غير مسجّلة</strong><br>
          صُدرت عند المزود ولم تُحفظ في النظام — راجعها يدويًا.</div></div>
        ${d.orphans.map(o=>`<div class="box" style="margin-bottom:8px;padding:12px;font-size:12.5px">
          <div class="mono" style="font-size:11.5px">${esc(o.card_id)}</div>
          <div style="margin-top:3px">••${esc(o.last4||'')} · ${esc(o.name_on_card||'')}
            · ${usd(o.balance)}</div></div>`).join('')}`
      : `<div class="box" style="background:#ECFDF5;border-color:#A7F3D0;padding:16px;
           display:flex;gap:10px;align-items:center">
          <svg viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.6"
               stroke-linecap="round" stroke-linejoin="round"
               style="width:22px;height:22px"><path d="M20 6 9 17l-5-5"/></svg>
          <div style="font-size:13.5px">كل شيء مطابق — ${d.provider_total} بطاقة عند المزود.</div></div>`;
  }catch(e){ $('#recBox').innerHTML = `<div class="alert">${svg(I.warn)}<div>${esc(e.message)}</div></div>`; }
};

/* ─── Bind ─── */
function bind(){
  const q = $('#qBox');
  if(q){
    q.oninput = e=>{
      S.q = e.target.value;
      clearTimeout(q._t);
      q._t = setTimeout(()=>{ render(); const el=$('#qBox'); if(el){el.focus();
        el.setSelectionRange(el.value.length,el.value.length);} }, 260);
    };
  }
  document.querySelectorAll('[data-filter]').forEach(b=>
    b.onclick = ()=>{ S.filter = b.dataset.filter; render(); });
  document.querySelectorAll('[data-order]').forEach(b=>
    b.onclick = ()=> orderSheet(b.dataset.order));
  document.querySelectorAll('[data-user]').forEach(b=>
    b.onclick = ()=> userSheet(b.dataset.user));
  document.querySelectorAll('[data-dep-ok]').forEach(b=>
    b.onclick = ()=> depAction(b.dataset.depOk,'approve'));
  document.querySelectorAll('[data-dep-no]').forEach(b=>
    b.onclick = ()=> depAction(b.dataset.depNo,'reject'));
  document.querySelectorAll('[data-sw]').forEach(el=>
    el.onclick = ()=> el.classList.toggle('on'));
  document.querySelectorAll('[data-save]').forEach(b=>
    b.onclick = ()=> saveSettings(b.dataset.save));
  const csv = $('#csvBtn'); if(csv) csv.onclick = exportCsv;
}
</script>
