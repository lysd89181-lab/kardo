<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F172A">
<title>كاردو — لوحة الإدارة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{--navy:#0F172A;--navy-2:#1B2438;--emerald:#10B981;--emerald-d:#059669;
  --bg:#F8FAFC;--muted:#64748B;--border:#E2E8F0;--error:#EF4444;--warn:#F59E0B;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);
  color:var(--navy);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;width:100%}

svg{width:17px;height:17px;flex:none;display:inline-block;vertical-align:middle}
.btn svg{width:16px;height:16px}
.btn.sm svg{width:14px;height:14px}
.kpi .ico svg{width:17px;height:17px}
.alert svg{width:19px;height:19px;margin-top:2px}
.empty svg{width:40px;height:40px}
.tab svg{width:20px;height:20px}
.navlink svg{width:19px;height:19px}
svg[data-lg]{width:22px;height:22px}

:focus-visible{outline:2px solid var(--emerald);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:8px}

.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
@media(min-width:1024px){.shell{grid-template-columns:1fr 258px}}
.side{display:none;background:var(--navy);color:#fff;padding:22px 17px;
  position:sticky;top:0;height:100vh;flex-direction:column;grid-column:2}
@media(min-width:1024px){.side{display:flex}}
.navlink{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 13px;border-radius:11px;color:#94A3B8;font-size:14px;
  font-weight:500;transition:.16s;margin-bottom:3px;width:100%}
.navlink:hover{background:rgba(255,255,255,.06);color:#fff}
.navlink.on{background:var(--emerald);color:#fff}
.navlink .l{display:flex;align-items:center;gap:11px}
.navlink svg{width:19px;height:19px;flex:none}
.badge{background:var(--warn);color:#fff;font-size:11px;font-weight:700;
  padding:1px 7px;border-radius:999px;min-width:20px;text-align:center}
.main{grid-column:1;min-width:0;padding-bottom:80px}
@media(min-width:1024px){.main{padding-bottom:30px}}

.top{position:sticky;top:0;z-index:30;background:rgba(248,250,252,.9);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  padding:12px 16px;display:flex;align-items:center;gap:11px}
@media(min-width:1024px){.top{padding:14px 28px}}
.wrap{padding:18px 16px;max-width:1280px}
@media(min-width:1024px){.wrap{padding:24px 28px}}

.tabbar{position:fixed;inset:auto 0 0 0;z-index:40;background:var(--navy);
  display:flex;overflow-x:auto;padding:8px}
@media(min-width:1024px){.tabbar{display:none}}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 12px;
  color:#64748B;font-size:10.5px;font-weight:500;flex:none;border-radius:10px;position:relative}
.tab.on{color:var(--emerald)}
.tab svg{width:20px;height:20px}
.tab .dot{position:absolute;top:2px;left:8px;width:7px;height:7px;
  border-radius:50%;background:var(--warn)}

.box{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:17px;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 22px -18px rgba(15,23,42,.26)}
.h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
.h2{font-size:15.5px;font-weight:600}
.sub{color:var(--muted);font-size:13.5px}
.lbl{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px;display:block}

.inp{border:1px solid var(--border);border-radius:10px;padding:11px 12px;background:#fff;transition:.15s}
.inp:focus{outline:none;border-color:var(--emerald);box-shadow:0 0 0 3px rgba(16,185,129,.11)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 18px;border-radius:10px;font-weight:600;font-size:14px;
  background:var(--emerald);color:#fff;transition:.16s}
.btn:hover:not(:disabled){background:var(--emerald-d)}
.btn:active:not(:disabled){transform:scale(.975)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.dark{background:var(--navy)}
.btn.ghost{background:#fff;border:1px solid var(--border);color:var(--navy)}
.btn.ghost:hover:not(:disabled){background:var(--bg)}
.btn.danger{background:#fff;border:1px solid #FECACA;color:var(--error)}
.btn.sm{padding:8px 13px;font-size:12.5px;border-radius:9px}
.btn.wide{width:100%}

.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;
  font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:#D1FAE5;color:#065F46}
.pill.wait{background:#FEF3C7;color:#92400E}
.pill.bad{background:#FEE2E2;color:#991B1B}
.pill.off{background:#E2E8F0;color:#475569}

.kpis{display:grid;gap:11px;grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1180px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 20px -18px rgba(15,23,42,.3);
  transition:transform .2s cubic-bezier(.2,.8,.3,1),box-shadow .2s}
.kpi:hover{transform:translateY(-2px)}
.kpi .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:9px}
.kpi .v{font-size:19px;font-weight:700;letter-spacing:-.03em}
.kpi .k{font-size:12px;color:var(--muted)}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:right;padding:10px 11px;color:var(--muted);font-size:11.5px;
  font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg)}
.tbl td{padding:11px;border-bottom:1px solid #F1F5F9;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.warn td{background:#FFFBEB}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}

.alert{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;
  padding:13px 15px;border-radius:12px;font-size:13.5px;margin-bottom:16px;
  display:flex;gap:10px;align-items:flex-start}
.banner{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;
  padding:11px 14px;border-radius:11px;font-size:13px;margin-bottom:16px}

.sk{background:linear-gradient(90deg,#EEF2F7 25%,#E2E8F0 37%,#EEF2F7 63%);
  background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:8px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty svg{width:40px;height:40px;margin:0 auto 12px;opacity:.32;display:block}

#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;gap:8px;width:min(92vw,400px)}
.toast{background:var(--navy);color:#fff;padding:13px 15px;border-radius:12px;font-size:14px;
  box-shadow:0 12px 30px -10px rgba(15,23,42,.5);animation:tin .26s ease}
.toast.ok{background:var(--emerald-d)}.toast.bad{background:var(--error)}
@keyframes tin{from{opacity:0;transform:translateY(-14px)}}

.ov{position:fixed;inset:0;z-index:120;background:rgba(15,23,42,.55);
  display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.ov.show{display:flex}
@media(min-width:640px){.ov{align-items:center}}
.sheet{background:#fff;width:100%;max-width:470px;border-radius:20px 20px 0 0;
  padding:22px;max-height:92vh;overflow-y:auto}
@media(min-width:640px){.sheet{border-radius:18px}}

.settabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;
  -webkit-overflow-scrolling:touch}
.settabs::-webkit-scrollbar{display:none}
.stab{flex:none;padding:9px 15px;border-radius:10px;font-size:13px;font-weight:600;
  border:1px solid var(--border);background:#fff;color:var(--muted);
  transition:.16s;white-space:nowrap}
.stab:hover{border-color:var(--border-2,#CBD5E1);color:var(--navy)}
.stab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.stab:active{transform:scale(.97)}
[data-sec]{display:none}
[data-sec].show{display:block}

.field{display:grid;grid-template-columns:1fr 118px;gap:11px;align-items:center;
  padding:11px 0;border-bottom:1px solid #F1F5F9}
.field:last-child{border-bottom:none}
.field .n{font-size:13.5px;font-weight:500}
.field .d{font-size:11.5px;color:var(--muted)}
.field input{text-align:center;padding:9px}

.bnrrow{display:flex;align-items:center;gap:11px;margin-bottom:9px;
  padding:10px;border:1px solid var(--border);border-radius:12px}
.bnrthumb{flex:none;cursor:pointer}
.bnrthumb > div{width:84px;height:38px;border-radius:9px;overflow:hidden;
  background:var(--bg);border:1px solid var(--border);display:grid;place-items:center}
.bnrthumb img{width:100%;height:100%;object-fit:cover;display:block}

.iconpick{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
@media(max-width:520px){.iconpick{grid-template-columns:repeat(6,1fr)}}
.ipick{aspect-ratio:1;border-radius:10px;border:1px solid var(--border);
  background:#fff;color:var(--muted);display:grid;place-items:center;transition:.15s}
.ipick:hover{border-color:var(--emerald);color:var(--navy)}
.ipick.on{background:var(--navy);border-color:var(--navy);color:#fff}

.srow{display:flex;align-items:center;gap:12px;padding:11px 0;
  border-bottom:1px solid #EEF2F7}
.srow:last-child{border-bottom:none}
.srow-img{width:44px;height:44px;border-radius:12px;flex:none;overflow:hidden;
  display:grid;place-items:center;background:var(--bg);color:var(--muted)}
.srow-img img{width:100%;height:100%;object-fit:cover}

.pfrow{display:grid;grid-template-columns:1.2fr .8fr .8fr 1fr auto auto;gap:6px;
  align-items:center;margin-bottom:7px}
.pfrow .inp{padding:8px 9px;border-radius:9px;font-size:12.5px}
@media(max-width:640px){
  .pfrow{grid-template-columns:1fr 1fr;gap:6px;
    padding:9px;border:1px solid var(--border);border-radius:10px}
  .pfrow .inp:nth-child(1){grid-column:1/-1}
}

.logorow{display:flex;align-items:center;gap:12px;margin-top:10px;
  padding:10px;border:1px dashed var(--border);border-radius:12px}
.logobox{flex:none;cursor:pointer}
.logoprev{width:52px;height:52px;border-radius:13px;overflow:hidden;
  background:var(--bg);border:1px solid var(--border);
  display:grid;place-items:center;transition:.16s}
.logoprev:hover{border-color:var(--emerald)}
.logoprev img{width:100%;height:100%;object-fit:cover;display:block}
.logoadd{font-size:24px;color:var(--muted);line-height:1}

.frow{display:grid;grid-template-columns:1fr 1.3fr auto auto;gap:6px;
  align-items:center;margin-bottom:7px}
.frow .inp{padding:8px 9px;border-radius:9px}
.fcopy{display:flex;align-items:center;gap:4px;font-size:11.5px;
  color:var(--muted);white-space:nowrap;cursor:pointer}
.fcopy input{width:16px;height:16px;accent-color:var(--emerald);cursor:pointer}
.frm{width:28px;height:28px;border-radius:8px;color:var(--error);
  font-size:19px;line-height:1;background:#fff;border:1px solid #F6CFCF}
.frm:hover{background:#FCE9E9}
@media(max-width:520px){
  .frow{grid-template-columns:1fr 1fr;grid-template-areas:'l l' 'v v' 'c r'}
  .frow .inp:nth-child(1){grid-area:l}
  .frow .inp:nth-child(2){grid-area:v}
  .fcopy{grid-area:c}.frm{grid-area:r;justify-self:end}
}

.sw{width:46px;height:26px;border-radius:999px;background:var(--border);
  position:relative;transition:.2s;flex:none;cursor:pointer}
.sw.on{background:var(--emerald)}
.sw::after{content:'';position:absolute;top:3px;right:3px;width:20px;height:20px;
  border-radius:50%;background:#fff;transition:.2s}
.sw.on::after{right:23px}

.spark{display:flex;align-items:flex-end;gap:3px;height:64px}
.spark i{flex:1;background:var(--emerald);border-radius:3px 3px 0 0;min-height:3px;opacity:.85}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.wrap > *{animation:rise .4s cubic-bezier(.2,.8,.3,1) backwards}
.wrap > *:nth-child(2){animation-delay:.06s}
.wrap > *:nth-child(3){animation-delay:.11s}
.wrap > *:nth-child(n+4){animation-delay:.15s}
.kpis > *{animation:rise .42s cubic-bezier(.2,.8,.3,1) backwards}
.kpis > *:nth-child(2){animation-delay:.05s}
.kpis > *:nth-child(3){animation-delay:.09s}
.kpis > *:nth-child(4){animation-delay:.13s}
.kpis > *:nth-child(5){animation-delay:.17s}
.kpis > *:nth-child(6){animation-delay:.21s}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:var(--bg)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hide{display:none!important}

#gate{min-height:100vh;display:grid;place-items:center;padding:22px;background:var(--navy)}
.gatebox{background:#fff;border-radius:20px;padding:28px;width:min(100%,390px)}
</style>
</head>
<body>

<div id="gate">
  <div class="gatebox">
    <div style="display:flex;align-items:center;gap:11px;margin-bottom:4px">
      <span id="gateMark"></span>
      <div><div style="font-size:21px;font-weight:700;letter-spacing:-.02em">Kardo</div>
        <div style="font-size:12px;color:var(--muted)">لوحة الإدارة</div></div>
    </div>
    <p class="sub" style="margin:6px 0 22px">هذه الصفحة للمصرّح لهم فقط.</p>
    <div style="margin-bottom:13px"><label class="lbl">البريد الإلكتروني</label>
      <input class="inp" id="gEmail" type="email" dir="ltr" autocomplete="email"></div>
    <div style="margin-bottom:18px"><label class="lbl">كلمة المرور</label>
      <input class="inp" id="gPass" type="password" autocomplete="current-password"></div>
    <button class="btn wide dark" id="gGo">تسجيل الدخول</button>
    <p id="gErr" class="hide" style="color:var(--error);font-size:13px;margin-top:12px;text-align:center"></p>
  </div>
</div>

<div id="app" style="display:none">
<div class="shell">
  <aside class="side">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <span id="sideMark"></span>
      <div><div style="font-size:18px;font-weight:700;letter-spacing:-.02em">Kardo</div>
        <div style="font-size:11px;color:#64748B">لوحة الإدارة</div></div>
    </div>
    <div style="height:22px"></div>
    <nav id="navDesk"></nav>
    <div style="margin-top:auto;padding-top:18px;border-top:1px solid rgba(255,255,255,.09)">
      <div style="padding:0 3px 12px;font-size:12.5px">
        <div id="admName" style="font-weight:600"></div>
        <div style="color:#64748B;font-size:11px">مدير النظام</div></div>
      <button class="navlink" onclick="confirmOut()"><span class="l">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        تسجيل الخروج</span></button>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div style="display:flex;align-items:center;gap:9px" class="lg-hide">
        <span id="topMark"></span>
        <span style="font-size:16px;font-weight:700">لوحة الإدارة</span>
      </div>
      <div style="margin-inline-start:auto;display:flex;align-items:center;gap:9px">
        <span id="floatChip" class="pill off"></span>
        <button class="btn ghost sm" onclick="reconcile()">مطابقة</button>
      </div>
    </header>
    <main class="wrap" id="view"></main>
  </div>
</div>
<nav class="tabbar" id="navMob"></nav>
</div>

<div id="toasts"></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }

  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

   ⚙️  ضع رابط Cloudflare Worker بعد نشره.
   اتركه فارغًا لمعاينة اللوحة ببيانات تجريبية.

const firebaseConfig = {

  projectId: "kardo-1c657",

    el.textContent = 'خطأ: ' + (e.message||'') + ' — سطر ' + (e.lineno||'');

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const S = { admin:null, page:'home', unsub:[],
  users:[], cards:[], orders:[], deposits:[], logs:[], sms:[],
  cats:[], prods:[], shopOrders:[], subErr:{}, withdrawals:[], tickets:[], coupons:[],

/* ─── Icons ─── */
const I = {

  orders:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',

  cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 0 1-.2 1.8l2 1.5-2 3.4-2.3-1a8 8 0 0 1-1.6.9l-.3 2.4h-4l-.3-2.4a8 8 0 0 1-1.6-.9l-2.3 1-2-3.4 2-1.5A8 8 0 0 1 4 12"/>',

  warn:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6A2 2 0 0 0 22 18L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  cash2:'<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>'
};
const svg = (d,s=2)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${s}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

function mark(size=32){
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" style="flex:none">
    <rect width="40" height="40" rx="10" fill="#0F172A"/>
    <path d="M11 9h4.4v22H11z" fill="#10B981"/>
    <path d="M17 20.2 27.5 9H33L22.4 20.2 33 31h-5.6z" fill="#10B981"/>
    <rect x="19" y="15.6" width="12.4" height="8.8" rx="2" fill="#fff" opacity=".93"/>

  if(DEMO){ await new Promise(r=>setTimeout(r,480)); return {success:true, orphans:[], provider_total:2}; }

  const res = await fetch(API_BASE+path,{ method:'POST',

function sub(q, key){
  S.unsub.push(onSnapshot(q, s=>{
    S[key] = s.docs.map(d=>({id:d.id,...d.data()}));
    S.subErr[key] = null;
    render();
  }, err=>{
    // نُظهر الخطأ للمسؤول بدل ابتلاعه في وحدة التحكم
    console.warn(key, err.code);
    S.subErr[key] = err.code === 'permission-denied'
      ? 'صلاحيات ناقصة — حدّث قواعد Firestore'
      : (err.code || 'تعذّر التحميل');
    render();
  }));
}
function subscribe(){
  sub(query(collection(db,'users'), orderBy('created_at','desc'), limit(200)),'users');

  sub(query(collection(db,'orders'), orderBy('created_at','desc'), limit(120)),'shopOrders');
  sub(query(collection(db,'withdrawals'), orderBy('created_at','desc'), limit(80)),'withdrawals');
  sub(query(collection(db,'tickets'), orderBy('updated_at','desc'), limit(80)),'tickets');
  sub(query(collection(db,'coupons')),'coupons');
  S.unsub.push(onSnapshot(doc(db,'card_settings','pricing'), s=>{
    if(s.exists()) S.pricing = s.data(); render(); }, ()=>{}));
  S.unsub.push(onSnapshot(doc(db,'card_settings','ops'), s=>{
    if(s.exists()) S.ops = s.data(); render(); }, ()=>{}));
}

function exportCsv(){
  const head = ['العميل','البطاقة','آخر4','القيمة','دفع العميل','التكلفة','الربح','الحالة','التاريخ','معرّف المزود'];
  const lines = [head.join(',')];
  S.cards.forEach(c=> lines.push([
    userName(c.uid), c.card_name||'', c.last4||'', n(c.amount_loaded),
    n(c.customer_paid), n(c.provider_cost), n(c.profit), c.status||'',
    dt(c.created_at), c.id
  ].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')));

  const blob = new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `kardo-cards-${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('نُزّل الملف','ok');
}

/**
 * يضغط الشعار في المتصفح ويعيده نصًا مضمّنًا.
 * الشعارات مربّعة صغيرة (128px) فحجمها بضعة كيلوبايتات فقط،
 * وتُخزّن داخل مستند الإعدادات بلا حاجة لتخزين مدفوع.
 */
function compressLogo(file, size = 128){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onerror = ()=> reject(new Error('تعذّرت قراءة الصورة'));
    r.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('الملف ليس صورة صالحة'));
      img.onload = ()=>{
        const cv = document.createElement('canvas');
        cv.width = cv.height = size;
        const cx = cv.getContext('2d');
        // اقتصاص مربّع من المنتصف
        const m = Math.min(img.width, img.height);
        cx.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, size, size);
        let q = 0.82, out = cv.toDataURL('image/webp', q);
        if(out.indexOf('data:image/webp') !== 0) out = cv.toDataURL('image/jpeg', q);
        while(out.length > 60000 && q > 0.35){
          q -= 0.12;
          out = cv.toDataURL('image/jpeg', q);
        }
        resolve(out);
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

/* Banners are wide: 1200px keeps them sharp and small */
function compressBanner(file, w = 1200){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onerror=()=>reject(new Error('تعذّرت قراءة الصورة'));
    r.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('الملف ليس صورة صالحة'));
      img.onload=()=>{
        const scale=Math.min(1,w/img.width);
        const nw=Math.round(img.width*scale), nh=Math.round(img.height*scale);
        const cv=document.createElement('canvas');
        cv.width=nw; cv.height=nh;
        cv.getContext('2d').drawImage(img,0,0,nw,nh);
        let q=0.72,out=cv.toDataURL('image/jpeg',q);
        while(out.length>320000&&q>0.3){ q-=0.1; out=cv.toDataURL('image/jpeg',q); }
        if(out.length>400000)return reject(new Error('الصورة كبيرة — جرّب أصغر'));
        resolve(out);
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

/* مسار القسم كاملًا — لعرضه في القوائم المنسدلة */
function catPath(id){
  const out=[];let cur=S.cats.find(c=>c.id===id);
  while(cur){out.unshift(cur.name);cur=S.cats.find(c=>c.id===cur.parent)}
  return out.join(' ← ');
}
/* يمنع جعل القسم ابنًا لأحد أحفاده — وإلا صارت حلقة لا نهائية */
function isDescendant(candidate,ofId){
  if(!ofId)return false;
  let cur=S.cats.find(c=>c.id===candidate);
  while(cur){ if(cur.parent===ofId)return true;
    cur=S.cats.find(c=>c.id===cur.parent) }
  return false;
}

/* يرسم الأقسام كشجرة بأي عمق */
function catTree(parent,depth){
  const kids=S.cats.filter(c=>(c.parent||'')===(parent||''))
    .sort((a,b)=>n(a.sort,99)-n(b.sort,99));
  if(!kids.length)return '';
  return kids.map(c=>{
    const subs=S.cats.filter(x=>(x.parent||'')===c.id).length;
    const prods=S.prods.filter(p=>p.cat===c.id).length;
    return `
      <div class="srow" style="padding-inline-start:${depth*20}px">
        ${depth?`<span style="color:var(--muted);font-size:14px">└</span>`:''}
        <div class="srow-img">${c.image
          ? `<img src="${esc(c.image)}" alt="">`
          : svg((LIB[c.icon]||LIB.grid).d,1.6)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13.5px;font-weight:600">${esc(c.name||'—')}
            ${c.soon?'<span class="pill off">قريبًا</span>':''}
            ${c.active===false?'<span class="pill bad">مخفي</span>':''}</div>
          <div class="sub" style="font-size:11.5px">
            ${subs?subs+' قسم فرعي · ':''}${prods} منتج · ترتيب ${n(c.sort,99)}</div>
        </div>
        <button class="btn ghost sm" data-ecat="${esc(c.id)}">تعديل</button>
      </div>
      ${catTree(c.id,depth+1)}`;
  }).join('');
}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px">

      <div><label class="lbl">السعر قبل الخصم</label>

    <p class="sub" style="font-size:11px;margin-top:5px" id="offHint">
      اترك «قبل الخصم» صفرًا إن لم يكن عليه عرض.</p>

    <div style="display:flex;justify-content:space-between;align-items:center;
         padding:13px 0;border-bottom:1px solid #EEF2F7;margin-top:6px">
      <div><div style="font-size:13.5px;font-weight:600">من الأكثر طلبًا</div>
        <div class="sub" style="font-size:11.5px">يظهر في الصفحة الرئيسية</div></div>
      <div class="sw ${p.featured?'on':''}" id="pFeat"></div></div>

    <label class="lbl" style="margin-top:13px">نوع التسليم</label>
    <select class="inp" id="pKind">
      <option value="manual" ${p.kind!=='stock'?'selected':''}>يدوي — تنفّذه بنفسك</option>
      <option value="stock" ${p.kind==='stock'?'selected':''}>مخزون — كود يُسلَّم فورًا</option>
    </select>

    <div id="stockBox" style="display:${p.kind==='stock'?'block':'none'}">
      <label class="lbl" style="margin-top:13px">أكواد المخزون</label>
      <textarea class="inp mono" id="pCodes" rows="4" dir="ltr"

    <label class="lbl" style="margin-top:13px">الوصف</label>
    <textarea class="inp" id="pDesc" rows="3" style="font-size:13px;resize:vertical"

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px">
        <span class="lbl" style="margin:0">الحقول التي يعبّيها العميل</span>
        <button class="btn ghost sm" id="addPF">+ حقل</button>
      </div>
      <div id="pFields">
        ${(p.fields||[]).map((f,i)=>pfRow(i,f)).join('')
          || '<p class="sub" style="font-size:12px">لا حقول.</p>'}
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0">
      <div><div style="font-size:13.5px;font-weight:600">ظاهر للعملاء</div></div>
      <div class="sw ${p.active!==false?'on':''}" id="pActive"></div></div>

    <button class="btn wide" id="pSave">حفظ</button>
    ${id?`<button class="btn ghost wide" style="margin-top:9px;color:var(--error)"
      id="pDel">حذف المنتج</button>`:''}
    <button class="btn ghost wide" style="margin-top:9px" onclick="closeSheet()">إلغاء</button>`);

  let img=p.image||'';
  $('#prodImg').onchange=async e=>{
    const f=e.target.files[0]; if(!f)return;
    try{
      img=await compressLogo(f,300);
      $('#prodPrev').innerHTML=`<img src="${img}" alt="">`;
    }catch(err){toast(err.message,'bad');}
  };
  $('#pKind').onchange=e=>{
    $('#stockBox').style.display=e.target.value==='stock'?'block':'none';
  };
  $('#pActive').onclick=e=>e.currentTarget.classList.toggle('on');
  $('#pFeat').onclick=e=>e.currentTarget.classList.toggle('on');

  const showOff=()=>{
    const pr=n($('#pPrice').value), ol=n($('#pOld').value);
    const h=$('#offHint');
    if(ol>pr&&pr>0){
      h.innerHTML=`<span style="color:var(--emerald-d,#0B8A60);font-weight:600">
        خصم ${Math.round((1-pr/ol)*100)}٪ — سيظهر بشارة حمراء</span>`;
    }else h.textContent='اترك «قبل الخصم» صفرًا إن لم يكن عليه عرض.';
  };
  $('#pPrice').oninput=showOff;
  $('#pOld').oninput=showOff;
  showOff();
  $('#addPF').onclick=()=>{
    const w=$('#pFields');
    const em=w.querySelector('p.sub'); if(em)em.remove();
    w.insertAdjacentHTML('beforeend',pfRow(w.querySelectorAll('.pfrow').length,null));
    bindPF();
  };
  bindPF();

  $('#pSave').onclick=async()=>{
    const name=$('#pName').value.trim();
    const cat=$('#pCat').value;
    if(!name)return toast('اكتب اسم المنتج','bad');
    if(!cat)return toast('اختر القسم','bad');

    const fields=[...document.querySelectorAll('.pfrow')].map(r=>({
      key:r.querySelector('[data-f=key]').value.trim()
          .replace(/[^a-zA-Z0-9_]/g,'')||('f'+Math.random().toString(36).slice(2,7)),
      label:r.querySelector('[data-f=label]').value.trim(),
      type:r.querySelector('[data-f=type]').value,
      required:r.querySelector('[data-f=req]').checked,
      hint:r.querySelector('[data-f=hint]').value.trim(),
    })).filter(f=>f.label);

    const codes=($('#pCodes')?$('#pCodes').value:'')
      .split('\n').map(x=>x.trim()).filter(Boolean);
    const kind=$('#pKind').value;

    const price=n($('#pPrice').value), oldP=n($('#pOld').value);
    if(oldP>0&&oldP<=price)
      return toast('السعر قبل الخصم يجب أن يكون أعلى','bad');

    const data={
      name, cat, desc:$('#pDesc').value.trim(), note:$('#pNote').value.trim(),
      image:img, price, old_price:oldP,
      featured:$('#pFeat').classList.contains('on'),
      kind, fields,
      active:$('#pActive').classList.contains('on'),
      sort:n(p.sort,10),
    };

    $('#pSave').disabled=true;
    try{
      let pid=id;
      if(DEMO){
        if(id)Object.assign(S.prods.find(x=>x.id===id),data);
        else {pid='p'+Date.now();S.prods.push({id:pid,stock_count:0,...data});}
      } else if(id){
        await setDoc(doc(db,'products',id),data,{merge:true});
      } else {
        const ref=await addDoc(collection(db,'products'),
          {...data,stock_count:0,created_at:new Date().toISOString()});
        pid=ref.id;
      }

      if(kind==='stock'&&codes.length&&!DEMO){
        for(const code of codes.slice(0,200)){
          await addDoc(collection(db,'stock'),
            {pid,code,used:false,created_at:new Date().toISOString()});
        }
        await setDoc(doc(db,'products',pid),
          {stock_count:increment(codes.length)},{merge:true});
      }

      toast('حُفظ المنتج'+(codes.length?` · أُضيف ${codes.length} كود`:''),'ok');
      closeSheet();render();
    }catch(e){toast(e.message,'bad');$('#pSave').disabled=false;}
  };

  const del=$('#pDel');
  if(del)del.onclick=async()=>{
    try{
      if(DEMO)S.prods=S.prods.filter(x=>x.id!==id);
      else await deleteDoc(doc(db,'products',id));
      toast('حُذف المنتج','ok');closeSheet();render();
    }catch(e){toast(e.message,'bad');}
  };
}

function pfRow(i,f){
  f=f||{key:'',label:'',type:'text',required:true,hint:''};
  return `<div class="pfrow">
    <input class="inp" data-f="label" value="${esc(f.label)}" placeholder="اسم الحقل">
    <input class="inp mono" data-f="key" value="${esc(f.key)}" dir="ltr" placeholder="key">
    <select class="inp" data-f="type">
      <option value="text" ${f.type==='text'?'selected':''}>نص</option>
      <option value="number" ${f.type==='number'?'selected':''}>رقم</option>
      <option value="email" ${f.type==='email'?'selected':''}>بريد</option>
      <option value="tel" ${f.type==='tel'?'selected':''}>هاتف</option>
    </select>
    <input class="inp" data-f="hint" value="${esc(f.hint)}" placeholder="تلميح">
    <label class="fcopy"><input type="checkbox" data-f="req"
      ${f.required?'checked':''}><span>إجباري</span></label>
    <button class="frm" data-rmpf="1">&times;</button>
  </div>`;
}

function bindPF(){
  document.querySelectorAll('[data-rmpf]').forEach(b=>b.onclick=()=>{
    const w=b.closest('.pfrow').parentElement;
    b.closest('.pfrow').remove();
    if(!w.querySelector('.pfrow'))
      w.innerHTML='<p class="sub" style="font-size:12px">لا حقول.</p>';
  });
}

  const t=S.tickets.find(x=>x.id===id);
  if(!t)return;
  const msgs=t.messages||[];
  const u=S.users.find(x=>x.id===t.uid);
  sheet(`
    <div style="margin-bottom:14px">
      <div class="h2">${esc(t.subject)}</div>
      <div class="sub" style="font-size:12px">
        ${esc(u?(u.name||u.email):String(t.uid).slice(0,8))}
        ${t.order_id?` · طلب ${esc(t.order_id)}`:''}</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:9px;margin-bottom:14px;
         max-height:44vh;overflow-y:auto">
      ${msgs.map(m=>`
        <div style="align-self:${m.by==='admin'?'flex-end':'flex-start'};
             max-width:86%;padding:11px 13px;border-radius:14px;
             background:${m.by==='admin'?'var(--emerald-50,#ECFDF5)':'var(--bg)'};
             border:1px solid var(--border)">
          <div style="font-size:10.5px;color:var(--muted);margin-bottom:3px">
            ${m.by==='admin'?'أنت':'العميل'} · ${dt(m.at)}</div>
          <div style="font-size:13.5px;line-height:1.65;white-space:pre-line"
            >${esc(m.text)}</div>
        </div>`).join('')}
    </div>

    ${t.status!=='closed'?`
      <textarea class="inp" id="tRep" rows="3" placeholder="اكتب ردك…"
        style="resize:vertical"></textarea>
      <button class="btn wide" id="tSend" style="margin-top:10px">إرسال الرد</button>
      <button class="btn ghost wide" id="tClose" style="margin-top:9px">إغلاق التذكرة</button>`
     :`<div class="alert"><div>هذه التذكرة مغلقة.</div></div>`}
    <button class="btn ghost wide" style="margin-top:9px" onclick="closeSheet()">رجوع</button>`);

  const sb=$('#tSend');
  if(sb)sb.onclick=async()=>{
    const m=$('#tRep').value.trim();
    if(!m)return toast('اكتب ردك','bad');
    sb.disabled=true;
    try{
      await api('/api/ticket/reply',{id,message:m});
      if(DEMO){msgs.push({by:'admin',text:m,at:new Date().toISOString()});
        t.status='answered'}
      toast('أُرسل الرد','ok');closeSheet();render();
    }catch(e){toast(e.message,'bad');sb.disabled=false}
  };
  const cb=$('#tClose');
  if(cb)cb.onclick=async()=>{
    cb.disabled=true;
    try{
      await api('/api/admin/ticket/close',{id});
      if(DEMO)t.status='closed';
      toast('أُغلقت التذكرة','ok');closeSheet();render();
    }catch(e){toast(e.message,'bad');cb.disabled=false}
  };
}

function coupSheet(id){
  const c = id ? S.coupons.find(x=>x.id===id)
    : {id:'',percent:0,amount_lyd:0,max_off_lyd:0,min_order_lyd:0,
       max_uses:0,used_count:0,once_per_user:true,active:true,expires_at:''};

  sheet(`
    <div class="h2" style="margin-bottom:16px">${id?'تعديل الكوبون':'كوبون جديد'}</div>

    <label class="lbl">الكود</label>
    <input class="inp mono" id="cCode" value="${esc(c.id||'')}" ${id?'disabled':''}
           dir="ltr" placeholder="WELCOME10"
           style="text-transform:uppercase;letter-spacing:.12em${id?';opacity:.6':''}">

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">
      <div><label class="lbl">نسبة الخصم ٪</label>
        <input class="inp num" id="cPct" type="number" step="1" min="0" max="100"
               value="${n(c.percent)}"></div>
      <div><label class="lbl">أو مبلغ ثابت</label>
        <input class="inp num" id="cAmt" type="number" step="0.5" min="0"
               value="${n(c.amount_lyd)}"></div>
    </div>
    <p class="sub" style="font-size:11px;margin-top:5px">
      استخدم واحدًا منهما — النسبة لها الأولوية.</p>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">
      <div><label class="lbl">حد أقصى للخصم</label>
        <input class="inp num" id="cCap" type="number" step="0.5" min="0"
               value="${n(c.max_off_lyd)}"></div>
      <div><label class="lbl">أقل قيمة طلب</label>
        <input class="inp num" id="cMin" type="number" step="0.5" min="0"
               value="${n(c.min_order_lyd)}"></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">
      <div><label class="lbl">عدد الاستخدامات</label>
        <input class="inp num" id="cMax" type="number" step="1" min="0"
               value="${n(c.max_uses)}"></div>
      <div><label class="lbl">ينتهي في</label>
        <input class="inp" id="cExp" type="date"
               value="${c.expires_at?String(c.expires_at).slice(0,10):''}"></div>
    </div>
    <p class="sub" style="font-size:11px;margin-top:5px">صفر = بلا حد.</p>

    <div style="display:flex;justify-content:space-between;align-items:center;
         padding:13px 0;border-bottom:1px solid #EEF2F7;margin-top:8px">
      <div><div style="font-size:13.5px;font-weight:600">مرة واحدة لكل عميل</div></div>
      <div class="sw ${c.once_per_user!==false?'on':''}" id="cOnce"></div></div>

    <div style="display:flex;justify-content:space-between;align-items:center;padding:13px 0">
      <div><div style="font-size:13.5px;font-weight:600">فعّال</div></div>
      <div class="sw ${c.active!==false?'on':''}" id="cAct"></div></div>

    <button class="btn wide" id="cSave" style="margin-top:14px">حفظ</button>
    ${id?`<button class="btn ghost wide" style="margin-top:9px;color:var(--error)"
      id="cDel">حذف الكوبون</button>`:''}
    <button class="btn ghost wide" style="margin-top:9px" onclick="closeSheet()">إلغاء</button>`);

  $('#cOnce').onclick=e=>e.currentTarget.classList.toggle('on');
  $('#cAct').onclick=e=>e.currentTarget.classList.toggle('on');

  $('#cSave').onclick=async()=>{
    const code=(id||$('#cCode').value).trim().toUpperCase()
      .replace(/[^A-Z0-9_-]/g,'');
    if(code.length<3)return toast('الكود 3 أحرف على الأقل','bad');
    const pct=n($('#cPct').value), amt=n($('#cAmt').value);
    if(pct<=0&&amt<=0)return toast('حدّد نسبة أو مبلغًا','bad');

    const data={
      percent:pct, amount_lyd:amt,
      max_off_lyd:n($('#cCap').value), min_order_lyd:n($('#cMin').value),
      max_uses:n($('#cMax').value),
      expires_at:$('#cExp').value?new Date($('#cExp').value).toISOString():'',
      once_per_user:$('#cOnce').classList.contains('on'),
      active:$('#cAct').classList.contains('on'),
    };
    $('#cSave').disabled=true;
    try{
      if(DEMO){
        if(id)Object.assign(S.coupons.find(x=>x.id===id),data);
        else S.coupons.push({id:code,used_count:0,...data});
      }else{
        await setDoc(doc(db,'coupons',code),
          id?data:{...data,used_count:0,created_at:new Date().toISOString()},
          {merge:true});
      }
      toast('حُفظ الكوبون','ok');closeSheet();render();
    }catch(e){toast(e.message,'bad');$('#cSave').disabled=false}
  };

  const del=$('#cDel');
  if(del)del.onclick=async()=>{
    try{
      if(DEMO)S.coupons=S.coupons.filter(x=>x.id!==id);
      else await deleteDoc(doc(db,'coupons',id));
      toast('حُذف الكوبون','ok');closeSheet();render();
    }catch(e){toast(e.message,'bad')}
  };
}

        <td class="num" style="color:var(--muted)">${usd(s.cost)}</td>
        <td class="num" style="font-weight:600">${usd(s.price)}</td>
        <td class="num">${s.lyd.toLocaleString('en-US')} د.ل</td>
        <td class="num" style="color:var(--emerald-d);font-weight:600">${usd(mg)}</td>
      </tr>`).join('')}</tbody></table></div>
    </div>

    ${S.logs.length ? `<div class="box" data-sec="ops">
      <div class="h2" style="margin-bottom:12px">آخر العمليات</div>
      ${S.logs.slice(0,12).map(l=>`
        <div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;
             border-bottom:1px solid #F1F5F9;font-size:12.5px">
          <div style="min-width:0"><div style="font-weight:600">${esc(l.action||'—')}</div>
            <div class="sub" style="font-size:11.5px">${esc(userName(l.uid))} · ${dt(l.created_at)}</div></div>
          <span class="pill ${l.ok?'ok':'bad'}">${l.ok?'ناجحة':'فاشلة'}</span></div>`).join('')}
    </div>`:''}
  </div>`;
}

async function saveSettings(kind, btn){
  const sel = kind==='ops' ? '[data-ops]' : '[data-pricing]';
  const attr = kind==='ops' ? 'ops' : 'pricing';
  const payload = {};

  document.querySelectorAll(sel).forEach(el=>{
    const k = el.dataset[attr];
    payload[k] = el.type==='number' ? n(el.value,0) : el.value;
  });
  // تحقق مبكر: عنوان TRC20 يبدأ بحرف T وطوله 34
  if(kind==='ops' && 'usdt_address' in payload){
    const adr = String(payload.usdt_address||'').trim();
    payload.usdt_address = adr;
    if(adr && !/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(adr)){
      btn = btn || document.querySelector('[data-save="ops"]');
      btn.disabled = false;
      return toast('عنوان TRC20 غير صحيح — يبدأ بحرف T وطوله 34 خانة','bad');
    }
  }

  // المفاتيح (تفعيل/تعطيل) تخص إعدادات التشغيل فقط
  if(kind==='ops'){
    document.querySelectorAll('[data-sw]').forEach(el=>{
      payload[el.dataset.sw] = el.classList.contains('on');
    });
    // البانرات
    const bl=document.querySelector('#bnrList');
    if(bl){
      payload.banners=[...bl.querySelectorAll('.bnrrow')].map(row=>{
        const prev=row.querySelector('[data-bnrprev]');
        const img=prev.dataset.img
          || (prev.querySelector('img') ? prev.querySelector('img').src : '');
        return {
          img,
          title: (row.querySelector('[data-bnr="title"]')||{}).value || '',
          link:  (row.querySelector('[data-bnr="link"]') ||{}).value || '',
        };
      }).filter(b=>b.img).slice(0,3);

      const bytes=payload.banners.reduce((t,b)=>t+b.img.length,0);
      if(bytes>800000){
        btn=btn||document.querySelector('[data-save="ops"]');
        btn.disabled=false;
        return toast('البانرات كبيرة جدًا — احذف واحدًا أو استعمل صورًا أصغر','bad');
      }
    }

    // الطرق الإضافية
    const cl=document.querySelector('#cmList');
    if(cl){
      payload.custom_methods=[...cl.querySelectorAll('[data-ci]')].map((box,idx)=>{
        const prev=box.querySelector('[data-cmprev]');
        const logo=prev.dataset.img
          || (prev.querySelector('img') ? prev.querySelector('img').src : '');
        const fw=box.querySelector('[data-cmfields]');
        const fields=[...(fw?fw.querySelectorAll('.frow'):[])].map(r=>({
          label:r.querySelector('[data-f="label"]').value.trim(),
          value:r.querySelector('[data-f="value"]').value.trim(),
          copy: r.querySelector('[data-f="copy"]').checked,
        })).filter(f=>f.label||f.value);
        return {
          key:'custom'+idx, logo, fields,
          label:(box.querySelector('[data-cm="label"]')||{}).value||'',
          rate: n((box.querySelector('[data-cm="rate"]')||{}).value,1),
          on:   !!box.querySelector('[data-cmsw].on'),
        };
      }).filter(m=>m.label);
    }

    // حقول طرق الدفع
    document.querySelectorAll('[data-fields]').forEach(wrap=>{
      const k = wrap.dataset.fields;
      const rows = [...wrap.querySelectorAll('.frow')].map(r=>({
        label: r.querySelector('[data-f="label"]').value.trim(),
        value: r.querySelector('[data-f="value"]').value.trim(),
        copy:  r.querySelector('[data-f="copy"]').checked,
      })).filter(f=>f.label || f.value);
      payload['m_'+k+'_fields'] = rows;
    });
  }

  btn = btn || document.querySelector(`[data-save="${kind}"]`);
  const label = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="sk" style="width:70px;height:13px;display:inline-block"></span>';
  try{
    await api('/api/admin/settings', payload);
    if(DEMO){ if(kind==='ops') S.ops={...S.ops,...payload}; else S.pricing={...S.pricing,...payload}; }
    toast('حُفظت الإعدادات','ok'); render();
  }catch(e){
    toast(e.message,'bad');
    btn.disabled = false; btn.textContent = label;
  }
}

/* ─── Reconcile ─── */
window.reconcile = async ()=>{
  sheet(`<div class="h2" style="margin-bottom:6px">مطابقة البطاقات</div>
    <p class="sub" style="margin-bottom:16px">
      نقارن بطاقاتك عند المزود مع المسجّلة في النظام لكشف أي بطاقة صُدرت ولم تُحفظ.</p>
    <div id="recBox"><div class="sk" style="height:60px"></div></div>
    <button class="btn ghost wide" style="margin-top:14px" onclick="closeSheet()">إغلاق</button>`);
  try{
    const d = await api('/api/admin/reconcile');
    $('#recBox').innerHTML = d.orphans.length
      ? `<div class="alert">${svg(I.warn)}<div><strong>${d.orphans.length} بطاقة غير مسجّلة</strong><br>
          صُدرت عند المزود ولم تُحفظ في النظام — راجعها يدويًا.</div></div>
        ${d.orphans.map(o=>`<div class="box" style="margin-bottom:8px;padding:12px;font-size:12.5px">
          <div class="mono" style="font-size:11.5px">${esc(o.card_id)}</div>
          <div style="margin-top:3px">••${esc(o.last4||'')} · ${esc(o.name_on_card||'')}
            · ${usd(o.balance)}</div></div>`).join('')}`
      : `<div class="box" style="background:#ECFDF5;border-color:#A7F3D0;padding:16px;
           display:flex;gap:10px;align-items:center">
          <svg viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.6"
               stroke-linecap="round" stroke-linejoin="round" data-lg><path d="M20 6 9 17l-5-5"/></svg>
          <div style="font-size:13.5px">كل شيء مطابق — ${d.provider_total} بطاقة عند المزود.</div></div>`;
  }catch(e){ $('#recBox').innerHTML = `<div class="alert">${svg(I.warn)}<div>${esc(e.message)}</div></div>`; }

/* ─── Bind ─── */
function bind(){
  const q = $('#qBox');
  if(q){
    q.oninput = e=>{
      S.q = e.target.value;
      clearTimeout(q._t);
      q._t = setTimeout(()=>{ render(); const el=$('#qBox'); if(el){el.focus();
        el.setSelectionRange(el.value.length,el.value.length);} }, 260);
    };
  }
  document.querySelectorAll('[data-filter]').forEach(b=>
    b.onclick = ()=>{ S.filter = b.dataset.filter; render(); });
  document.querySelectorAll('[data-order]').forEach(b=>
    b.onclick = ()=> orderSheet(b.dataset.order));
  document.querySelectorAll('[data-user]').forEach(b=>
    b.onclick = ()=> userSheet(b.dataset.user));
  document.querySelectorAll('[data-dep-ok]').forEach(b=>
    b.onclick = ()=> depAction(b.dataset.depOk,'approve'));
  document.querySelectorAll('[data-dep-no]').forEach(b=>
    b.onclick = ()=> depAction(b.dataset.depNo,'reject'));
  const ac=$('#addCat'); if(ac)ac.onclick=()=>safeSheet(catSheet,null);
  const ap=$('#addProd'); if(ap)ap.onclick=()=>safeSheet(prodSheet,null);
  document.querySelectorAll('[data-ecat]').forEach(b=>
    b.onclick=()=>safeSheet(catSheet,b.dataset.ecat));
  document.querySelectorAll('[data-eprod]').forEach(b=>
    b.onclick=()=>safeSheet(prodSheet,b.dataset.eprod));
  document.querySelectorAll('[data-wdc]').forEach(b=>
    b.onclick=()=>wdSheet(b.dataset.wdc,'complete'));
  document.querySelectorAll('[data-wdr]').forEach(b=>
    b.onclick=()=>wdSheet(b.dataset.wdr,'reject'));
  document.querySelectorAll('[data-tic]').forEach(b=>
    b.onclick=()=>ticSheet(b.dataset.tic));
  const acp=$('#addCoup'); if(acp)acp.onclick=()=>coupSheet(null);
  document.querySelectorAll('[data-ecoup]').forEach(b=>
    b.onclick=()=>coupSheet(b.dataset.ecoup));

  document.querySelectorAll('[data-oc]').forEach(b=>
    b.onclick=()=>fulfillSheet(b.dataset.oc,'complete'));
  document.querySelectorAll('[data-orj]').forEach(b=>
    b.onclick=()=>fulfillSheet(b.dataset.orj,'reject'));

  document.querySelectorAll('[data-sms]').forEach(b=>
    b.onclick = ()=> smsAssignSheet(b.dataset.sms));
  document.querySelectorAll('[data-sw]').forEach(el=>
    el.onclick = ()=> el.classList.toggle('on'));
  document.querySelectorAll('[data-sec]').forEach(el=>
    el.classList.toggle('show', el.dataset.sec === S.setTab));
  document.querySelectorAll('[data-stab]').forEach(b=>
    b.onclick = ()=>{ S.setTab = b.dataset.stab; render(); });

  document.querySelectorAll('[data-save]').forEach(b=>
    b.onclick = ()=> saveSettings(b.dataset.save, b));
  const csv = $('#csvBtn'); if(csv) csv.onclick = exportCsv;

  document.querySelectorAll('[data-addf]').forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.addf;
      const wrap = document.querySelector(`[data-fields="${k}"]`);
      if(!wrap) return;
      const empty = wrap.querySelector('p.sub');
      if(empty) empty.remove();
      const i = wrap.querySelectorAll('.frow').length;
      wrap.insertAdjacentHTML('beforeend', fieldRow(k, i, null));
      bindFieldRows();
      wrap.lastElementChild.querySelector('[data-f="label"]').focus();
    };
  });
  bindFieldRows();
  bindLogoUploads();
  bindBanners();
  bindCustomMethods();

  const rt = $('#resetTheme');
  if(rt) rt.onclick = ()=>{
    const D = { theme_navy:'#0F172A', theme_emerald:'#10B981',
                theme_bg:'#F8FAFC', theme_radius:14 };
    Object.entries(D).forEach(([k,v])=>{
      const el = document.querySelector(`[data-ops="${k}"]`);
      if(el) el.value = v;
    });
    toast('استُعيدت الألوان — اضغط حفظ لتثبيتها','ok');
  };
}
</script>
