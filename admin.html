<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0F0D">
<title>كاردو — لوحة الإدارة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Reem+Kufi:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./theme-desert.css">

<style>
/* ── Admin-specific ── */
.admin-shell {
  display: grid;
  grid-template-columns: 1fr;
  min-height: 100vh;
}

@media (min-width: 1024px) {
  .admin-shell { grid-template-columns: 1fr 260px; }
}

.admin-sidebar {
  display: none;
  width: 260px;
  background: var(--ink);
  border-left: 1px solid var(--border);
  padding: 24px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

@media (min-width: 1024px) {
  .admin-sidebar { display: flex; flex-direction: column; }
}

.admin-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 8px;
  margin-bottom: 24px;
}

.admin-brand-name {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.005em;
  color: var(--text);
}

.admin-group {
  margin-bottom: 20px;
}

.admin-group-label {
  display: block;
  padding: 0 12px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--sand-3);
  text-transform: uppercase;
  letter-spacing: 0.15em;
  margin-bottom: 8px;
}

.admin-nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 12px;
  border-radius: 8px;
  color: var(--text-2);
  font-size: 13.5px;
  font-weight: 500;
  transition: all .15s;
  width: 100%;
  text-align: right;
  margin-bottom: 2px;
  position: relative;
}

.admin-nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

.admin-nav-item:hover {
  background: var(--surface-2);
  color: var(--text);
}

.admin-nav-item.active {
  background: linear-gradient(90deg, rgba(10, 92, 63, 0.4) 0%, rgba(10, 92, 63, 0.1) 100%);
  color: var(--sand);
  font-weight: 600;
}

.admin-nav-item.active::before {
  content: '';
  position: absolute;
  right: 0;
  top: 20%;
  bottom: 20%;
  width: 3px;
  background: var(--sand);
  border-radius: 3px;
  box-shadow: 0 0 12px rgba(212, 165, 116, 0.5);
}

.admin-badge {
  margin-right: auto;
  background: var(--sand);
  color: var(--ink);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 999px;
  min-width: 20px;
  text-align: center;
  font-family: var(--font-mono);
}

.admin-main {
  min-width: 0;
  padding-bottom: 80px;
}

@media (min-width: 1024px) {
  .admin-main { padding-bottom: 32px; }
}

.admin-content {
  padding: 24px 16px;
  max-width: 1400px;
  margin: 0 auto;
}

@media (min-width: 640px) {
  .admin-content { padding: 28px; }
}

.admin-kpis {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

@media (min-width: 640px) {
  .admin-kpis { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 1024px) {
  .admin-kpis { grid-template-columns: repeat(6, 1fr); }
}

.admin-kpi {
  background: linear-gradient(180deg, var(--surface) 0%, var(--ink-2) 100%);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  position: relative;
  overflow: hidden;
}

.admin-kpi::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(212, 165, 116, 0.3), transparent);
  opacity: 0.5;
}

.admin-kpi-icon {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  margin-bottom: 10px;
  background: rgba(212, 165, 116, 0.1);
  color: var(--sand);
  border: 1px solid rgba(212, 165, 116, 0.15);
}

.admin-kpi-icon svg { width: 18px; height: 18px; }

.admin-kpi-value {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  line-height: 1.15;
  color: var(--text);
}

.admin-kpi-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-top: 4px;
}

/* Bottom nav mobile */
.admin-dock {
  position: fixed;
  inset: auto 0 0 0;
  z-index: 50;
  display: grid;
  background: rgba(11, 15, 13, 0.95);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
  height: calc(64px + env(safe-area-inset-bottom));
}

@media (min-width: 1024px) {
  .admin-dock { display: none; }
}

.admin-dock-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--text-3);
  font-size: 10.5px;
  font-weight: 500;
  position: relative;
  font-family: var(--font-mono);
  letter-spacing: 0.05em;
}

.admin-dock-item svg { width: 20px; height: 20px; }
.admin-dock-item.active { color: var(--sand); font-weight: 600; }
.admin-dock-item.active::after {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 2px;
  background: var(--sand);
  border-radius: 0 0 2px 2px;
  box-shadow: 0 0 12px rgba(212, 165, 116, 0.6);
}
.admin-dock-item .dot {
  position: absolute;
  top: 6px;
  left: 50%;
  transform: translateX(-50%);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--sand);
  box-shadow: 0 0 8px rgba(212, 165, 116, 0.8);
}

/* Gate */
#gate {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px 16px;
}

.gate-box {
  width: 100%;
  max-width: 400px;
  background:
    linear-gradient(180deg, rgba(22, 27, 25, 0.85) 0%, rgba(11, 15, 13, 0.92) 100%),
    radial-gradient(circle at 50% 0%, rgba(212, 165, 116, 0.08) 0%, transparent 60%);
  background-blend-mode: normal, overlay;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 36px 28px;
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.04) inset,
    0 8px 32px rgba(0, 0, 0, 0.4),
    0 40px 80px -20px rgba(212, 165, 116, 0.08);
  position: relative;
}

.gate-box::before {
  content: '';
  position: absolute;
  top: 0;
  left: 10%;
  right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--sand), transparent);
  opacity: 0.6;
  border-radius: 20px 20px 0 0;
}

/* Service tabs */
.svc-tabs {
  display: flex;
  gap: 4px;
  background: var(--surface-2);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 20px;
  overflow-x: auto;
  border: 1px solid var(--border);
}

.svc-tab {
  flex: 1;
  min-width: fit-content;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
  transition: all .15s;
  white-space: nowrap;
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
}

.svc-tab.active {
  background: linear-gradient(180deg, rgba(212, 165, 116, 0.15) 0%, rgba(212, 165, 116, 0.08) 100%);
  color: var(--sand);
  border: 1px solid rgba(212, 165, 116, 0.2);
  box-shadow: 0 0 16px rgba(212, 165, 116, 0.15);
}

.svc-tab:hover:not(.active) {
  color: var(--text);
}

.field-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  padding: 12px;
  background: var(--surface-2);
  border-radius: 8px;
  margin-bottom: 8px;
  border: 1px solid var(--border);
}

.field-row-inputs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  flex: 1;
}

@media (max-width: 640px) {
  .field-row-inputs { grid-template-columns: 1fr; }
}

.icon-picker {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.icon-preview {
  width: 72px;
  height: 72px;
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(212, 165, 116, 0.1) 0%, rgba(10, 92, 63, 0.1) 100%);
  display: grid;
  place-items: center;
  font-size: 32px;
  border: 1px solid rgba(212, 165, 116, 0.2);
  flex-shrink: 0;
  overflow: hidden;
}

.icon-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.stock-code {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 6px 10px;
  background: var(--ink-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--sand);
  letter-spacing: 0.03em;
}

.stock-row {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 8px;
  border-bottom: 1px solid var(--border);
}

.stock-row:last-child { border-bottom: none; }

/* Image upload progress */
.upload-progress {
  width: 100%;
  height: 4px;
  background: var(--surface-3);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 8px;
}

.upload-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--sand) 0%, var(--sand-2) 100%);
  border-radius: 2px;
  width: 0%;
  transition: width .3s ease;
  box-shadow: 0 0 12px rgba(212, 165, 116, 0.5);
}
</style>
</head>

/* ═══ UI Helpers ═══ */
const setHTML = (sel, html) => { const el = $(sel); if (el) el.innerHTML = html; };
const onTap = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };

function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind === 'ok' ? 'success' : kind === 'bad' ? 'error' : '');
  el.innerHTML = `<span style="color:${kind === 'ok' ? 'var(--success)' : kind === 'bad' ? 'var(--error)' : 'var(--text-2)'}">${svg(kind === 'ok' ? I.check : kind === 'bad' ? I.x : I.help, 2.2)}</span><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = '.2s';
    setTimeout(() => el.remove(), 200);
  }, 3200);
}

function modal(html) {
  $('#modal').innerHTML = html;
  $('#overlay').classList.add('open');
}
window.closeModal = () => $('#overlay').classList.remove('open');
$('#overlay')?.addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

async function api(path, body) {
  const token = await auth.currentUser.getIdToken();
  const res = await fetch(API_BASE + path, {
    method: 'POST',
    headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
    body: JSON.stringify(body || {}),
  });
  const d = await res.json().catch(() => ({ success: false, error: 'رد غير مفهوم' }));
  if (!d.success) throw new Error(d.error || 'فشلت العملية');
  return d;
}

/* ═══ Auth Gate ═══ */
onTap('#gGo', async () => {
  const email = $('#gEmail').value.trim();
  const pass = $('#gPass').value;
  if (!email || !pass) return showGateErr('أكمل البيانات');
  $('#gGo').disabled = true;
  $('#gGo').classList.add('loading');
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch {
    showGateErr('البريد أو كلمة المرور غير صحيحة');
    $('#gGo').disabled = false;
    $('#gGo').classList.remove('loading');
  }
});

$('#gPass').addEventListener('keydown', e => { if (e.key === 'Enter') $('#gGo').click(); });

function showGateErr(m) {
  const el = $('#gErr');
  el.textContent = m;
  el.style.display = 'block';
}

onAuthStateChanged(auth, async user => {
  S.unsub.forEach(u => { try { u(); } catch {} });
  S.unsub = [];
  if (!user) {
    $('#gate').style.display = 'grid';
    $('#app').style.display = 'none';
    return;
  }

  try {
    const adminSnap = await getDoc(doc(db, 'admins', user.uid));
    if (!adminSnap.exists()) {
      await signOut(auth);
      $('#gate').style.display = 'grid';
      showGateErr('هذا الحساب ليس لديه صلاحية إدارة.');
      return;
    }
    S.admin = { uid: user.uid, email: user.email, ...adminSnap.data() };
    $('#gate').style.display = 'none';
    $('#app').style.display = 'block';
    $('#admName').textContent = S.admin.email || 'مدير';
    $('#admInitial').textContent = (S.admin.email || 'A').charAt(0).toUpperCase();
    subscribe();
    boot();
  } catch (e) {
    await signOut(auth);
    $('#gate').style.display = 'grid';
    showGateErr('تعذّر التحقق من الصلاحيات.');
  }
});

/* ═══ Subscriptions ═══ */
function sub(q, key) {
  S.unsub.push(onSnapshot(q, s => {
    S[key] = s.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => {
    console.warn(key, err.code);
  }));
}

function subscribe() {
  sub(query(collection(db, 'users'), orderBy('created_at', 'desc'), limit(200)), 'users');
  sub(query(collection(db, 'manual_cards'), orderBy('created_at', 'desc'), limit(200)), 'manualCards');
  sub(query(collection(db, 'manual_card_orders'), orderBy('created_at', 'desc'), limit(300)), 'manualOrders');
  sub(query(collection(db, 'orders'), orderBy('created_at', 'desc'), limit(200)), 'orders');
  sub(query(collection(db, 'wallet_deposits'), orderBy('created_at', 'desc'), limit(200)), 'deposits');
  sub(query(collection(db, 'withdrawals'), orderBy('created_at', 'desc'), limit(100)), 'withdrawals');
  sub(query(collection(db, 'tickets'), orderBy('updated_at', 'desc'), limit(80)), 'tickets');
  sub(query(collection(db, 'coupons'), limit(100)), 'coupons');
  sub(query(collection(db, 'sms_transactions'), orderBy('created_at', 'desc'), limit(100)), 'sms');
  sub(query(collection(db, 'services'), limit(200)), 'services');
  sub(query(collection(db, 'service_orders'), orderBy('created_at', 'desc'), limit(300)), 'serviceOrders');
  S.unsub.push(onSnapshot(doc(db, 'settings', 'main'), s => {
    if (s.exists()) S.settings = s.data();
    render();
  }, () => {}));
}

function buildNav() {
  const groups = {};
  PAGES.forEach(p => {
    if (!groups[p.g]) groups[p.g] = [];
    groups[p.g].push(p);
  });

  let rail = '';
  for (const [g, items] of Object.entries(groups)) {
    rail += `<span class="admin-group-label">${esc(g)}</span><div class="admin-group">`;
    items.forEach(p => {
      const c = p.badge ? BADGES[p.badge]() : 0;
      rail += `<button class="admin-nav-item" data-nav="${esc(p.k)}">
        ${svg(p.i)}
        <span>${esc(p.t)}</span>
        ${c ? `<span class="admin-badge">${c}</span>` : ''}
      </button>`;
    });
    rail += `</div>`;
  }
  setHTML('#navDesk', rail);

  const dk = DOCK.map(k => PAGES.find(p => p.k === k)).filter(Boolean);
  const dockEl = $('#navDock');
  if (dockEl) {
    dockEl.style.gridTemplateColumns = `repeat(${dk.length}, 1fr)`;
    dockEl.innerHTML = dk.map(p => {
      const c = p.badge ? BADGES[p.badge]() : 0;
      return `<button class="admin-dock-item" data-nav="${esc(p.k)}">
        ${c ? '<span class="dot"></span>' : ''}
        ${svg(p.i)}
        <span>${esc(p.t.split(' ')[0])}</span>
      </button>`;
    }).join('');
  }

  document.querySelectorAll('[data-nav]').forEach(b => {
    b.onclick = () => go(b.dataset.nav);
    b.classList.toggle('active', b.dataset.nav === S.page);
  });
}

window.go = k => {

  S.filter = 'all';

  render();
};

    </button>
  `);

  const fPan = $('#fPan');
  if (fPan) fPan.oninput = e => {
    const v = e.target.value.replace(/\D/g, '').slice(0, 19);
    e.target.value = v.replace(/(.{4})/g, '$1 ').trim();
  };
  const fExp = $('#fExp');
  if (fExp) fExp.oninput = e => {
    let v = e.target.value.replace(/\D/g, '').slice(0, 4);
    if (v.length > 2) v = v.slice(0, 2) + '/' + v.slice(2);
    e.target.value = v;
  };
  const fCvv = $('#fCvv');
  if (fCvv) fCvv.oninput = e => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
  };

  onTap('#fGo', async () => {
    const btn = $('#fGo');
    const payload = { id };
    if (!isTopup) {
      const pan = ($('#fPan').value || '').replace(/\s+/g, '');
      const exp = $('#fExp').value;
      const cvv = $('#fCvv').value;
      if (!/^\d{13,19}$/.test(pan)) return toast('رقم البطاقة غير صالح', 'bad');

      if (!/^\d{3,4}$/.test(cvv)) return toast('CVV غير صالح', 'bad');
      payload.card_number = pan;
      payload.expiry = exp;
      payload.cvv = cvv;
      payload.provider_ref = $('#fRef').value;
    }
    btn.disabled = true;
    btn.classList.add('loading');
    try {
      await api('/api/admin/mcard/fulfil', payload);
      closeModal();
      toast('تم التنفيذ', 'ok');
    } catch (e) {
      toast(e.message, 'bad');
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  });

  onTap('#fRej', () => {
    modal(`
      <div class="modal-head">
        <div class="modal-title">رفض الطلب</div>
        <button class="modal-close" onclick="closeModal()">${svg(I.x, 2)}</button>

/* ── Image compressor (browser-side) ── */
function compressImage(file, maxDim = 256, maxBytes = 60000) {
  return new Promise((resolve, reject) => {
    if (!file) return reject(new Error('لا يوجد ملف'));
    if (!/^image\//.test(file.type)) return reject(new Error('الملف ليس صورة'));

    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const ratio = Math.min(maxDim / width, maxDim / height);
          width = Math.round(width * ratio);
          height = Math.round(height * ratio);
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        let quality = 0.9;
        let dataUrl = canvas.toDataURL('image/jpeg', quality);

        // Loop to shrink quality until under maxBytes
        let attempts = 0;
        while (dataUrl.length > maxBytes * 1.35 && attempts < 12) {
          quality -= 0.08;
          if (quality < 0.2) quality = 0.2;
          dataUrl = canvas.toDataURL('image/jpeg', quality);
          attempts++;
        }

        // Further shrink dimensions if still too big
        let dimAttempts = 0;
        while (dataUrl.length > maxBytes * 1.35 && dimAttempts < 5) {
          width = Math.round(width * 0.8);
          height = Math.round(height * 0.8);
          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);
          dataUrl = canvas.toDataURL('image/jpeg', quality);
          dimAttempts++;
        }

        if (dataUrl.length > 180000) {
          return reject(new Error('الصورة كبيرة — جرّب صورة أبسط'));
        }

        resolve(dataUrl);
      };
      img.onerror = () => reject(new Error('تعذّر قراءة الصورة'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('تعذّر قراءة الملف'));
    reader.readAsDataURL(file);
  });
}

    <div class="grid-2 mb-3">

        <label class="field-label">السعر (USD) *</label>

      </div>

      <select class="input" id="sDeliv">
        <option value="auto" ${s.delivery_type === 'auto' ? 'selected' : ''}>🤖 تلقائي — من المخزون</option>
        <option value="manual" ${s.delivery_type === 'manual' ? 'selected' : ''}>👤 يدوي — من الأدمن</option>
      </select>
    </div>

    <div class="field mb-3">
      <label class="field-label" style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="sActive" ${s.is_active ? 'checked' : ''}>
        <span>الخدمة نشطة ومتاحة للعملاء</span>
      </label>
    </div>

    <div class="flex-between mb-3">
      <div class="h4" style="font-size:14px">الحقول المطلوبة من العميل</div>
      <button type="button" class="btn btn-secondary btn-sm" id="addFieldBtn">${svg(I.plus, 2)} حقل</button>
    </div>

    <p class="caption mb-3">حتى 5 حقول — تُطلب من العميل عند الشراء</p>

    <div id="fieldsList"></div>

    <button class="btn btn-primary btn-block" style="margin-top:20px" id="sSave">
      ${id ? 'حفظ التعديلات' : 'إنشاء الخدمة'}
    </button>
    ${id ? `<button class="btn btn-outline-danger btn-block" style="margin-top:8px" id="sDel">${svg(I.trash, 2)} حذف الخدمة</button>` : ''}
  `);

  // Fields state
  let fields = existingFields.map(f => ({ ...f }));

  const renderFields = () => {
    const list = $('#fieldsList');
    if (!fields.length) {
      list.innerHTML = `<p class="caption" style="text-align:center;padding:16px;color:var(--text-3)">لا حقول — العميل يشتري مباشرة</p>`;
      return;
    }
    list.innerHTML = fields.map((f, i) => `
      <div class="field-row" data-fi="${i}">
        <div class="field-row-inputs">
          <input class="input" data-fk="label" data-fi="${i}" value="${esc(f.label || '')}" placeholder="التسمية (البريد)">
          <select class="input" data-fk="type" data-fi="${i}">
            ${['text', 'number', 'email', 'tel', 'password', 'select', 'textarea'].map(t =>
              `<option value="${t}" ${f.type === t ? 'selected' : ''}>${t}</option>`).join('')}
          </select>
        </div>
        <button type="button" class="btn btn-sm" style="background:none;color:var(--error);padding:8px" data-del-field="${i}">
          ${svg(I.trash, 2)}
        </button>
      </div>
    `).join('');

    list.querySelectorAll('input[data-fk], select[data-fk]').forEach(el => {
      el.oninput = el.onchange = e => {
        const i = +e.target.dataset.fi;
        const k = e.target.dataset.fk;
        fields[i][k] = e.target.value;
      };
    });

    list.querySelectorAll('[data-del-field]').forEach(b => {
      b.onclick = () => {
        fields.splice(+b.dataset.delField, 1);
        renderFields();
      };
    });
  };

  renderFields();

  onTap('#addFieldBtn', () => {
    if (fields.length >= 5) return toast('الحد الأقصى 5 حقول', 'bad');
    fields.push({ key: 'f' + (fields.length + 1), label: '', type: 'text', placeholder: '', required: true });
    renderFields();
  });

  // Image upload with auto-compress
  onTap('#uploadImgBtn', () => $('#sImageFile').click());

  $('#sImageFile').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const statusEl = $('#imgStatus');
    statusEl.style.display = 'block';
    statusEl.textContent = '⏳ جاري ضغط الصورة...';
    statusEl.style.color = 'var(--sand)';

    try {
      const dataUrl = await compressImage(file, 256, 60000);
      $('#sIconUrl').value = dataUrl;
      $('#iconPreview').innerHTML = `<img src="${dataUrl}" alt="">`;
      $('#sEmoji').value = '';

      const kb = Math.round(dataUrl.length * 0.75 / 1024);
      statusEl.textContent = `✅ تم الضغط — ${kb}KB`;
      statusEl.style.color = '#7DD6A5';
    } catch (err) {
      statusEl.textContent = '❌ ' + err.message;
      statusEl.style.color = '#F0947E';
      toast(err.message, 'bad');
    }
  };

  $('#sEmoji').oninput = (e) => {
    $('#sIconUrl').value = '';
    $('#iconPreview').innerHTML = e.target.value || '📦';
    $('#imgStatus').style.display = 'none';
  };

  // Save
  onTap('#sSave', async () => {
    const name = $('#sName').value.trim();
    if (name.length < 2) return toast('اسم الخدمة مطلوب', 'bad');
    const price = n($('#sPrice').value, 0);
    if (price <= 0) return toast('السعر يجب أن يكون > 0', 'bad');

    const cleanFields = fields
      .filter(f => f.label && f.label.trim())
      .map((f, i) => ({
        key: (f.key || 'f' + (i + 1)).replace(/[^a-zA-Z0-9_]/g, '').slice(0, 24) || 'f' + (i + 1),
        label: f.label.trim().slice(0, 60),
        type: f.type || 'text',
        placeholder: (f.placeholder || '').slice(0, 80),
        required: f.required !== false,
      }));

    const iconUrl = $('#sIconUrl').value.trim();
    const emoji = $('#sEmoji').value.trim() || '📦';

    const payload = {
      id: id || undefined,
      name,
      desc: $('#sDesc').value.trim(),
      icon_emoji: iconUrl ? '' : emoji,
      icon_url: iconUrl,
      price_usd: price,
      delivery_type: $('#sDeliv').value,
      fields: cleanFields,
      is_active: $('#sActive').checked,
      sort: n($('#sSort').value, 100),
    };

    const btn = $('#sSave');
    btn.disabled = true;
    btn.classList.add('loading');
    try {
      await api('/api/admin/service/save', payload);
      closeModal();
      toast(id ? 'تم تحديث الخدمة' : 'تم إنشاء الخدمة', 'ok');
    } catch (e) {
      toast(e.message, 'bad');
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  });

  // Delete
  if (id) {
    onTap('#sDel', () => {
      modal(`
        <div class="modal-head">
          <div class="modal-title">حذف الخدمة</div>
          <button class="modal-close" onclick="closeModal()">${svg(I.x, 2)}</button>
        </div>
        <div class="alert alert-warning mb-4">${svg(I.warn)}<div>سيتم حذف "<strong>${esc(s.name)}</strong>" نهائياً.<br>لن يتأثر المخزون أو الطلبات السابقة.</div></div>
        <button class="btn btn-danger btn-block" id="delConfirm">تأكيد الحذف</button>
        <button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="closeModal()">إلغاء</button>
      `);
      onTap('#delConfirm', async () => {
        try {
          await api('/api/admin/service/delete', { id });
          closeModal();
          toast('تم حذف الخدمة', 'ok');
        } catch (e) { toast(e.message, 'bad'); }
      });
    });
  }
}

      <input class="input mono" id="cCode" value="${esc(c.id || '')}" ${id ? 'disabled' : ''} dir="ltr" placeholder="WELCOME10" style="text-transform:uppercase;letter-spacing:.08em;color:var(--sand)">
    </div>

    <div class="grid-2 mb-3">
      <div>
        <label class="field-label">النسبة ٪</label>
        <input class="input" id="cPct" type="number" min="0" max="100" value="${n(c.percent)}">
      </div>
      <div>
        <label class="field-label">أو مبلغ ثابت</label>
        <input class="input" id="cAmt" type="number" min="0" value="${n(c.amount_lyd)}">

    </div>

      <div>
        <label class="field-label">حد أقصى للخصم</label>
        <input class="input" id="cCap" type="number" min="0" value="${n(c.max_off_lyd)}">
      </div>
      <div>
        <label class="field-label">أقل قيمة طلب</label>
        <input class="input" id="cMin" type="number" min="0" value="${n(c.min_order_lyd)}">
      </div>
    </div>

    <div class="field mb-3">
      <label class="field-label">عدد الاستخدامات (0 = بلا حد)</label>
      <input class="input" id="cMax" type="number" min="0" value="${n(c.max_uses)}">
    </div>

    <div class="field mb-4">
      <label class="field-label">ينتهي في</label>
      <input class="input" id="cExp" type="date" value="${c.expires_at ? String(c.expires_at).slice(0, 10) : ''}">
    </div>

    <button class="btn btn-primary btn-block" id="cSave">حفظ</button>
    ${id ? `<button class="btn btn-outline-danger btn-block" style="margin-top:8px" id="cDel">حذف</button>` : ''}
  `);

  onTap('#cSave', async () => {
    const code = (id || $('#cCode').value).trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '');
    if (code.length < 3) return toast('الكود 3 أحرف على الأقل', 'bad');
    const pct = n($('#cPct').value), amt = n($('#cAmt').value);
    if (pct <= 0 && amt <= 0) return toast('حدّد نسبة أو مبلغًا', 'bad');

    const data = {
      percent: pct,
      amount_lyd: amt,
      max_off_lyd: n($('#cCap').value),
      min_order_lyd: n($('#cMin').value),
      max_uses: n($('#cMax').value),
      expires_at: $('#cExp').value ? new Date($('#cExp').value).toISOString() : '',
      once_per_user: true,
      active: true,
    };

    $('#cSave').disabled = true;
    $('#cSave').classList.add('loading');
    try {
      await setDoc(doc(db, 'coupons', code), id ? data : { ...data, used_count: 0, created_at: new Date().toISOString() }, { merge: true });
      closeModal();
      toast('حُفظ الكوبون', 'ok');
    } catch (e) {
      toast(e.message, 'bad');
      $('#cSave').disabled = false;
      $('#cSave').classList.remove('loading');
    }
  });

  onTap('#cDel', async () => {
    try {
      await deleteDoc(doc(db, 'coupons', id));
      closeModal();
      toast('حُذف الكوبون', 'ok');
    } catch (e) {
      toast(e.message, 'bad');
    }
  });
}

async function saveSettings(btn) {
  const payload = {};
  document.querySelectorAll('.sw[data-op]').forEach(el => {
    let v = el.classList.contains('on');
    if (el.dataset.inverse) v = !v;
    payload[el.dataset.op] = v;
  });
  document.querySelectorAll('input[data-op], textarea[data-op]').forEach(el => {
    const k = el.dataset.op;
    payload[k] = el.type === 'number' ? n(el.value) : el.value;
  });

  if (!Object.keys(payload).length) return;

  btn.disabled = true;
  btn.classList.add('loading');
  try {
    await api('/api/admin/settings', payload);
    toast('حُفظت الإعدادات', 'ok');
  } catch (e) {
    toast(e.message, 'bad');
  }
  btn.disabled = false;
  btn.classList.remove('loading');
}

/* ═══════════════════════════════════════════════════════════
   Bind
   ═══════════════════════════════════════════════════════════ */

function bind() {
  const q = $('#qBox');
  if (q) {
    q.oninput = e => {
      S.q = e.target.value;
      clearTimeout(q._t);
      q._t = setTimeout(() => {
        render();
        const el = $('#qBox');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      }, 250);
    };
  }

  document.querySelectorAll('[data-filter]').forEach(b =>
    b.onclick = () => { S.filter = b.dataset.filter; render(); });

  document.querySelectorAll('[data-mc]').forEach(b =>
    b.onclick = () => openMcardFulfil(b.dataset.mc));

  document.querySelectorAll('[data-ord-ok]').forEach(b =>
    b.onclick = () => openOrderAction(b.dataset.ordOk, 'complete'));
  document.querySelectorAll('[data-ord-no]').forEach(b =>
    b.onclick = () => openOrderAction(b.dataset.ordNo, 'reject'));

  document.querySelectorAll('[data-svc-tab]').forEach(b =>
    b.onclick = () => {
      S.svcTab = b.dataset.svcTab;
      if (S.svcTab === 'stock' && S.svcSelected) loadSvcStock(S.svcSelected);
      render();
    });

  onTap('#addSvc', () => openServiceEdit(null));
  onTap('#addSvc2', () => openServiceEdit(null));

  document.querySelectorAll('[data-edit-svc]').forEach(b =>
    b.onclick = () => openServiceEdit(b.dataset.editSvc));

  document.querySelectorAll('[data-del-svc]').forEach(b =>
    b.onclick = () => {
      const svc = S.services.find(x => x.id === b.dataset.delSvc);
      if (!svc) return;
      modal(`
        <div class="modal-head">
          <div class="modal-title">حذف الخدمة</div>
          <button class="modal-close" onclick="closeModal()">${svg(I.x, 2)}</button>
        </div>
        <div class="alert alert-warning mb-4">${svg(I.warn)}<div>سيتم حذف "<strong>${esc(svc.name)}</strong>" نهائياً.</div></div>
        <button class="btn btn-danger btn-block" id="delConfirm2">تأكيد الحذف</button>
        <button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="closeModal()">إلغاء</button>
      `);
      onTap('#delConfirm2', async () => {
        try {
          await api('/api/admin/service/delete', { id: b.dataset.delSvc });
          closeModal();
          toast('تم الحذف', 'ok');
        } catch (e) { toast(e.message, 'bad'); }
      });
    });

  const svcSel = $('#svcSelect');
  if (svcSel) {
    svcSel.onchange = () => {
      S.svcSelected = svcSel.value;
      if (S.svcSelected) {
        loadSvcStock(S.svcSelected);
      } else {
        S.svcStock = { items: [], stats: { unused: 0, used: 0, total: 0 } };
        render();
      }
    };
  }

  onTap('#addStockBtn', addStockCodes);

  document.querySelectorAll('[data-del-stock]').forEach(b =>
    b.onclick = () => delStockCode(b.dataset.delStock));

  document.querySelectorAll('[data-svc-deliver]').forEach(b =>
    b.onclick = () => openSvcDeliver(b.dataset.svcDeliver));
  document.querySelectorAll('[data-svc-reject]').forEach(b =>
    b.onclick = () => openSvcReject(b.dataset.svcReject));

  document.querySelectorAll('[data-dep]').forEach(b =>
    b.onclick = () => openDepositReview(b.dataset.dep));

  document.querySelectorAll('[data-wd-ok]').forEach(b =>
    b.onclick = () => openWithdrawAction(b.dataset.wdOk, 'complete'));
  document.querySelectorAll('[data-wd-no]').forEach(b =>
    b.onclick = () => openWithdrawAction(b.dataset.wdNo, 'reject'));

  document.querySelectorAll('[data-tic]').forEach(b =>
    b.onclick = () => openTicketDetail(b.dataset.tic));

  document.querySelectorAll('[data-user]').forEach(b =>
    b.onclick = () => openUserManage(b.dataset.user));

  document.querySelectorAll('[data-ecoup]').forEach(b =>
    b.onclick = () => openCouponEdit(b.dataset.ecoup));
  onTap('#addCoup', () => openCouponEdit(null));

  document.querySelectorAll('[data-settab]').forEach(b =>
    b.onclick = () => { S.setTab = b.dataset.settab; render(); });

  document.querySelectorAll('.sw[data-op]').forEach(el =>
    el.onclick = () => el.classList.toggle('on'));

  document.querySelectorAll('[data-save="ops"]').forEach(b =>
    b.onclick = () => saveSettings(b));
}

/* ═══ Stock helpers ═══ */

async function addStockCodes() {
  const svcId = S.svcSelected;
  const codesText = ($('#bulkCodes').value || '').trim();

  if (!svcId) { toast('اختر خدمة أولاً', 'bad'); return; }
  if (!codesText) { toast('أضف أكواداً', 'bad'); return; }

  const codes = codesText.split(/\r?\n/).map(c => c.trim()).filter(Boolean);
  if (!codes.length) { toast('لا أكواد صالحة', 'bad'); return; }
  if (codes.length > 500) { toast('حد أقصى 500 كود', 'bad'); return; }

  const btn = $('#addStockBtn');
  btn.disabled = true;
  btn.classList.add('loading');
  try {
    const r = await api('/api/admin/stock/add', { service_id: svcId, codes });
    toast(`تم إضافة ${r.added} كود`, 'ok');
    $('#bulkCodes').value = '';
    loadSvcStock(svcId);
  } catch (e) { toast(e.message, 'bad'); }
  btn.disabled = false;
  btn.classList.remove('loading');
}

async function loadSvcStock(svcId) {
  if (!svcId) return;
  try {
    const r = await api('/api/admin/stock/list', { service_id: svcId });
    S.svcStock = {
      items: r.items || [],
      stats: r.stats || { unused: 0, used: 0, total: 0 },
    };
    render();
  } catch (e) {
    console.error(e);
    toast(e.message, 'bad');
  }
}

async function delStockCode(itemId) {
  if (!S.svcSelected) return;
  try {
    await api('/api/admin/stock/delete', { id: itemId });
    toast('تم الحذف', 'ok');
    loadSvcStock(S.svcSelected);
  } catch (e) { toast(e.message, 'bad'); }
}

  `);
  onTap('#doOut', () => { closeModal(); signOut(auth); });
});
