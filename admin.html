<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0F0D">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://kardo.sdkhyrallh08.workers.dev; frame-src https://www.google.com https://kardo-1c657.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>كاردو — لوحة الإدارة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Reem+Kufi:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./theme-desert.css">

<style>
/* ═══════════════════════════════════════════════════════════
   ADMIN — COMPACT LAYOUT (v4.0.0)
   كل الأحجام مُصغّرة بنسبة ~25-30%
   ═══════════════════════════════════════════════════════════ */

/* ── Shell ── */
.admin-shell {
  display: grid;
  grid-template-columns: 1fr;
  min-height: 100vh;
}

@media (min-width: 1024px) {
  .admin-shell { grid-template-columns: 1fr 220px; }
}

/* ── Sidebar ── */
.admin-sidebar {
  display: none;
  width: 220px;
  background: var(--ink);
  border-left: 1px solid var(--border);
  padding: 18px 12px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

@media (min-width: 1024px) {
  .admin-sidebar { display: flex; flex-direction: column; }
}

.admin-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 6px;
  margin-bottom: 18px;
}

.admin-brand svg { width: 22px; height: 22px; }

.admin-brand-name {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.005em;
}

.admin-group { margin-bottom: 14px; }

.admin-group-label {
  display: block;
  padding: 0 8px;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--sand-3);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-bottom: 6px;
}

.admin-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  border-radius: 6px;
  color: var(--text-2);
  font-size: 12.5px;
  font-weight: 500;
  transition: all .15s;
  width: 100%;
  text-align: right;
  margin-bottom: 1px;
  position: relative;
  border: none;
  background: none;
  cursor: pointer;
}

.admin-nav-item svg { width: 15px; height: 15px; flex-shrink: 0; }

.admin-nav-item:hover {
  background: var(--surface-2);
  color: var(--text);
}

.admin-nav-item.active {
  background: linear-gradient(90deg, rgba(10, 92, 63, 0.4) 0%, rgba(10, 92, 63, 0.1) 100%);
  color: var(--sand);
  font-weight: 600;
}

.admin-nav-item.active::before {
  content: '';
  position: absolute;
  right: 0;
  top: 20%;
  bottom: 20%;
  width: 3px;
  background: var(--sand);
  border-radius: 3px;
  box-shadow: 0 0 8px rgba(212, 165, 116, 0.5);
}

.admin-badge {
  margin-right: auto;
  background: var(--sand);
  color: var(--ink);
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 999px;
  min-width: 16px;
  text-align: center;
  font-family: var(--font-mono);
}

/* ── Main ── */
.admin-main {
  min-width: 0;
  padding-bottom: 72px;
}

@media (min-width: 1024px) {
  .admin-main { padding-bottom: 24px; }
}

.admin-content {
  padding: 16px 12px;
  max-width: 1400px;
  margin: 0 auto;
}

@media (min-width: 640px) {
  .admin-content { padding: 20px; }
}

/* ── Bar ── */
.admin-main .bar {
  height: 52px !important;
  padding: 0 14px;
  gap: 10px;
}

.admin-main .bar-logo svg { width: 20px; height: 20px; }
.admin-main .bar-logo span { font-size: 13px !important; }

.admin-main .icon-btn {
  width: 34px;
  height: 34px;
  border-radius: 7px;
}

.admin-main .icon-btn svg { width: 17px; height: 17px; }

/* ── KPIs ── */
.admin-kpis {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}

@media (min-width: 640px) {
  .admin-kpis { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 1024px) {
  .admin-kpis { grid-template-columns: repeat(6, 1fr); }
}

.admin-kpi {
  background: linear-gradient(180deg, var(--surface) 0%, var(--ink-2) 100%);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px;
  position: relative;
  overflow: hidden;
}

.admin-kpi::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(212, 165, 116, 0.3), transparent);
  opacity: 0.5;
}

.admin-kpi-icon {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  margin-bottom: 6px;
  background: rgba(212, 165, 116, 0.1);
  color: var(--sand);
  border: 1px solid rgba(212, 165, 116, 0.15);
}

.admin-kpi-icon svg { width: 13px; height: 13px; }

.admin-kpi-value {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.1;
  color: var(--text);
}

.admin-kpi-label {
  font-family: var(--font-mono);
  font-size: 8.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-top: 2px;
}

/* ── Mobile dock ── */
.admin-dock {
  position: fixed;
  inset: auto 0 0 0;
  z-index: 50;
  display: grid;
  background: rgba(11, 15, 13, 0.95);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
  height: calc(56px + env(safe-area-inset-bottom));
}

@media (min-width: 1024px) {
  .admin-dock { display: none; }
}

.admin-dock-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: var(--text-3);
  font-size: 9px;
  font-weight: 500;
  position: relative;
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
  border: none;
  background: none;
  cursor: pointer;
}

.admin-dock-item svg { width: 18px; height: 18px; }
.admin-dock-item.active { color: var(--sand); font-weight: 600; }
.admin-dock-item.active::after {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 20px;
  height: 2px;
  background: var(--sand);
  border-radius: 0 0 2px 2px;
  box-shadow: 0 0 10px rgba(212, 165, 116, 0.6);
}
.admin-dock-item .dot {
  position: absolute;
  top: 5px;
  left: 50%;
  transform: translateX(-50%);
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--sand);
  box-shadow: 0 0 6px rgba(212, 165, 116, 0.8);
}

/* ── Gate ── */
#gate {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px 14px;
}

.gate-box {
  width: 100%;
  max-width: 360px;
  background:
    linear-gradient(180deg, rgba(22, 27, 25, 0.85) 0%, rgba(11, 15, 13, 0.92) 100%),
    radial-gradient(circle at 50% 0%, rgba(212, 165, 116, 0.08) 0%, transparent 60%);
  background-blend-mode: normal, overlay;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px 22px;
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.04) inset,
    0 8px 32px rgba(0, 0, 0, 0.4);
  position: relative;
}

.gate-box::before {
  content: '';
  position: absolute;
  top: 0;
  left: 10%;
  right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--sand), transparent);
  opacity: 0.6;
  border-radius: 16px 16px 0 0;
}

/* ── Service tabs ── */
.svc-tabs {
  display: flex;
  gap: 3px;
  background: var(--surface-2);
  border-radius: 8px;
  padding: 3px;
  margin-bottom: 14px;
  overflow-x: auto;
  border: 1px solid var(--border);
}

.svc-tab {
  flex: 1;
  min-width: fit-content;
  padding: 7px 12px;
  border-radius: 6px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-2);
  transition: all .15s;
  white-space: nowrap;
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
}

.svc-tab.active {
  background: linear-gradient(180deg, rgba(212, 165, 116, 0.15) 0%, rgba(212, 165, 116, 0.08) 100%);
  color: var(--sand);
  border: 1px solid rgba(212, 165, 116, 0.2);
  box-shadow: 0 0 12px rgba(212, 165, 116, 0.15);
}

.svc-tab:hover:not(.active) {
  color: var(--text);
}

/* ── Field rows ── */
.field-row {
  display: flex;
  gap: 6px;
  align-items: flex-end;
  padding: 8px;
  background: var(--surface-2);
  border-radius: 6px;
  margin-bottom: 6px;
  border: 1px solid var(--border);
}

.field-row-inputs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  flex: 1;
}

@media (max-width: 640px) {
  .field-row-inputs { grid-template-columns: 1fr; }
}

/* ── Icon picker ── */
.icon-picker {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.icon-preview {
  width: 56px;
  height: 56px;
  border-radius: 11px;
  background: linear-gradient(135deg, rgba(212, 165, 116, 0.1) 0%, rgba(10, 92, 63, 0.1) 100%);
  display: grid;
  place-items: center;
  font-size: 26px;
  border: 1px solid rgba(212, 165, 116, 0.2);
  flex-shrink: 0;
  overflow: hidden;
}

.icon-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ── Stock ── */
.stock-code {
  font-family: var(--font-mono);
  font-size: 10.5px;
  padding: 4px 8px;
  background: var(--ink-2);
  border: 1px solid var(--border);
  border-radius: 5px;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--sand);
  letter-spacing: 0.03em;
}

.stock-row {
  display: flex;
  gap: 6px;
  align-items: center;
  padding: 6px;
  border-bottom: 1px solid var(--border);
}

.stock-row:last-child { border-bottom: none; }

/* ── Image upload progress ── */
.upload-progress {
  width: 100%;
  height: 3px;
  background: var(--surface-3);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 6px;
  display: none;
}

.upload-progress.active { display: block; }

.upload-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--sand) 0%, var(--sand-2) 100%);
  border-radius: 2px;
  width: 0%;
  transition: width .3s ease;
  box-shadow: 0 0 10px rgba(212, 165, 116, 0.5);
}

/* ── Override عام لكل العناصر ── */
.field-label {
  font-size: 11.5px;
  margin-bottom: 5px;
}

.field-hint {
  font-size: 10.5px;
  margin-top: 4px;
}

.input {
  height: 38px;
  padding: 0 12px;
  font-size: 13px;
  border-radius: 6px;
}

textarea.input {
  min-height: 72px;
  padding: 8px 12px;
}

.btn {
  height: 36px;
  padding: 0 14px;
  font-size: 12.5px;
  border-radius: 6px;
  gap: 6px;
}

.btn svg { width: 14px; height: 14px; }

.btn-sm {
  height: 28px;
  padding: 0 10px;
  font-size: 11px;
}

.btn-sm svg { width: 12px; height: 12px; }

.card {
  padding: 14px;
  border-radius: 10px;
}

.card-lg { padding: 18px; }
.card-sm { padding: 10px; }

.list-row {
  padding: 10px 14px;
  gap: 10px;
}

.list-icon {
  width: 32px;
  height: 32px;
  border-radius: 7px;
}

.list-icon svg { width: 15px; height: 15px; }

.list-title { font-size: 12.5px; }
.list-meta { font-size: 10.5px; }
.list-amount { font-size: 12.5px; }

.table { font-size: 11.5px; }

.table th {
  padding: 8px 10px;
  font-size: 10px;
}

.table td {
  padding: 8px 10px;
}

.pill {
  padding: 6px 12px;
  font-size: 11px;
}

.badge {
  font-size: 9.5px;
  padding: 2px 6px;
}

.modal {
  max-width: 420px;
  padding: 18px;
  border-radius: 14px;
  max-height: 88vh;
}

@media (max-width: 640px) {
  .modal {
    border-radius: 16px 16px 0 0;
    max-width: 100%;
    padding: 16px;
  }
}

.modal-title { font-size: 14px; }
.modal-close { width: 28px; height: 28px; }
.modal-close svg { width: 16px; height: 16px; }
.modal-head { margin-bottom: 14px; }

.alert {
  padding: 10px 12px;
  font-size: 11.5px;
  border-radius: 7px;
  gap: 8px;
}

.alert svg { width: 15px; height: 15px; }

.copy-box { padding: 8px 12px; gap: 8px; }
.copy-value { font-size: 11.5px; }
.copy-btn { width: 26px; height: 26px; }

.toast {
  padding: 9px 12px;
  font-size: 12px;
  border-radius: 7px;
}

/* Headings */
.admin-content h2,
.admin-content .h2 {
  font-size: 20px;
  line-height: 1.25;
}

.admin-content h3,
.admin-content .h3 {
  font-size: 16px;
}

.admin-content h4,
.admin-content .h4 {
  font-size: 13.5px;
}

.admin-content .body { font-size: 13px; }
.admin-content .body-sm { font-size: 11.5px; }
.admin-content .caption { font-size: 10.5px; }

/* Empty state */
.empty-icon {
  width: 42px;
  height: 42px;
  border-radius: 10px;
}

.empty-icon svg { width: 20px; height: 20px; }

/* Small screens */
@media (max-width: 640px) {
  .admin-kpi-value { font-size: 14px; }
  .admin-kpi-icon { width: 22px; height: 22px; }
  .admin-kpi-icon svg { width: 12px; height: 12px; }
  .card { padding: 12px; }
  .card-lg { padding: 14px; }
  .admin-content { padding: 14px 10px; }
}

@media (max-width: 400px) {
  .admin-kpis { gap: 6px; }
  .admin-kpi { padding: 8px; }
  .admin-kpi-value { font-size: 13px; }
  .admin-kpi-label { font-size: 8px; }
}
</style>
</head>
<body>

<!-- ═══ GATE ═══ -->
<div id="gate">
  <div class="gate-box">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:22px;justify-content:center">
      <svg width="36" height="36" viewBox="0 0 40 40">
        <rect width="40" height="40" rx="10" fill="#0B0F0D"/>
        <path d="M11 9h4.4v22H11z" fill="#D4A574"/>
        <path d="M17 20.2 27.5 9H33L22.4 20.2 33 31h-5.6z" fill="#D4A574"/>
        <rect x="19" y="15.6" width="12.4" height="8.8" rx="2" fill="#0B0F0D"/>
        <rect x="21" y="18.4" width="3.4" height="2.6" rx=".7" fill="#D4A574" opacity=".7"/>
      </svg>
      <div>
        <div style="font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--text)">كاردو</div>
        <div class="caption" style="font-family:var(--font-mono);letter-spacing:0.1em;font-size:9.5px">ADMIN PANEL</div>
      </div>
    </div>

    <h1 style="font-size:15px;margin-bottom:4px;font-family:var(--font-display);color:var(--text)">تسجيل الدخول</h1>
    <p class="body-sm text-2" style="margin-bottom:20px;font-size:11.5px">هذه الصفحة للمصرّح لهم فقط.</p>

    <div id="gErr" style="display:none;padding:9px 12px;border-radius:7px;font-size:12px;line-height:1.55;margin-bottom:14px;border:1px solid rgba(200,75,49,0.3);background:rgba(200,75,49,0.1);color:#F0947E"></div>

    <div class="field mb-3">
      <label class="field-label">البريد الإلكتروني</label>
      <input class="input" id="gEmail" type="email" dir="ltr" autocomplete="email" placeholder="admin@kardo.ly">
    </div>

    <div class="field mb-3">
      <label class="field-label">كلمة المرور</label>
      <input class="input" id="gPass" type="password" dir="ltr" autocomplete="current-password" placeholder="••••••••">
    </div>

    <button class="btn btn-primary btn-block" id="gGo" style="height:40px;font-size:13px">تسجيل الدخول</button>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app" style="display:none">
  <div class="admin-shell">

    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <svg viewBox="0 0 40 40">
          <rect width="40" height="40" rx="9" fill="#0B0F0D"/>
          <path d="M11 9h4.4v22H11z" fill="#D4A574"/>
          <path d="M17 20.2 27.5 9H33L22.4 20.2 33 31h-5.6z" fill="#D4A574"/>
        </svg>
        <span class="admin-brand-name">كاردو — إدارة</span>
      </div>

      <nav id="navDesk" style="flex:1"></nav>

      <div style="padding-top:12px;border-top:1px solid var(--border);margin-top:12px">
        <div style="display:flex;align-items:center;gap:8px;padding:0 8px 10px">
          <div id="admInitial" style="width:28px;height:28px;border-radius:7px;background:rgba(212,165,116,0.15);color:var(--sand);border:1px solid rgba(212,165,116,0.2);display:grid;place-items:center;font-weight:700;font-size:11px;font-family:var(--font-display)">A</div>
          <div style="min-width:0;flex:1">
            <div class="caption" style="color:var(--text-2);font-weight:600;font-size:10.5px" id="admName">—</div>
            <div class="caption" style="font-family:var(--font-mono);letter-spacing:0.08em;font-size:9px">SUPER ADMIN</div>
          </div>
        </div>
        <button class="admin-nav-item" id="logoutBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          <span>تسجيل الخروج</span>
        </button>
      </div>
    </aside>

    <!-- Main -->
    <div class="admin-main">
      <header class="bar">
        <div class="bar-logo" style="gap:6px">
          <svg viewBox="0 0 40 40">
            <rect width="40" height="40" rx="9" fill="#0B0F0D"/>
            <path d="M11 9h4.4v22H11z" fill="#D4A574"/>
            <path d="M17 20.2 27.5 9H33L22.4 20.2 33 31h-5.6z" fill="#D4A574"/>
          </svg>
          <span>لوحة الإدارة</span>
        </div>
        <div class="bar-actions">
          <span class="badge badge-warning" id="killChip" style="display:none">
            <span class="badge-dot"></span> الإيقاف مفعّل
          </span>
          <button class="icon-btn" data-act="refresh" aria-label="تحديث">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>
          </button>
        </div>
      </header>

      <main class="admin-content" id="view"></main>
    </div>

  </div>

  <nav class="admin-dock" id="navDock"></nav>
</div>

<!-- Toasts + Overlay -->
<div id="toasts"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script type="module" src="./admin.js"></script>
</body>
</html>
