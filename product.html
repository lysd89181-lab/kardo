<style>
  .pp { max-width: 720px; margin: 0 auto; padding: 18px 16px 110px; }
  .pp-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .pp-logo { display: flex; align-items: center; gap: 8px; font-weight: 800; color: var(--text); text-decoration: none; font-family: 'Reem Kufi', sans-serif; font-size: 20px; }
  .pp-logo b { color: var(--brand); }
  .pp-crumb { font-size: 12px; color: var(--text-3); margin-bottom: 10px; }
  .pp-crumb a { color: var(--brand); text-decoration: none; }
  .pp-hero { aspect-ratio: 16/10; border-radius: 20px; overflow: hidden; background: #0f1312; border: 1px solid var(--border); margin-bottom: 16px; }
  .pp-hero img { width: 100%; height: 100%; object-fit: cover; }
  .pp h1 { font-size: 24px; margin: 0 0 8px; }
  .pp-price { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 12px; }
  .pp-price b { font-family: var(--font-mono); font-size: 30px; color: var(--brand); }
  .pp-price s { color: var(--text-3); font-family: var(--font-mono); }
  .pp-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .pp-badges span { font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); }
  .pp-badges .ok { color: var(--success); border-color: var(--success-border); }
  .pp-badges .no { color: var(--error); border-color: var(--error-border); }
  .pp-desc { color: var(--text-2); line-height: 2; white-space: pre-line; }
  .pp-buy { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: 696px; margin: 0 auto; z-index: 10; }
  .pp h2 { font-size: 16px; margin: 28px 0 10px; }
