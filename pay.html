<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#EDEFEE">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src https://kardo.sdkhyrallh08.workers.dev; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>كاردو — دفع فاتورة</title>
<link rel="icon" href="./favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap">
<script src="./theme.js"></script>
<link rel="stylesheet" href="./kardo-ui.css?v=52">
<style>
  body { margin: 0; min-height: 100vh; font-family: var(--u-text); }
  .pw { max-width: 460px; margin: 0 auto; padding: 18px 18px 40px; }
  .ptop { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .ptop img { height: 34px; }
  .ptop span { font: 500 12.5px var(--u-text); color: var(--u-ink-3); }
  .pcard { background: var(--u-s1); border: 1px solid var(--u-line); border-radius: var(--u-r-lg); box-shadow: var(--u-shadow); padding: 18px; }
  .pfor { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--u-r-sm); background: var(--u-gold-soft); margin-bottom: 14px; font: 500 13.5px/1.7 var(--u-text); color: var(--u-ink); }
  .pfor svg { width: 22px; height: 22px; color: var(--u-gold); flex: none; }
  .copy-box { display: flex; align-items: center; gap: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .copy-value { flex: 1; min-width: 0; word-break: break-all; font: 600 14px var(--u-display); direction: ltr; text-align: left; }
  .copy-btn { border: 0; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; cursor: pointer; }
  .copy-btn svg { width: 19px; height: 19px; }
  .pmsg { text-align: center; padding: 40px 10px; color: var(--u-ink-2); font: 500 15px/1.8 var(--u-text); }
  .pfoot { text-align: center; margin-top: 18px; font: 400 12px var(--u-text); color: var(--u-ink-3); }
  .pfoot a { color: var(--u-gold); text-decoration: none; font-weight: 600; }
  .kinv-top { padding-inline-end: 0; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--u-ink); color: var(--u-s1); padding: 10px 18px; border-radius: 12px; font: 500 14px var(--u-text); opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<main class="pw">
  <div class="ptop"><img src="./kardo-logo.png" alt="كاردو"><span>دفع آمن</span></div>
  <div id="pv"><div class="pcard"><div class="pmsg">جارٍ تحميل الفاتورة…</div></div></div>
  <p class="pfoot">هذه الصفحة للدفع فقط — لا تحتاج حساب. <a href="./index.html">ما هو كاردو؟</a></p>
</main>
<div id="toast"></div>
<script src="./kardo-qr.js?v=49"></script>
<script src="./pay.js?v=52"></script>
</body>
</html>
