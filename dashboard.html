<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020617">
<meta name="robots" content="noindex,nofollow">
<title>كاردو — لوحتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#020617;--s1:#0D1421;--s2:#131C2C;--s3:#1A2436;--s4:#232F45;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);--tx:#F8FAFC;--tx-2:#94A3B8;--tx-3:#5F6E88;--g:#10B981;--g-2:#0E9E70;--g-3:#34D399;--g-soft:rgba(16,185,129,.10);--g-line:rgba(16,185,129,.30);--bad:#EF5F5F;--bad-soft:rgba(239,95,95,.10);--bad-line:rgba(239,95,95,.30);--warn:#F59E0B;--warn-soft:rgba(245,158,11,.10);--spring:cubic-bezier(.34,1.4,.44,1);--ease:cubic-bezier(.22,1,.36,1);--swift:cubic-bezier(.4,0,.2,1);--rail:260px;--bar-h:64px;--dock-h:68px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(70vw 55vh at 88% -8%,rgba(16,185,129,.07),transparent 60%),radial-gradient(60vw 45vh at -8% 4%,rgba(52,211,153,.04),transparent 58%)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit;color:inherit;width:100%}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--g);outline-offset:3px;border-radius:8px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--s4);border-radius:8px}
svg{width:19px;height:19px;flex:none;display:inline-block;vertical-align:middle}
.mono{font-family:'IBM Plex Mono',monospace}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-weight:700}
.hidden{display:none!important}
.shell{display:grid;grid-template-columns:1fr;min-height:100vh;position:relative;z-index:1}
@media(min-width:1024px){.shell{grid-template-columns:1fr var(--rail)}}
.rail{display:none;grid-column:2;position:sticky;top:0;height:100vh;flex-direction:column;padding:22px 14px;border-inline-start:1px solid var(--line);background:linear-gradient(180deg,rgba(13,20,33,.6),rgba(2,6,23,.95));backdrop-filter:blur(20px);overflow-y:auto}
@media(min-width:1024px){.rail{display:flex}}
.main{grid-column:1;min-width:0;padding-bottom:calc(var(--dock-h) + env(safe-area-inset-bottom) + 16px)}
@media(min-width:1024px){.main{padding-bottom:32px}}
.wrap{padding:20px 16px;max-width:1280px;margin:0 auto}
@media(min-width:640px){.wrap{padding:28px}}
.bar{position:sticky;top:0;z-index:40;height:var(--bar-h);display:flex;align-items:center;gap:12px;padding:0 16px;background:rgba(2,6,23,.82);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.bar-title{font-size:17px;font-weight:800;letter-spacing:-.025em}
.bar-actions{margin-inline-start:auto;display:flex;gap:8px}
.iconbtn{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;color:var(--tx-2);border:1px solid transparent;transition:all .18s}
.iconbtn:hover{background:var(--s2);color:var(--tx);border-color:var(--line)}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px;margin-bottom:22px}
.brand .en{font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.brand .ar{font-size:11px;color:var(--tx-3)}
.nav-group{margin:16px 0 8px;padding:0 12px;font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--tx-3);text-transform:uppercase;opacity:.65}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:11px;color:var(--tx-2);font-size:14px;font-weight:600;position:relative;margin-bottom:3px;transition:all .16s}
.nav:hover{background:var(--s1);color:var(--tx)}
.nav.on{background:var(--s2);color:var(--tx)}
.nav.on::before{content:'';position:absolute;inset-inline-start:0;top:24%;bottom:24%;width:3px;border-radius:99px;background:var(--g)}
.nav.on svg{color:var(--g)}
.rail-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
.rail-user{display:flex;align-items:center;gap:11px;padding:0 4px 12px}
.rail-av{width:36px;height:36px;border-radius:11px;background:var(--g-soft);color:var(--g);display:grid;place-items:center;font-weight:800}
.rail-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-role{font-size:11px;color:var(--tx-3)}
.h1{font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.2}
.h2{font-size:17px;font-weight:800;letter-spacing:-.022em;line-height:1.3}
.h3{font-size:14.5px;font-weight:700}
.sub{color:var(--tx-2);font-size:13.5px;line-height:1.6}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 14px;gap:12px}
.box{background:linear-gradient(180deg,var(--s1),rgba(2,6,23,.75));border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;transition:border-color .25s}
.box:hover{border-color:var(--line-2)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);margin-bottom:18px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:linear-gradient(180deg,var(--s1),rgba(2,6,23,.5));border:1px solid var(--line);border-radius:14px;padding:16px;transition:border-color .25s}
.kpi:hover{border-color:var(--g-line)}
.kpi-i{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;margin-bottom:12px}
.kpi-v{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.kpi-k{font-size:11.5px;color:var(--tx-3);margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:11px;font-weight:700;font-size:13.5px;font-family:inherit;background:linear-gradient(135deg,var(--g),var(--g-2));color:#04121B;box-shadow:0 8px 18px -8px rgba(16,185,129,.55);transition:transform .18s;position:relative;overflow:hidden}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.42;cursor:not-allowed;background:var(--s3);color:var(--tx-3);box-shadow:none}
.btn svg{width:16px;height:16px}
.btn.line{background:transparent;border:1px solid var(--line-2);color:var(--tx);box-shadow:none}
.btn.line:hover:not(:disabled){background:var(--s2)}
.btn.ghost{background:var(--s2);color:var(--tx);box-shadow:none}
.btn.dark{background:var(--s1);border:1px solid var(--line-2);color:var(--tx);box-shadow:none}
.btn.dark:hover:not(:disabled){border-color:var(--g);color:var(--g)}
.btn.sm{padding:8px 13px;font-size:12.5px;border-radius:10px}
.btn.wide{width:100%}
.btn.loading{color:transparent;pointer-events:none}
.btn.loading::after{content:'';position:absolute;width:16px;height:16px;border:2.5px solid rgba(4,18,27,.3);border-top-color:#04121B;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.inp{background:var(--s2);border:1.5px solid var(--line-2);border-radius:12px;padding:12px 14px;color:var(--tx);font-size:14px;font-family:inherit}
.inp:focus{outline:none;border-color:var(--g);background:var(--s3);box-shadow:0 0 0 3px var(--g-soft)}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--g-soft);color:var(--g)}
.chip.wait{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.off{background:var(--s3);color:var(--tx-3)}
.empty{text-align:center;padding:46px 20px;color:var(--tx-2)}
.empty .ei{width:64px;height:64px;border-radius:18px;margin:0 auto 16px;display:grid;place-items:center;background:var(--s2);color:var(--tx-3)}
.empty .et{font-weight:800;color:var(--tx);font-size:15px;margin-bottom:6px}
.note{background:var(--warn-soft);border:1px solid rgba(245,158,11,.28);color:#F0C878;padding:12px 15px;border-radius:12px;font-size:13px;margin-bottom:14px}
.note.ok{background:var(--g-soft);border-color:var(--g-line);color:var(--g-3)}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.grid3{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:720px){.grid3{grid-template-columns:repeat(3,1fr)}}
.flex-b{display:flex;justify-content:space-between;align-items:center;gap:12px}
.vcard{aspect-ratio:1.586;border-radius:18px;background:linear-gradient(135deg,#0F172A,#1A2436 55%,#0D1421);border:1px solid rgba(255,255,255,.10);padding:20px;position:relative;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.vcard::before{content:'';position:absolute;inset:0;background:radial-gradient(80% 60% at 100% 0%,rgba(16,185,129,.20),transparent 55%);pointer-events:none}
.vcard-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.vcard-brand{font-size:15px;font-weight:800;color:#F8FAFC}
.vcard-brand small{font-size:8px;color:var(--tx-3);letter-spacing:.08em;display:block;margin-top:2px}
.vcard-chip{width:38px;height:30px;border-radius:6px;background:linear-gradient(135deg,#D4AF37,#F4E5A8 45%,#B8860B)}
.vcard-num{font-family:'IBM Plex Mono',monospace;font-size:16px;letter-spacing:.12em;color:#F1F5F9;margin-top:auto;position:relative;z-index:1}
.vcard-bot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;position:relative;z-index:1}
.vcard-lbl{font-size:8px;color:var(--tx-3);letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
.vcard-val{font-size:11.5px;font-weight:600;color:#E2E8F0}
.vcard-logo{font-size:18px;font-weight:900;font-style:italic;color:#F8FAFC}
.ov{position:fixed;inset:0;z-index:120;background:rgba(2,6,23,.72);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.ov.show{display:flex}
@media(min-width:640px){.ov{align-items:center}}
.sheet{background:var(--s1);border:1px solid var(--line);border-bottom:none;width:100%;max-width:540px;border-radius:24px 24px 0 0;padding:22px;max-height:92vh;overflow-y:auto}
@media(min-width:640px){.sheet{border-radius:20px}}
.sheet-head{display:flex;gap:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:min(92vw,400px);pointer-events:none}
.toast{background:var(--s3);border:1px solid var(--line-2);padding:13px 15px;border-radius:12px;font-size:13.5px;font-weight:600;display:flex;gap:10px;box-shadow:0 20px 44px -16px rgba(0,0,0,.9);pointer-events:auto}
.toast.ok{border-color:var(--g-line);background:linear-gradient(180deg,rgba(16,185,129,.15),rgba(13,20,33,.95))}
.toast.bad{border-color:var(--bad-line);background:linear-gradient(180deg,rgba(239,95,95,.15),rgba(13,20,33,.95))}
.toast svg{width:18px;height:18px;flex:none}
.dock{position:fixed;inset:auto 0 0 0;z-index:50;display:grid;height:var(--dock-h);padding-bottom:env(safe-area-inset-bottom);background:rgba(2,6,23,.94);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
@media(min-width:1024px){.dock{display:none}}
.dk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:700;color:var(--tx-3);padding:0 4px;position:relative}
.dk.on{color:var(--g)}
.dk.on::before{content:'';position:absolute;top:0;left:50%;width:22px;height:2.5px;border-radius:0 0 4px 4px;background:var(--g);transform:translateX(-50%)}
.dk svg{width:20px;height:20px}
#gate{min-height:100vh;display:none;place-items:center;padding:20px}
#gate.show{display:grid}
.gate-card{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:30px 26px;width:min(100%,400px);text-align:center}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h2 style="font-size:20px;font-weight:800;margin-bottom:10px">جاري التحقق…</h2>
    <p class="sub">يتم التحقق من حسابك</p>
  </div>
</div>

<div id="app" style="display:none">
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <span id="railMark"></span>
      <div><div class="en">KARDO</div><div class="ar">كاردو</div></div>
    </div>
    <nav id="navRail"></nav>
    <div class="rail-foot">
      <div class="rail-user">
        <div class="rail-av" id="railAv">A</div>
        <div style="min-width:0;flex:1">
          <div class="rail-name" id="railName">—</div>
          <div class="rail-role">عضو كاردو</div>
        </div>
      </div>
      <button class="nav" id="railOut"></button>
    </div>
  </aside>
  <div class="main">
    <header class="bar">
      <div class="bar-title" id="barTitle">الرئيسية</div>
      <div class="bar-actions">
        <button class="iconbtn" id="refreshBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>
        </button>
      </div>
    </header>
    <main class="wrap" id="view"></main>
  </div>
</div>
<nav class="dock" id="navDock"></nav>
</div>

<div id="toasts"></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, getDoc, collection, query, where, onSnapshot, limit } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const API_BASE = 'https://kardo.sdkhyrallh08.workers.dev';
const firebaseConfig = {
  apiKey: "AIzaSyC-GntWur6r_Ow_v0wTNymQqQa6brzgvW8",
  authDomain: "kardo-1c657.firebaseapp.com",
  projectId: "kardo-1c657",
  storageBucket: "kardo-1c657.firebasestorage.app",
  messagingSenderId: "593934928630",
  appId: "1:593934928630:web:d36ea455a284e974043ad7"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const n = v => { const x = parseFloat(v); return Number.isFinite(x) ? x : 0; };
const usd = v => '$' + Number(v || 0).toFixed(2);
const lyd = v => Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' د.ل';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt = v => { if(!v) return '—'; const d = v.toDate ? v.toDate() : new Date(v); return isNaN(d) ? '—' : d.toLocaleDateString('ar-LY', { day: '2-digit', month: 'short' }) + ' · ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); };

const S = { user: null, me: null, page: 'home', unsub: [], myCards: [], myOrders: [], myDeps: [], myTickets: [], vipPlans: [], settings: {}, newKind: 'new' };

const I = {
  home:'<path d="M3 10.4 12 3.2l9 7.2V20a1 1 0 0 1-1 1h-5v-6.5H9V21H4a1 1 0 0 1-1-1z"/>',
  card:'<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>',
  cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  plus:'<path d="M12 5.5v13M5.5 12h13"/>',
  award:'<circle cx="12" cy="8" r="6"/><path d="M8.2 13.7 7 22l5-3 5 3-1.2-8.3"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .9-1 1.6v.3"/><path d="M12 17h.01"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.9 14.6a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 0 1-4 0v-.1a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H4a2 2 0 0 1 0-4h.1A1.6 1.6 0 0 0 5.2 7.6l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 2.7-1.1V3a2 2 0 0 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 0 1 0 4h-.1a1.6 1.6 0 0 0-1 .9z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 2"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  warn:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6A2 2 0 0 0 22 18L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  up:'<path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/>'
};
const svg = (d, w = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

function mark(size = 32) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" style="flex:none">
    <defs><linearGradient id="k${size}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#34D399"/></linearGradient></defs>
    <rect width="40" height="40" rx="11" fill="#0D1421"/>
    <path d="M11 9h4.4v22H11z" fill="url(#k${size})"/>
    <path d="M17 20.2 27.5 9H33L22.4 20.2 33 31h-5.6z" fill="url(#k${size})"/>
    <rect x="19" y="15.6" width="12.4" height="8.8" rx="2.2" fill="#F8FAFC" opacity=".95"/>
  </svg>`;
}
$('#railMark').innerHTML = mark(32);
$('#railOut').innerHTML = svg(I.out) + '<span>تسجيل الخروج</span>';

function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = (kind === 'ok' ? svg(I.check, 2.4) : kind === 'bad' ? svg(I.warn, 2) : '') + `<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.28s'; setTimeout(() => el.remove(), 280); }, 3600);
}

function sheet(html) { $('#sheet').innerHTML = html; $('#ov').classList.add('show'); }
window.closeSheet = () => { $('#ov').classList.remove('show'); };
$('#ov').addEventListener('click', e => { if(e.target.id === 'ov') closeSheet(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

async function api(path, body) {
  const token = await auth.currentUser.getIdToken();
  const res = await fetch(API_BASE + path, {
    method: 'POST',
    headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
    body: JSON.stringify(body || {})
  });
  const d = await res.json().catch(() => ({ success: false, error: 'رد غير مفهوم' }));
  if(!d.success) throw new Error(d.error || 'فشلت العملية');
  return d;
}

/* ═══ Auth ═══ */
onAuthStateChanged(auth, async user => {
  S.unsub.forEach(u => { try { u(); } catch {} });
  S.unsub = [];

  if(!user) { location.replace('login.html'); return; }

  let isAdmin = false;
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (snap.exists()) {
      S.me = { id: snap.id, ...snap.data() };
      if (S.me.role === 'admin') isAdmin = true;
    }
  } catch (e) {}

  if (isAdmin) { location.replace('admin.html'); return; }

  S.user = user;
  $('#gate').classList.remove('show');
  $('#app').style.display = 'block';
  $('#railName').textContent = user.displayName || (S.me && S.me.name) || user.email.split('@')[0];
  $('#railAv').textContent = (user.displayName || user.email).charAt(0).toUpperCase();

  subscribe();
  render();
});

/* ═══ Subscribe ═══ */
function sub(q, key) {
  S.unsub.push(onSnapshot(q, s => {
    S[key] = s.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => console.warn(key, err.code)));
}

function subscribe() {
  const uid = S.user.uid;
  S.unsub.push(onSnapshot(doc(db, 'users', uid), s => {
    if(s.exists()) { S.me = { id: s.id, ...s.data() }; render(); }
  }, err => console.warn('user', err.code)));

  sub(query(collection(db, 'manual_cards'), where('uid', '==', uid), limit(100)), 'myCards');
  sub(query(collection(db, 'manual_card_orders'), where('uid', '==', uid), limit(100)), 'myOrders');
  sub(query(collection(db, 'wallet_deposits'), where('uid', '==', uid), limit(100)), 'myDeps');
  sub(query(collection(db, 'tickets'), where('uid', '==', uid), limit(50)), 'myTickets');
  sub(query(collection(db, 'vip_plans'), where('active', '==', true)), 'vipPlans');

  getDoc(doc(db, 'settings', 'public')).then(s => {
    if(s.exists()) { S.settings = s.data(); render(); }
  }).catch(() => {});
}

const PAGES = [
  { k: 'home',     t: 'الرئيسية',    i: I.home,  g: 'الرئيسية' },
  { k: 'wallet',   t: 'محفظتي',      i: I.cash,  g: 'المال' },
  { k: 'cards',    t: 'بطاقاتي',     i: I.card,  g: 'المال' },
  { k: 'new',      t: 'بطاقة جديدة', i: I.plus,  g: 'الإجراءات' },
  { k: 'vip',      t: 'VIP',         i: I.award, g: 'الإجراءات' },
  { k: 'support',  t: 'الدعم',       i: I.help,  g: 'الإجراءات' },
  { k: 'settings', t: 'الإعدادات',   i: I.gear,  g: 'الحساب' }
];
const DOCK = ['home', 'wallet', 'cards', 'vip', 'settings'];

function buildNav() {
  const groups = {};
  PAGES.forEach(p => { if(!groups[p.g]) groups[p.g] = []; groups[p.g].push(p); });
  let rail = '';
  for(const [g, items] of Object.entries(groups)) {
    rail += `<div class="nav-group">${g}</div>`;
    items.forEach(p => {
      rail += `<button class="nav ${S.page === p.k ? 'on' : ''}" data-nav="${p.k}">${svg(p.i)}<span>${p.t}</span></button>`;
    });
  }
  $('#navRail').innerHTML = rail;
  const dk = DOCK.map(k => PAGES.find(p => p.k === k)).filter(Boolean);
  $('#navDock').style.gridTemplateColumns = `repeat(${dk.length}, 1fr)`;
  $('#navDock').innerHTML = dk.map(p => `<button class="dk ${S.page === p.k ? 'on' : ''}" data-nav="${p.k}">${svg(p.i)}<span>${p.t}</span></button>`).join('');
  $$('[data-nav]').forEach(b => b.onclick = () => go(b.dataset.nav));
}

window.go = k => { S.page = k; window.scrollTo({ top: 0 }); render(); };

/* ═══ Render ═══ */
let _raf = null;
function render() {
  if(_raf) return;
  _raf = requestAnimationFrame(() => { _raf = null; paint(); });
}
function paint() {
  buildNav();
  $$('[data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === S.page));
  const page = PAGES.find(p => p.k === S.page);
  $('#barTitle').textContent = page ? page.t : 'لوحتي';
  const V = { home: vHome, wallet: vWallet, cards: vCards, new: vNew, vip: vVip, support: vSupport, settings: vSettings };
  $('#view').innerHTML = (V[S.page] || vHome)();

}

      </div>`}
    <label class="lbl" style="display:block;font-size:12.5px;font-weight:700;color:var(--tx-2);margin-bottom:8px">المبلغ بالدولار</label>
    <input class="inp num" id="depAmt" type="number" min="5" step="1" value="10" style="margin-bottom:8px">
    <div class="sub" style="font-size:11.5px;margin-bottom:14px" id="depCalc">= ${lyd(10 * rate)}</div>
    <label class="lbl" style="display:block;font-size:12.5px;font-weight:700;color:var(--tx-2);margin-bottom:8px">رقم هاتفك</label>
    <input class="inp mono" id="depPhone" dir="ltr" placeholder="0912345678" style="margin-bottom:14px">
    <button class="btn wide" id="depGo">تأكيد</button>
    <button class="btn line wide" style="margin-top:10px" onclick="closeSheet()">إلغاء</button>`);

  const amt = $('#depAmt');
  amt.oninput = () => { $('#depCalc').textContent = '= ' + lyd(n(amt.value) * rate); };

  $('#depGo').onclick = async () => {
    const v = n($('#depAmt').value);
    const ph = $('#depPhone').value.trim();
    if(v < 5) return toast('الحد الأدنى $5', 'bad');
    if(!isUsdt && ph.length < 9) return toast('رقم غير صحيح', 'bad');
    const btn = $('#depGo');
    btn.disabled = true; btn.classList.add('loading');
    try {
      await api('/api/deposits/create', { method, amount_usd: v, claim_phone: ph });
      toast('تم الإرسال — بانتظار المراجعة', 'ok');
      closeSheet();
    } catch(e) { toast(e.message, 'bad'); btn.disabled = false; btn.classList.remove('loading'); }
  };
}

window.copyText = (txt) => { if(!txt) return; navigator.clipboard.writeText(txt).then(() => toast('تم النسخ', 'ok')).catch(() => toast('تعذر النسخ', 'bad')); };

function submitNewCard() {
  const name = $('#ncName').value.trim();
  const amount = n($('#ncAmount').value);
  const kind = S.newKind;
  if(!name || name.length < 3) return toast('أدخل اسم الحامل', 'bad');
  if(amount < 10) return toast('الحد الأدنى $10', 'bad');
  if(amount > 200) return toast('الحد الأقصى $200', 'bad');

  sheet(`<div class="sheet-head"><div style="flex:1"><div class="h2">تأكيد الطلب</div></div></div>
    <div class="box" style="background:var(--s2);margin-bottom:16px">
      <div class="flex-b" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="sub">النوع</span><span>${kind === 'topup' ? 'إعادة شحن' : 'بطاقة جديدة'}</span></div>
      <div class="flex-b" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="sub">الاسم</span><span class="mono" dir="ltr">${esc(name)}</span></div>
      <div class="flex-b" style="padding:8px 0"><span class="sub">المبلغ</span><span class="num">${usd(amount)}</span></div>
    </div>
    <div class="note">سيُخصم المبلغ من محفظتك</div>
    <button class="btn wide" id="cnfGo">تأكيد</button>
    <button class="btn line wide" style="margin-top:10px" onclick="closeSheet()">إلغاء</button>`);

  $('#cnfGo').onclick = async () => {
    const btn = $('#cnfGo');
    btn.disabled = true; btn.classList.add('loading');
    try {
      await api('/api/mcard/request', { kind, name_on_card: name, amount });
      toast('تم إرسال الطلب', 'ok');
      closeSheet();
      go('cards');
    } catch(e) { toast(e.message, 'bad'); btn.disabled = false; btn.classList.remove('loading'); }
  };
}

function openVipSheet(planId) {
  const p = S.vipPlans.find(x => x.id === planId);
  if(!p) return;
  sheet(`<div class="sheet-head"><div style="flex:1"><div class="h2">${esc(p.name || '')}</div><div class="sub">${usd(p.price_usd)} / شهر</div></div></div>
    <div class="box" style="background:var(--s2);margin-bottom:16px">
      <div class="flex-b" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="sub">البطاقات</span><span class="num">${n(p.cards_count, 0)}</span></div>
      <div class="flex-b" style="padding:8px 0"><span class="sub">المدة</span><span class="num">${n(p.duration_days, 30)} يوم</span></div>
    </div>
    <div class="note ok">سيُخصم ${usd(p.price_usd)} من محفظتك</div>
    <button class="btn wide" id="vipGo">تأكيد</button>
    <button class="btn line wide" style="margin-top:10px" onclick="closeSheet()">إلغاء</button>`);
  $('#vipGo').onclick = async () => {
    const btn = $('#vipGo');
    btn.disabled = true; btn.classList.add('loading');
    try {
      await api('/api/vip/subscribe', { plan_id: planId });
      toast('تم الاشتراك', 'ok');
      closeSheet();
    } catch(e) { toast(e.message, 'bad'); btn.disabled = false; btn.classList.remove('loading'); }
  };
}

function openCardSheet(cardId) {
  const c = S.myCards.find(x => x.id === cardId);
  if(!c) return;
  const revealed = c.card_number && c.cvv;
  sheet(`<div class="sheet-head"><div style="flex:1"><div class="h2">تفاصيل البطاقة</div></div></div>
    <div style="margin-bottom:16px">${cardHTML(c)}</div>
    <div class="box" style="background:var(--s2)">
      <div class="flex-b" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="sub">الرقم</span><span class="mono" dir="ltr" style="font-size:12px">${revealed ? esc(c.card_number) : '•••• •••• •••• ' + String(c.id).slice(-4)}</span></div>
      <div class="flex-b" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="sub">الانتهاء</span><span class="mono">${esc(c.expiry || '••/••')}</span></div>
      <div class="flex-b" style="padding:8px 0"><span class="sub">CVV</span><span class="mono">${esc(c.cvv || '•••')}</span></div>
    </div>
    ${revealed ? `<button class="btn wide" style="margin-top:16px" onclick="copyText('${esc(c.card_number)}|${esc(c.expiry)}|${esc(c.cvv)}')">${svg(I.copy, 2)} نسخ البيانات</button>` : `<div class="note">لا تتوفر بيانات كاملة بعد</div>`}
    <button class="btn line wide" style="margin-top:10px" onclick="closeSheet()">إغلاق</button>`);
}

function openTicketSheet() {
  sheet(`<div class="sheet-head"><div style="flex:1"><div class="h2">تذكرة جديدة</div></div></div>
    <label class="lbl" style="display:block;font-size:12.5px;font-weight:700;color:var(--tx-2);margin-bottom:8px">الموضوع</label>
    <input class="inp" id="tkSub" placeholder="مثال: مشكلة في الإيداع" style="margin-bottom:14px">
    <label class="lbl" style="display:block;font-size:12.5px;font-weight:700;color:var(--tx-2);margin-bottom:8px">الرسالة</label>
    <textarea class="inp" id="tkMsg" rows="4" placeholder="اشرح مشكلتك" style="margin-bottom:14px"></textarea>
    <button class="btn wide" id="tkGo">إرسال</button>
    <button class="btn line wide" style="margin-top:10px" onclick="closeSheet()">إلغاء</button>`);
  $('#tkGo').onclick = async () => {
    const subj = $('#tkSub').value.trim();
    const msg = $('#tkMsg').value.trim();
    if(subj.length < 3) return toast('اكتب الموضوع', 'bad');
    if(msg.length < 10) return toast('اكتب رسالة أطول', 'bad');
    const btn = $('#tkGo');
    btn.disabled = true; btn.classList.add('loading');
    try {
      await api('/api/tickets/create', { subject: subj, message: msg });
      toast('تم إنشاء التذكرة', 'ok');
      closeSheet();
    } catch(e) { toast(e.message, 'bad'); btn.disabled = false; btn.classList.remove('loading'); }
  };
}

$('#gate').classList.add('show');
</script>
</body>
</html>
