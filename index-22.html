<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>كاردو — بطاقات أكثر .. فرص أكبر</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{
  --navy:#0F172A; --navy-2:#1B2438; --emerald:#10B981; --emerald-d:#059669;
  --bg:#F8FAFC; --card:#FFFFFF; --muted:#64748B; --border:#E2E8F0;
  --error:#EF4444; --warn:#F59E0B; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--navy); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  position:relative;
}
/* طبقة ضوء خافتة تكسر رتابة الأبيض */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(58vw 42vh at 88% -6%, rgba(16,185,129,.09), transparent 62%),
    radial-gradient(46vw 34vh at 4% 2%, rgba(15,23,42,.055), transparent 60%);
}
.shell{position:relative;z-index:1}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;width:100%}
a{color:inherit;text-decoration:none}

/* ── الأيقونات: حجم افتراضي صارم لكل SVG ──
   بدونه تتمدّد لتملأ الحاوية وتكسر التخطيط */
svg{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}
.btn svg{width:17px;height:17px}
.btn.sm svg{width:15px;height:15px}
.stat .ico svg{width:19px;height:19px}
.toast svg{width:17px;height:17px}
.empty svg{width:44px;height:44px}
.tab svg{width:21px;height:21px}
.navlink svg{width:19px;height:19px}
.iconbtn svg{width:17px;height:17px}
svg[data-lg]{width:27px;height:27px}

:focus-visible{outline:2px solid var(--emerald);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:8px}

/* ─── Layout ─────────────────────────── */
#app{display:none;min-height:100%}
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
@media(min-width:1024px){.shell{grid-template-columns:1fr 264px}}

.side{
  display:none;background:var(--navy);color:#fff;padding:22px 18px;
  position:sticky;top:0;height:100vh;flex-direction:column;grid-column:2;
}
@media(min-width:1024px){.side{display:flex}}
.side .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.side .tag{font-size:11px;color:#64748B;margin:0 0 26px 2px}
.navlink{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;
  color:#94A3B8;font-size:14px;font-weight:500;transition:.16s;margin-bottom:3px;
}
.navlink:hover{background:rgba(255,255,255,.06);color:#fff}
.navlink.on{background:var(--emerald);color:#fff}
.navlink svg{width:19px;height:19px;flex:none}
.side-foot{margin-top:auto;padding-top:18px;border-top:1px solid rgba(255,255,255,.09)}

.main{grid-column:1;min-width:0;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
@media(min-width:1024px){.main{padding-bottom:34px}}

.top{
  position:sticky;top:0;z-index:30;background:rgba(248,250,252,.88);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  padding:12px 16px;display:flex;align-items:center;gap:12px;
}
@media(min-width:1024px){.top{padding:14px 30px}}
.wrap{padding:18px 16px;max-width:1140px}
@media(min-width:1024px){.wrap{padding:26px 30px}}

.tabbar{
  position:fixed;inset:auto 0 0 0;z-index:40;background:var(--navy);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
}
@media(min-width:1024px){.tabbar{display:none}}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;
  color:#64748B;font-size:10.5px;font-weight:500;border-radius:10px}
.tab{transition:color .18s;position:relative}
.tab.on{color:var(--emerald)}
.tab.on::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:22px;height:3px;border-radius:99px;background:var(--emerald);
  animation:tabIn .28s cubic-bezier(.2,.9,.3,1)}
@keyframes tabIn{from{width:0;opacity:0}}
.tab:active{transform:scale(.93)}
.tab svg{width:21px;height:21px}

/* ─── Blocks ─────────────────────────── */
.box{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;
  box-shadow:0 1px 2px rgba(15,23,42,.04), 0 8px 22px -18px rgba(15,23,42,.28);
}
.h1{font-size:21px;font-weight:700;letter-spacing:-.02em}
.h2{font-size:16px;font-weight:600}
.sub{color:var(--muted);font-size:13.5px}
.lbl{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px;display:block}

.inp{
  border:1px solid var(--border);border-radius:11px;padding:12px 13px;
  background:#fff;font-size:15px;transition:.15s;
}
.inp{box-shadow:0 1px 2px rgba(15,23,42,.03)}
.inp:hover:not(:focus){border-color:#CBD5E1}
.inp:focus{outline:none;border-color:var(--emerald);
  box-shadow:0 0 0 3px rgba(16,185,129,.13), 0 1px 2px rgba(15,23,42,.04)}
.inp.bad{border-color:var(--error)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 20px;border-radius:11px;font-weight:600;font-size:14.5px;
  background:var(--emerald);color:#fff;transition:.16s;
}
.btn:hover:not(:disabled){background:var(--emerald-d)}
.btn:active:not(:disabled){transform:scale(.975)}
.btn{box-shadow:0 1px 2px rgba(15,23,42,.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.dark{background:var(--navy)}
.btn.dark:hover:not(:disabled){background:var(--navy-2)}
.btn.ghost{background:#fff;border:1px solid var(--border);color:var(--navy)}
.btn.ghost:hover:not(:disabled){background:var(--bg)}
.btn.danger{background:#fff;border:1px solid #FECACA;color:var(--error)}
.btn.wide{width:100%}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:9px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;
  border-radius:999px;font-size:11.5px;font-weight:600}
.pill.ok{background:#D1FAE5;color:#065F46}
.pill.wait{background:#FEF3C7;color:#92400E}
.pill.bad{background:#FEE2E2;color:#991B1B}
.pill.off{background:#E2E8F0;color:#475569}

.grid4{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:900px){.grid4{grid-template-columns:repeat(4,1fr)}}

.stat{
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:15px;
  box-shadow:0 1px 2px rgba(15,23,42,.04), 0 8px 20px -18px rgba(15,23,42,.3);
  transition:transform .2s cubic-bezier(.2,.8,.3,1), box-shadow .2s;
}
.stat:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(15,23,42,.05),0 14px 28px -18px rgba(15,23,42,.36)}
.stat .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:11px}
.stat .v{font-size:21px;font-weight:700;letter-spacing:-.03em}
.stat .k{font-size:12.5px;color:var(--muted)}

/* ─── The card (signature element) ──── */
.vcard{
  position:relative;aspect-ratio:1.586;border-radius:16px;overflow:hidden;
  background:var(--navy);color:#fff;padding:17px;display:flex;flex-direction:column;
  cursor:pointer;transition:transform .22s cubic-bezier(.2,.8,.3,1);
  box-shadow:0 10px 26px -14px rgba(15,23,42,.6);
}
.vcard:hover{transform:translateY(-5px);box-shadow:0 18px 40px -18px rgba(15,23,42,.62)}
.vcard::before{
  content:'';position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.13) 48%,transparent 58%);
  transform:translateX(-120%);transition:transform .75s cubic-bezier(.3,.7,.4,1);
}
.vcard:hover::before{transform:translateX(120%)}
.vcard::after{
  content:'';position:absolute;left:-14%;bottom:-42%;width:62%;height:118%;
  background:var(--emerald);opacity:.16;
  clip-path:polygon(0 0,100% 34%,44% 50%,100% 66%,0 100%);
}
.vcard.frozen{background:#334155}
.vcard.frozen::after{background:#94A3B8;opacity:.2}
.vcard.dead{background:#475569;opacity:.62}
.vcard .row1{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
.vcard .chip{width:31px;height:23px;border-radius:5px;background:linear-gradient(140deg,#D6E4E4,#9BB0B0);
  position:relative;z-index:2;margin:auto 0 11px}
.vcard .pan{font-size:15.5px;letter-spacing:.09em;position:relative;z-index:2}
.vcard .foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:11px;position:relative;z-index:2}
.vcard .exp{font-size:8.5px;color:#94A3B8;letter-spacing:.11em;margin-bottom:2px}
.vcard .bal{font-size:19px;font-weight:700;letter-spacing:-.02em}

/* ─── Wizard ─────────────────────────── */
.steps{display:flex;align-items:center;gap:6px;margin-bottom:22px}
.stepn{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-weight:700;background:var(--border);color:var(--muted);flex:none}
.stepn.on{background:var(--emerald);color:#fff}
.stepn.done{background:var(--navy);color:#fff}
.stepbar{height:2px;flex:1;background:var(--border);border-radius:2px}
.stepbar.on{background:var(--navy)}

.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.amt{padding:14px 6px;border:1.5px solid var(--border);border-radius:11px;background:#fff;
  font-weight:700;font-size:16px;transition:.15s;text-align:center}
.amt:hover{border-color:#CBD5E1}
.mchip{flex:1;min-width:104px;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:12px 8px;border:1.5px solid var(--border);border-radius:12px;background:#fff;
  transition:.16s;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.mchip:hover{border-color:#CBD5E1}
.mchip:active{transform:scale(.97)}
.mchip.on{border-color:var(--emerald);background:#ECFDF5;color:var(--emerald-d);
  box-shadow:0 0 0 3px rgba(16,185,129,.1)}
.amt:active{transform:scale(.96)}
.amt.on{border-color:var(--emerald);background:#ECFDF5;color:var(--emerald-d);
  animation:pick .3s cubic-bezier(.2,.9,.3,1)}
@keyframes pick{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}

.quote{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:15px;margin-top:16px}
.qrow{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.qrow.tot{border-top:1px dashed #CBD5E1;margin-top:7px;padding-top:11px;font-weight:700;font-size:16px}
.qrow .k{color:var(--muted)}

/* ─── Table ──────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:right;padding:10px 12px;color:var(--muted);font-size:12px;
  font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid #F1F5F9;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:#F8FAFC}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}

.rowcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:13px;
  margin-bottom:9px;box-shadow:0 1px 2px rgba(15,23,42,.03);transition:.18s}
.rowcard:hover{border-color:#CBD5E1;transform:translateX(-2px)}

/* ─── Feedback ───────────────────────── */
.sk{background:linear-gradient(90deg,#EEF2F7 25%,#E2E8F0 37%,#EEF2F7 63%);
  background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:8px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}

.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty svg{width:44px;height:44px;margin:0 auto 13px;opacity:.32;display:block}

#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;gap:8px;width:min(92vw,400px)}
.toast{background:var(--navy);color:#fff;padding:13px 15px;border-radius:12px;
  font-size:14px;display:flex;gap:9px;align-items:flex-start;
  box-shadow:0 12px 30px -10px rgba(15,23,42,.5);animation:tin .26s cubic-bezier(.2,.9,.3,1)}
.toast.ok{background:var(--emerald-d)}
.toast.bad{background:var(--error)}
@keyframes tin{from{opacity:0;transform:translateY(-14px)}}

.ov{position:fixed;inset:0;z-index:120;background:rgba(15,23,42,.55);
  display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.ov.show{display:flex}
@media(min-width:640px){.ov{align-items:center}}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;
  padding:22px;max-height:92vh;overflow-y:auto;
  animation:up .38s cubic-bezier(.22,1,.32,1);
  box-shadow:0 -8px 40px -12px rgba(15,23,42,.4)}
.sheet::before{content:'';display:block;width:38px;height:4px;border-radius:99px;
  background:#E2E8F0;margin:-8px auto 16px}
@media(min-width:640px){.sheet::before{display:none}}
@media(min-width:640px){.sheet{border-radius:18px;animation:pop .22s ease}}
@keyframes up{from{transform:translateY(100%);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}}

.secret{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 0;border-bottom:1px solid #F1F5F9}
.secret .val{font-size:15px;letter-spacing:.05em}
.secret .val.hid{letter-spacing:.16em;color:var(--muted)}
.iconbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  color:var(--muted);transition:.14s;flex:none}
.iconbtn:hover{background:var(--bg);color:var(--navy)}
.iconbtn svg{width:17px;height:17px}

.banner{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;
  padding:11px 14px;border-radius:11px;font-size:13px;margin-bottom:16px}


/* ── ظهور متدرّج: كل عنصر يدخل بعد الذي قبله ── */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.wrap > *{animation:rise .42s cubic-bezier(.2,.8,.3,1) backwards}
.wrap > *:nth-child(1){animation-delay:.02s}
.wrap > *:nth-child(2){animation-delay:.07s}
.wrap > *:nth-child(3){animation-delay:.12s}
.wrap > *:nth-child(4){animation-delay:.17s}
.wrap > *:nth-child(5){animation-delay:.22s}
.wrap > *:nth-child(n+6){animation-delay:.26s}

.grid4 > *{animation:rise .44s cubic-bezier(.2,.8,.3,1) backwards}
.grid4 > *:nth-child(1){animation-delay:.06s}
.grid4 > *:nth-child(2){animation-delay:.11s}
.grid4 > *:nth-child(3){animation-delay:.16s}
.grid4 > *:nth-child(4){animation-delay:.21s}

/* البطاقة تدخل بميلان خفيف */
@keyframes cardIn{from{opacity:0;transform:translateY(16px) rotateX(6deg)}to{opacity:1;transform:none}}
.vcard{animation:cardIn .5s cubic-bezier(.2,.8,.3,1) backwards}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hide{display:none!important}
</style>
</head>

<!-- ══ App ══ -->
<div id="app">
<div class="shell">

  <!-- Sidebar -->
  <aside class="side">
    <div class="brand">
      <span id="sideMark"></span>
      <div>
        <div style="font-size:19px;font-weight:700;letter-spacing:-.02em">Kardo</div>
        <div style="font-size:11px;color:#64748B">كاردو</div>

             display:grid;place-items:center;font-weight:700;font-size:13px;flex:none"></div>

          <div id="sideName" style="font-size:13px;font-weight:600;overflow:hidden;

  <!-- Main -->
  <div class="main">

      <div style="display:flex;align-items:center;gap:9px" class="lg-hide">

        <span style="font-size:17px;font-weight:700;letter-spacing:-.02em">Kardo</span>

          <span id="topBal">—</span>
        </div>
        <button class="iconbtn" onclick="go('wallet')" title="المحفظة" style="background:#fff;border:1px solid var(--border)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>
    <main class="wrap" id="view"></main>
  </div>
</div>

<!-- Bottom nav -->
<nav class="tabbar" id="navMob"></nav>
</div>

<div id="toasts"></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

/* الأرقام المالية تتصاعد بدل أن تظهر فجأة */
function countTo(el, target, fmt = usd, ms = 720){
  if(!el) return;
  const from = parseFloat(el.dataset.v || 0);
  if(Math.abs(target - from) < 0.005){ el.textContent = fmt(target); return; }
  el.dataset.v = target;
  const t0 = performance.now();
  const step = now =>{
    const p = Math.min(1, (now - t0) / ms);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(from + (target - from) * e);
    if(p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

  $('#toasts').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(-10px)';
    el.style.transition='.25s';setTimeout(()=>el.remove(),260)},3600);
}

async function api(path, body){
  if(DEMO) return demoApi(path, body);
  const token = await auth.currentUser.getIdToken();
  const res = await fetch(API_BASE + path, {
    method: body ? 'POST' : 'GET',
    headers: { 'content-type':'application/json', authorization:'Bearer '+token },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(()=>({success:false,error:'رد غير مفهوم'}));
  if(!data.success) throw new Error(data.error || 'فشلت العملية');
  return data;
}
async function apiGet(path){
  if(DEMO) return demoApi(path);
  const res = await fetch(API_BASE + path);
  const d = await res.json();
  if(!d.success) throw new Error(d.error||'خطأ');
  return d;
}

/* يطبّق الألوان والزوايا القادمة من لوحة الإدارة */
function applyTheme(){
  const t = S.config.theme;
  if(!t) return;
  const r = document.documentElement.style;
  const dark = c => { // اشتقاق درجة أغمق للتحويم
    const m = /^#([\da-f]{6})$/i.exec(c||''); if(!m) return null;
    const n = parseInt(m[1],16);
    const d = v => Math.max(0, Math.round(v*0.84));
    return '#'+[d(n>>16&255),d(n>>8&255),d(n&255)]
      .map(v=>v.toString(16).padStart(2,'0')).join('');
  };
  if(t.navy){ r.setProperty('--navy', t.navy); }
  if(t.emerald){
    r.setProperty('--emerald', t.emerald);
    const d = dark(t.emerald); if(d) r.setProperty('--emerald-d', d);
  }
  if(t.bg) r.setProperty('--bg', t.bg);
  if(t.radius) r.setProperty('--radius', t.radius + 'px');
}

  $('#app').style.display='block';

      <div class="qrow tot"><span>الإجمالي</span>

let quoteTimer = null;
async function fetchQuote(amount){
  const box = $('#qbox'), btn = $('#wNext2');
  if(!box) return;
  const min = S.config.min_amount||10, max = S.config.max_amount||200;
  if(!(amount>=min && amount<=max)){
    S.wiz.quote = null;
    box.innerHTML = amount ? `<div class="banner" style="margin-top:13px">المبلغ يجب أن يكون بين $${min} و $${max}.</div>` : '';
    if(btn) btn.disabled = true;
    return;
  }
  box.innerHTML = `<div class="quote"><div class="sk" style="height:16px;margin-bottom:9px"></div>
    <div class="sk" style="height:16px;width:70%;margin-bottom:9px"></div>
    <div class="sk" style="height:20px;width:50%"></div></div>`;
  try{
    const d = await apiGet(`/api/quote?amount=${amount}&kind=create`);
    S.wiz.quote = d.quote; S.wiz.amount = amount;
    box.innerHTML = quoteHtml(d.quote);
    if(btn) btn.disabled = false;
  }catch(e){
    S.wiz.quote = null;
    box.innerHTML = `<div class="banner" style="margin-top:13px">${esc(e.message)}</div>`;
    if(btn) btn.disabled = true;
  }
}

  sheet(`

            <div style="display:flex"><button class="iconbtn" data-cp="${esc(d.card_number)}" data-lb="رقم البطاقة">${svg(I.copy)}</button></div></div>
          <div class="secret"><div><div class="lbl" style="margin:0">تاريخ الانتهاء</div>
            <div class="val mono" dir="ltr">${esc(d.expiry)}</div></div>
            <button class="iconbtn" data-cp="${esc(d.expiry)}" data-lb="تاريخ الانتهاء">${svg(I.copy)}</button></div>
          <div class="secret" style="border:none"><div><div class="lbl" style="margin:0">CVV</div>
            <div class="val mono ${shown?'':'hid'}" dir="ltr">${mask(d.cvv)}</div></div>
            <button class="iconbtn" data-cp="${esc(d.cvv)}" data-lb="CVV">${svg(I.copy)}</button></div>
        </div>
        <button class="btn ghost wide sm" id="tog" style="margin-top:9px">
          ${svg(shown?I.eyeoff:I.eye)} ${shown?'إخفاء':'إظهار'} البيانات</button>
        <p class="sub" style="font-size:12px;margin-top:10px;text-align:center">
          لا تشارك هذه البيانات مع أي شخص — من يحصل عليها يستطيع الصرف من بطاقتك.</p>`;
        $('#tog').onclick = ()=>{ shown = !shown; paint(); };

          b.onclick = ()=> copy(b.dataset.cp, b.dataset.lb));

          <div style="display:flex;justify-content:space-between;gap:10px;padding:9px 0;

  };

  const fb = $('#freezeBtn');
  if(fb) fb.onclick = async ()=>{
    fb.disabled = true;

      await api('/api/cards/freeze',{card_id:id, action: isActive?'freeze':'unfreeze'});

      toast(isActive?'تم تجميد البطاقة':'تم إلغاء التجميد','ok');
      closeSheet(); render();
    }catch(e){ toast(e.message,'bad'); fb.disabled = false; }
  };

  const fnd = $('#fundBtn');
  if(fnd) fnd.onclick = ()=> fundSheet(c);

  const del = $('#delBtn');
  if(del) del.onclick = ()=>{
    sheet(`
      <div class="h2" style="margin-bottom:8px">إغلاق البطاقة نهائيًا</div>
      <p class="sub" style="margin-bottom:8px">
        سيُغلق ${esc(c.card_name||'البطاقة')} ولا يمكن استخدامها بعد ذلك.</p>
      <div class="banner">الرصيد المتبقي ${usd(bal)} يُعاد إلى محفظتك بعد خصم رسوم الإغلاق.
        العملية غير قابلة للتراجع.</div>
      <button class="btn wide" style="background:var(--error)" id="delGo">تأكيد الإغلاق</button>
      <button class="btn ghost wide" style="margin-top:9px" onclick="openCard('${esc(id)}')">رجوع</button>`);

    $('#delGo').onclick = async ()=>{
      $('#delGo').disabled = true;
      try{
        const r = await api('/api/cards/delete',{card_id:id});
        if(DEMO){ c.status='deleted'; S.profile.wallet_balance += bal; }
        toast('أُغلقت البطاقة · أُعيد '+usd(r.refunded_to_wallet ?? bal)+' إلى محفظتك','ok');
        closeSheet(); render();
      }catch(e){ toast(e.message,'bad'); $('#delGo').disabled = false; }
    };
  };
}

function fundSheet(c){
  sheet(`
    <div class="h2" style="margin-bottom:4px">شحن البطاقة</div>
    <p class="sub" style="margin-bottom:16px">${esc(c.card_name||'بطاقة')} · ${esc(c.last4)}</p>
    <label class="lbl">المبلغ (الحد الأدنى $${S.config.min_amount||10})</label>
    <input class="inp num" id="fAmt" type="number" inputmode="decimal"
           min="${S.config.min_amount||10}" placeholder="${S.config.min_amount||10}">
    <div id="fQuote"></div>
    <button class="btn wide" id="fGo" style="margin-top:16px" disabled>شحن البطاقة</button>
    <button class="btn ghost wide" style="margin-top:9px" onclick="openCard('${esc(c.id)}')">رجوع</button>`);

  let q = null, t = null;
  $('#fAmt').oninput = e=>{
    clearTimeout(t);
    const a = parseFloat(e.target.value);
    t = setTimeout(async ()=>{
      const box = $('#fQuote'), btn = $('#fGo');
      if(!(a >= (S.config.min_amount||10))){ q=null; box.innerHTML=''; btn.disabled=true; return; }
      box.innerHTML = `<div class="quote"><div class="sk" style="height:44px"></div></div>`;
      try{
        const d = await apiGet(`/api/quote?amount=${a}&kind=fund`);
        q = d.quote; box.innerHTML = quoteHtml(q);
        btn.disabled = (S.profile.wallet_balance||0) < q.total;
        if(btn.disabled) box.innerHTML += `<div class="banner" style="margin-top:11px">
          رصيدك غير كافٍ — المتاح ${usd(S.profile.wallet_balance)}.</div>`;
      }catch(err){ q=null; box.innerHTML = `<div class="banner">${esc(err.message)}</div>`; btn.disabled=true; }
    }, 420);
  };

  $('#fGo').onclick = async ()=>{
    if(!q) return;
    $('#fGo').disabled = true;
    try{
      await api('/api/cards/fund',{card_id:c.id, amount:q.amount,
        idempotency_key: (crypto.randomUUID?crypto.randomUUID():'k'+Date.now()+Math.random())});
      if(DEMO){ c.live_balance = (c.live_balance||0)+q.amount; S.profile.wallet_balance -= q.total; }
      toast('تم شحن البطاقة بمبلغ '+usd(q.amount),'ok');
      closeSheet(); render();
    }catch(e){ toast(e.message,'bad'); $('#fGo').disabled = false; }
  };
}

    <div id="autoFields">
    <label class="lbl">رقمك الذي حوّلت منه</label>
    <input class="inp num" id="cPhone" type="tel" inputmode="numeric"
           placeholder="912345678" dir="ltr" maxlength="13"
           value="${esc(S.profile.phone||'')}">
    <p class="sub" style="font-size:12px;margin-top:6px">اكتب رقمك بدون الصفر</p>

    </div>
    <label class="lbl" style="margin-top:14px">المبلغ الذي أرسلته (بالدينار)</label>
    <input class="inp num" id="cAmt" type="number" inputmode="decimal"
           step="0.001" min="1" placeholder="118">

    <div id="cQuote"></div>

    <button class="btn wide" id="cGo" style="margin-top:16px">تأكيد التحويل</button>
    <p class="sub" style="font-size:11.5px;text-align:center;margin-top:11px">
      إن لم تصل رسالة التحويل بعد، يبقى طلبك معلّقًا ويُضاف الرصيد فور وصولها.</p>
    <button class="btn ghost wide" style="margin-top:9px" onclick="closeSheet()">إلغاء</button>`);

  const cp = $('#cpPhone');
  if(cp) cp.onclick = ()=> copy(dp, 'رقم التحويل');

  const note = S.config.deposit_note || '';
  const paintMethod = ()=>{
    const m = M[sel] || {};
    const auto = isAuto(sel);
    const pb = $('#phoneBox'), af = $('#autoFields');
    if(pb) pb.style.display = auto ? 'block' : 'none';
    if(af) af.style.display = auto ? 'block' : 'none';
    $('#mBox').innerHTML = !auto && m.details
      ? `<div class="quote" style="margin-bottom:14px">
           <div class="lbl" style="margin-bottom:6px">تفاصيل ${esc(m.label||'')}</div>
           <div class="mono" style="font-size:12.5px;word-break:break-all"
                dir="ltr">${esc(m.details)}</div>
           <button class="btn ghost sm wide" style="margin-top:10px"
                   id="cpDet">نسخ</button>
         </div>`
      : (note ? `<div class="banner" style="margin-bottom:14px">${esc(note)}</div>` : '');
    const cd = $('#cpDet');
    if(cd) cd.onclick = ()=> copy(m.details, 'التفاصيل');
    calc();
  };

  document.querySelectorAll('[data-m]').forEach(b=>{
    b.onclick = ()=>{
      sel = b.dataset.m;
      document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on', x===b));
      paintMethod();
    };
  });

  function calc(){
    const a = parseFloat($('#cAmt').value);
    const box = $('#cQuote');
    if(!box) return;
    if(!(a>0)){ box.innerHTML=''; return; }
    const r = rateOf(sel);
    const unit = sel==='usdt' ? 'USDT' : 'د.ل';
    box.innerHTML = `<div class="quote">
      <div class="qrow"><span class="k">المبلغ المحوّل</span>
        <span class="num">${a.toLocaleString('en-US')} ${unit}</span></div>
      ${sel==='usdt' ? '' :
        `<div class="qrow"><span class="k">سعر الصرف</span><span class="num">${r} د.ل</span></div>`}
      <div class="qrow tot"><span>سيُضاف لمحفظتك</span><span class="num">${usd(a/r)}</span></div>
    </div>`;
  }
  $('#cAmt').oninput = calc;
  paintMethod();

  $('#cGo').onclick = async ()=>{
    const amt = parseFloat($('#cAmt').value);
    if(!(amt>0)) return toast('اكتب المبلغ الذي حوّلته','bad');

    const auto = isAuto(sel);
    const phone = auto ? $('#cPhone').value.trim() : '';
    if(auto && phone.replace(/\D/g,'').length < 9)
      return toast('اكتب رقمك كاملاً','bad');

    $('#cGo').disabled = true;
    $('#cGo').innerHTML = '<span class="sk" style="width:70px;height:14px;display:inline-block"></span>';
    try{
      const r = auto
        ? await api('/api/wallet/claim',{ phone, amount_lyd: amt, method: sel })
        : await manualDeposit(sel, amt);
      if(DEMO){
        S.deposits.unshift({id:'d'+Date.now(),amount_usd:amt/rateOf(sel),amount_lyd:amt,
          method:(M[sel]&&M[sel].label)||sel,
          status: auto?'approved':'pending',created_at:new Date()});
        if(auto) S.profile.wallet_balance += amt/rateOf(sel);
      }
      closeSheet();
      claimResultSheet(auto && !!r.matched, amt/rateOf(sel));
      render();
    }catch(e){
      toast(e.message,'bad');
      $('#cGo').disabled = false; $('#cGo').textContent = 'تأكيد التحويل';
    }
  };
}

async function manualDeposit(method, amountLyd){
  const M = S.config.methods || {};
  const r = (M[method] && M[method].rate) || 1;
  if(!DEMO){
    await addDoc(collection(db,'wallet_deposits'),{
      uid: S.user.uid,
      amount_usd: Math.round((amountLyd/r)*100)/100,
      amount_lyd: amountLyd,
      method: (M[method] && M[method].label) || method,
      proof_url: '', note: '',
      status: 'pending',
      created_at: new Date().toISOString()
    });
  }
  return { matched:false };
}

function claimResultSheet(matched, amount){
  sheet(`
    <div style="text-align:center;margin-bottom:20px">
      <div style="width:60px;height:60px;border-radius:50%;margin:0 auto 14px;
           display:grid;place-items:center;
           background:${matched?'#D1FAE5':'#FEF3C7'};color:${matched?'var(--emerald-d)':'#B45309'}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
             stroke-linecap="round" stroke-linejoin="round" data-lg>
          ${matched ? '<path d="M20 6 9 17l-5-5"/>'
                    : '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'}
        </svg></div>
      <div class="h2">${matched ? 'تمت إضافة الرصيد' : 'طلبك قيد الانتظار'}</div>
      <p class="sub" style="margin-top:4px">
        ${matched ? 'أُضيف '+usd(amount)+' إلى محفظتك.'
                  : 'لم تصل رسالة التحويل بعد. سيُضاف '+usd(amount)+' تلقائيًا فور وصولها.'}</p>
    </div>
    ${matched ? `<button class="btn wide" onclick="closeSheet();go('issue')">إصدار بطاقة الآن</button>`:''}
    <button class="btn ghost wide" style="margin-top:9px" onclick="closeSheet()">حسنًا</button>`);
}

/* ─── Transactions ──────────────────── */
function vTx(){
  const F = [['all','الكل'],['create','إصدار'],['fund','شحن'],['deposit','إيداع']];
  let rows = [
    ...S.orders.map(o=>({...o, kind:o.type})),
    ...S.deposits.map(d=>({id:d.id, kind:'deposit', status:d.status,
      amount:d.amount_usd, customer_price:d.amount_usd, created_at:d.created_at}))
  ].sort((a,b)=>{
    const av = a.created_at?.toDate?.() || new Date(a.created_at||0);
    const bv = b.created_at?.toDate?.() || new Date(b.created_at||0);
    return bv - av;
  });
  if(S.txFilter!=='all') rows = rows.filter(r=>r.kind===S.txFilter);

  return demoBanner + `
  <div class="h1" style="margin-bottom:4px">المعاملات</div>
  <p class="sub" style="margin-bottom:16px">كل عملياتك في مكان واحد.</p>

  <div style="display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px">
    ${F.map(([k,t])=>`<button class="btn ${S.txFilter===k?'dark':'ghost'} sm"
      data-filter="${k}" style="flex:none">${t}</button>`).join('')}
  </div>

  ${rows.length ? `<div class="box" style="padding:0"><div class="scrollx">${txTable(rows)}</div></div>`
   : emptyBox(I.list,'لا توجد معاملات','ستظهر عملياتك هنا.')}`;
}

function txTable(rows){
  const T = {create:'إصدار بطاقة', fund:'شحن بطاقة', deposit:'إيداع رصيد'};
  const ST = {completed:['ok','مكتملة'], processing:['wait','قيد المعالجة'],
    refunded:['bad','مستردة'], failed:['bad','فاشلة'],
    pending:['wait','قيد المراجعة'], approved:['ok','مقبول'], rejected:['bad','مرفوض']};
  return `<table class="tbl">
    <thead><tr><th>رقم العملية</th><th>النوع</th><th>المبلغ</th><th>التاريخ</th><th>الحالة</th></tr></thead>
    <tbody>${rows.map(r=>{
      const kind = r.kind || r.type;
      const st = ST[r.status] || ['off','—'];
      const isIn = kind==='deposit' && r.status==='approved';
      const val = r.customer_price ?? r.amount ?? 0;
      return `<tr>
        <td class="mono" style="font-size:12px;color:var(--muted)">${esc(r.id)}</td>
        <td>${T[kind]||'—'}</td>
        <td class="num" style="font-weight:600;color:${isIn?'var(--emerald-d)':'inherit'}">
          ${isIn?'+':kind==='deposit'?'':'−'}${usd(val)}</td>
        <td class="sub" style="font-size:12.5px">${dt(r.created_at)}</td>
        <td><span class="pill ${st[0]}">${st[1]}</span></td>
      </tr>`}).join('')}</tbody></table>`;
}

/* ─── Settings ──────────────────────── */
function vSettings(){
  return demoBanner + `
  <div class="h1" style="margin-bottom:20px">الإعدادات</div>
  <div class="box" style="max-width:520px;margin-bottom:16px">
    <div class="h2" style="margin-bottom:16px">الحساب</div>
    <div style="margin-bottom:13px"><label class="lbl">الاسم</label>
      <input class="inp" id="pName" value="${esc(S.profile.name||'')}"></div>
    <div style="margin-bottom:13px"><label class="lbl">البريد الإلكتروني</label>
      <input class="inp" value="${esc(S.profile.email||S.user?.email||'')}" disabled
             style="background:var(--bg);color:var(--muted)" dir="ltr"></div>
    <div style="margin-bottom:18px"><label class="lbl">رقم الهاتف</label>
      <input class="inp" id="pPhone" value="${esc(S.profile.phone||'')}"
             placeholder="091xxxxxxx" dir="ltr" inputmode="tel">
      <p class="sub" style="font-size:12px;margin-top:6px">
        سجّل رقم ليبيانا الذي تحوّل منه — عند التحويل يُضاف الرصيد إلى محفظتك تلقائيًا.</p></div>
    <button class="btn" id="pSave">حفظ التغييرات</button>
  </div>

  <div class="box" style="max-width:520px">
    <div class="h2" style="margin-bottom:6px">كلمة المرور</div>
    <p class="sub" style="margin-bottom:14px">سنرسل رابط تغيير كلمة المرور إلى بريدك.</p>
    <button class="btn ghost" id="pReset">إرسال رابط التغيير</button>
  </div>`;
}

/* ─── Bind ──────────────────────────── */
function bindView(){
  document.querySelectorAll('[data-act]').forEach(b=>{
    b.onclick = ()=> b.dataset.act==='deposit' ? depositSheet() : go(b.dataset.act);
  });
  document.querySelectorAll('[data-card]').forEach(el=>
    el.onclick = ()=> openCard(el.dataset.card));
  document.querySelectorAll('[data-filter]').forEach(b=>
    b.onclick = ()=>{ S.txFilter = b.dataset.filter; render(); });
  document.querySelectorAll('[data-step]').forEach(b=>
    b.onclick = ()=>{ S.wiz.step = +b.dataset.step; render(); });

  const dep = $('#depBtn'); if(dep) dep.onclick = depositSheet;

  // wizard step 1
  const n1 = $('#wNext1');
  if(n1) n1.onclick = ()=>{
    const label = $('#wLabel').value.trim();
    const name = $('#wName').value.trim().toUpperCase();
    if(!/^[A-Z][A-Z .'-]{1,23}$/.test(name)){
      $('#wName').classList.add('bad');
      return toast('اكتب الاسم بحروف لاتينية (حرفان على الأقل)','bad');
    }
    S.wiz.label = label || 'بطاقتي';
    S.wiz.name = name;
    S.wiz.step = 2;
    render();
  };

  // wizard step 2
  document.querySelectorAll('[data-amt]').forEach(b=>
    b.onclick = ()=>{
      const a = +b.dataset.amt;
      document.querySelectorAll('[data-amt]').forEach(x=>x.classList.toggle('on', x===b));
      const cu = $('#wCustom'); if(cu) cu.value = '';
      fetchQuote(a);
    });
  const cu = $('#wCustom');
  if(cu) cu.oninput = e=>{
    document.querySelectorAll('[data-amt]').forEach(x=>x.classList.remove('on'));
    clearTimeout(quoteTimer);
    quoteTimer = setTimeout(()=> fetchQuote(parseFloat(e.target.value)), 420);
  };
  const n2 = $('#wNext2');
  if(n2) n2.onclick = ()=>{
    if(!S.wiz.quote) return;
    S.wiz.idem = crypto.randomUUID ? crypto.randomUUID() : 'k'+Date.now()+Math.random();
    S.wiz.step = 3;
    render();
  };

  // wizard step 3
  const sub = $('#wSubmit');
  if(sub) sub.onclick = async ()=>{
    if(!$('#wAgree').checked) return toast('يجب الموافقة على الشروط','bad');
    sub.disabled = true;
    sub.innerHTML = `<span class="sk" style="width:80px;height:14px;display:inline-block"></span>`;
    try{
      const r = await api('/api/cards/create',{
        amount: S.wiz.quote.amount,
        name_on_card: S.wiz.name,
        card_name: S.wiz.label,
        idempotency_key: S.wiz.idem
      });
      successSheet(r.card);
      S.wiz = {step:1,amount:null,name:S.wiz.name,label:'',idem:null,quote:null};
      S.page = 'cards';
      render();
    }catch(e){
      toast(e.message,'bad');
      sub.disabled = false; sub.textContent = 'إصدار البطاقة';
    }
  };

  // settings
  const ps = $('#pSave');
  if(ps) ps.onclick = async ()=>{
    const name = $('#pName').value.trim(), phone = $('#pPhone').value.trim();
    if(name.length < 2) return toast('الاسم قصير جدًا','bad');
    ps.disabled = true;
    try{
      if(DEMO){ S.profile.name = name; S.profile.phone = phone; }
      else await setDoc(doc(db,'users',S.user.uid),{name,phone,phone_key:phoneKey(phone)},{merge:true});
      toast('حُفظت التغييرات','ok'); render();
    }catch(e){ toast('تعذّر الحفظ — الكتابة محمية، اطلب من الإدارة','bad'); ps.disabled = false; }
  };
  const pr = $('#pReset');
  if(pr) pr.onclick = async ()=>{
    const em = S.profile.email || S.user?.email;
    if(!em) return toast('لا يوجد بريد مسجّل','bad');
    if(DEMO) return toast('غير متاح في وضع المعاينة','bad');
    pr.disabled = true;
    try{ await sendPasswordResetEmail(auth, em);
      toast('أُرسل رابط التغيير إلى '+em,'ok'); }
    catch(e){ toast('تعذّر الإرسال','bad'); pr.disabled = false; }
  };
}

function successSheet(card){
  sheet(`
    <div style="text-align:center;margin-bottom:20px">
      <div style="width:60px;height:60px;border-radius:50%;background:#D1FAE5;color:var(--emerald-d);
           display:grid;place-items:center;margin:0 auto 14px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
             stroke-linecap="round" stroke-linejoin="round"
             style="width:27px;height:27px"><path d="M20 6 9 17l-5-5"/></svg></div>
      <div class="h2">تم إصدار البطاقة</div>
      <p class="sub">بطاقة تنتهي بـ ${esc(card.last4)} جاهزة للاستخدام.</p>
    </div>
    <button class="btn wide" onclick="closeSheet();openCard('${esc(card.card_id)}')">
      عرض بيانات البطاقة</button>
    <button class="btn ghost wide" style="margin-top:9px" onclick="closeSheet()">لاحقًا</button>`);
}
</script>
</body>
</html>
