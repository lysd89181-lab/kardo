<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E17">
<meta name="description" content="كاردو — متجر الخدمات الرقمية في ليبيا. اشحن رصيدك واشترِ اشتراكاتك واستلمها فورًا.">
<title>كاردو — متجر خدمات رقمية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* ═══════════════════════════════════════════════════
   KARDO — Design System
   Dark fintech marketplace · Arabic RTL
   ═══════════════════════════════════════════════════ */
:root{
  /* Surfaces — five steps from canvas to raised */
  --bg:#0A0E17;
  --s1:#111725;
  --s2:#161D2E;
  --s3:#1C2436;
  --line:#212B3D;
  --line-2:#2B3648;

  /* Text */
  --tx:#EEF2F8;
  --tx-2:#97A5BD;
  --tx-3:#65748F;

  /* Brand */
  --g:#10B981;
  --g-d:#0E9E70;
  --g-l:#34D399;
  --g-soft:rgba(16,185,129,.13);
  --g-line:rgba(16,185,129,.28);

  --warn:#E0A030;
  --warn-soft:rgba(224,160,48,.13);
  --bad:#EF5F5F;
  --bad-soft:rgba(239,95,95,.13);

  --r-s:10px;
  --r:14px;
  --r-l:18px;

  --spring:cubic-bezier(.34,1.35,.44,1);
  --ease:cubic-bezier(.22,1,.36,1);
  --swift:cubic-bezier(.4,0,.2,1);

  --bar-h:64px;
  --dock-h:66px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-feature-settings:'lnum' 1,'tnum' 1;
  background:var(--bg);color:var(--tx);
  font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(56vw 40vh at 90% -8%, rgba(16,185,129,.09), transparent 58%),
    radial-gradient(44vw 34vh at -6% 4%, rgba(60,110,200,.055), transparent 56%);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;width:100%}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--g);outline-offset:3px;border-radius:8px}
::selection{background:var(--g);color:#04121B}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}

svg{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}
svg[data-lg]{width:26px;height:26px}

.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-feature-settings:'lnum' 1}
.num{font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.015em;font-weight:700}

/* ─── Layout ─────────────────────────────── */
#app{display:none;position:relative;z-index:1}
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
@media(min-width:1024px){.shell{grid-template-columns:1fr 258px}}

.rail{display:none;grid-column:2;position:sticky;top:0;height:100vh;
  flex-direction:column;padding:22px 14px;border-inline-start:1px solid var(--line)}
@media(min-width:1024px){.rail{display:flex}}

.main{grid-column:1;min-width:0;
  padding-bottom:calc(var(--dock-h) + env(safe-area-inset-bottom) + 12px)}
@media(min-width:1024px){.main{padding-bottom:32px}}

.wrap{padding:16px;max-width:1080px;margin:0 auto}
@media(min-width:640px){.wrap{padding:22px}}

/* ─── Header ─────────────────────────────── */
.bar{
  position:sticky;top:0;z-index:40;height:var(--bar-h);
  display:flex;align-items:center;gap:12px;padding:0 16px;
  background:rgba(10,14,23,.82);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border-bottom:1px solid var(--line);
}
.bar-logo{display:flex;align-items:center;gap:9px;margin-inline:auto}
.bar-logo .txt{font-size:17px;font-weight:800;letter-spacing:-.02em}
.iconbtn{width:40px;height:40px;border-radius:12px;flex:none;
  display:grid;place-items:center;color:var(--tx-2);
  border:1px solid transparent;transition:.16s}
.iconbtn:hover{background:var(--s2);color:var(--tx)}
.iconbtn:active{transform:scale(.92)}
.iconbtn.on{border-color:var(--line-2);background:var(--s1)}
.dotmark{position:absolute;top:8px;inset-inline-end:8px;width:7px;height:7px;
  border-radius:50%;background:var(--g);box-shadow:0 0 0 2px var(--bg)}
.rel{position:relative}
.cbadge{position:absolute;top:-3px;inset-inline-end:-3px;min-width:18px;height:18px;
  padding:0 5px;border-radius:99px;background:var(--g);color:#04121B;
  font-size:10.5px;font-weight:800;display:grid;place-items:center;
  animation:pop .3s var(--spring)}

/* ─── Bottom dock ────────────────────────── */
.dock{
  position:fixed;inset:auto 0 0 0;z-index:50;display:grid;height:var(--dock-h);
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(10,14,23,.94);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border-top:1px solid var(--line);
}
@media(min-width:1024px){.dock{display:none}}
.dk{position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;font-size:10.5px;font-weight:600;
  color:var(--tx-3);transition:color .18s}
.dk .dkico{transition:transform .28s var(--spring)}
.dk::before{content:'';position:absolute;top:0;left:50%;width:26px;height:2.5px;
  border-radius:0 0 4px 4px;background:var(--g);
  transform:translateX(-50%) scaleX(0);transition:transform .3s var(--spring)}
.dk.on{color:var(--g)}
.dk.on::before{transform:translateX(-50%) scaleX(1)}
.dk.on .dkico{transform:translateY(-3px)}
.dk:active{transform:scale(.94)}

/* ─── Sidebar nav ────────────────────────── */
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;margin-bottom:22px}
.brand .en{font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.brand .ar{font-size:11px;color:var(--tx-3)}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;
  border-radius:var(--r-s);color:var(--tx-2);font-size:14px;font-weight:600;
  position:relative;margin-bottom:2px;transition:.16s}
.nav:hover{background:var(--s1);color:var(--tx)}
.nav.on{background:var(--s2);color:var(--tx)}
.nav.on::before{content:'';position:absolute;inset-inline-start:0;top:24%;bottom:24%;
  width:3px;border-radius:99px;background:var(--g)}
.nav.on svg{color:var(--g)}
.nav .cnt{margin-inline-start:auto;min-width:20px;height:20px;padding:0 6px;
  border-radius:99px;background:var(--g);color:#04121B;
  font-size:11px;font-weight:800;display:grid;place-items:center}
.rail-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}

/* ─── Type ───────────────────────────────── */
.h1{font-size:24px;font-weight:800;letter-spacing:-.032em;line-height:1.24}
.h2{font-size:17px;font-weight:800;letter-spacing:-.02em}
.h3{font-size:14.5px;font-weight:700}
.sub{color:var(--tx-2);font-size:13.5px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;
  color:var(--tx-3);text-transform:uppercase}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--tx-2);margin-bottom:8px}

.sec-head{display:flex;justify-content:space-between;align-items:baseline;
  margin:24px 0 13px}
.sec-head:first-child{margin-top:0}
.more-link{color:var(--g);font-weight:700;font-size:13px}

/* ─── Surfaces ───────────────────────────── */
.card{background:var(--s1);border:1px solid var(--line);
  border-radius:var(--r);padding:16px}
.card-q{background:var(--s1);border:1px solid var(--line);
  border-radius:var(--r);padding:14px}

/* ─── Banner ─────────────────────────────── */
.bnr{position:relative;border-radius:var(--r-l);overflow:hidden;margin-bottom:16px}
.bnr-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.bnr-track::-webkit-scrollbar{display:none}
.bnr-slide{position:relative;flex:0 0 100%;scroll-snap-align:center;
  aspect-ratio:2.4;background:var(--s2)}
.bnr-slide img{width:100%;height:100%;object-fit:cover}
.bnr-body{position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:center;gap:6px;padding:20px;
  background:linear-gradient(275deg,transparent 8%,rgba(10,14,23,.86) 62%)}
.bnr-t{font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.25}
.bnr-s{font-size:12.5px;color:var(--tx-2)}
.bnr-cta{align-self:flex-start;margin-top:6px;padding:8px 16px;border-radius:99px;
  background:var(--g);color:#04121B;font-size:12.5px;font-weight:800}
.bnr-dots{position:absolute;bottom:10px;inset-inline-start:0;inset-inline-end:0;
  display:flex;justify-content:center;gap:5px}
.bnr-dots span{width:5px;height:5px;border-radius:99px;
  background:rgba(255,255,255,.32);transition:.25s}
.bnr-dots span.on{width:16px;background:var(--g)}

/* ─── Wallet card ────────────────────────── */
.wallet{position:relative;overflow:hidden;border-radius:var(--r-l);
  padding:18px;margin-bottom:16px;border:1px solid var(--g-line);
  background:
    radial-gradient(120% 130% at 92% 0%, rgba(16,185,129,.16), transparent 60%),
    linear-gradient(160deg,#14202F 0%,#0D1420 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 16px 36px -24px rgba(0,0,0,.9)}
.wallet > *{position:relative;z-index:2}
.wallet::after{content:'';position:absolute;inset-block:-30%;inset-inline-end:-12%;
  width:46%;background:var(--g);opacity:.09;
  clip-path:polygon(0 0,100% 22%,46% 50%,100% 78%,0 100%)}
.wallet-top{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px}
.wallet-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--g-soft);color:var(--g)}
.wallet-bal{font-size:clamp(30px,9vw,38px);font-weight:800;letter-spacing:-.04em;
  line-height:1;font-variant-numeric:tabular-nums lining-nums}
.wallet-sub{color:var(--tx-2);font-size:12.5px;margin-top:5px}

/* Wallet action row */
.wacts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wact{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:11px 4px;border-radius:12px;font-size:10.5px;font-weight:700;
  color:var(--tx-2);transition:.16s}
.wact-i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--s3);color:var(--tx-2);transition:.16s}
.wact:hover{color:var(--tx)}
.wact:hover .wact-i{background:var(--g-soft);color:var(--g)}
.wact:active{transform:scale(.94)}
.wact.pri .wact-i{background:var(--g);color:#04121B}
.wact.off{opacity:.4}

/* ─── Buttons ────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border-radius:12px;font-weight:800;font-size:14px;
  background:var(--g);color:#04121B;
  box-shadow:0 1px 2px rgba(0,0,0,.3),0 8px 18px -10px rgba(16,185,129,.55);
  transition:background .16s,transform .18s var(--spring),box-shadow .18s}
.btn:hover:not(:disabled){background:var(--g-d)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn svg{width:17px;height:17px}
.btn.line{background:transparent;border:1px solid var(--line-2);color:var(--tx);
  box-shadow:none}
.btn.line:hover:not(:disabled){background:var(--s2);border-color:var(--tx-3)}
.btn.ghost{background:var(--s2);color:var(--tx);box-shadow:none}
.btn.ghost:hover:not(:disabled){background:var(--s3)}
.btn.risk{background:transparent;border:1px solid rgba(239,95,95,.35);
  color:var(--bad);box-shadow:none}
.btn.wide{width:100%}
.btn.sm{padding:9px 14px;font-size:12.5px;border-radius:10px}
.btn.sm svg{width:15px;height:15px}
.btn.lg{padding:15px 22px;font-size:15.5px;border-radius:14px}

/* Quick actions */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.qbtn{display:flex;align-items:center;gap:11px;padding:14px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--s1);text-align:start;transition:.18s}
.qbtn:hover{border-color:var(--g);background:var(--s2)}
.qbtn:active{transform:scale(.98)}
.qbtn .qi{width:38px;height:38px;border-radius:11px;flex:none;display:grid;
  place-items:center;background:var(--s3);color:var(--tx-2);transition:.18s}
.qbtn:hover .qi{background:var(--g-soft);color:var(--g)}
.qbtn.pri .qi{background:var(--g-soft);color:var(--g)}
.qbtn .qt{font-size:13.5px;font-weight:700}
.qbtn .qs{font-size:11px;color:var(--tx-3)}

/* ─── Chips & badges ─────────────────────── */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
  border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--g-soft);color:var(--g)}
.chip.wait{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.off{background:var(--s3);color:var(--tx-3)}

/* ─── Categories ─────────────────────────── */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
@media(max-width:400px){.cats{grid-template-columns:repeat(2,1fr)}}
.cat{position:relative;display:flex;flex-direction:column;align-items:center;
  gap:8px;padding:15px 8px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--s1);transition:.18s;overflow:hidden;
  animation:rise .42s var(--ease) backwards}
.cat:hover{border-color:var(--g);background:var(--s2);transform:translateY(-2px)}
.cat:active{transform:scale(.97)}
.cat.soon{opacity:.55}
.cat.soon:hover{border-color:var(--line);transform:none}
.cat-i{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  background:var(--s3);color:var(--g);overflow:hidden;flex:none}
.cat-i img{width:100%;height:100%;object-fit:cover}
.cat-i svg{width:21px;height:21px}
.cat-n{font-size:12px;font-weight:700;text-align:center;line-height:1.3}
.cat-s{font-size:9.5px;color:var(--tx-3);text-align:center;line-height:1.3}
.soonbadge{position:absolute;top:6px;inset-inline-start:6px;z-index:3;
  font-size:9px;font-weight:800;padding:2px 6px;border-radius:99px;
  background:var(--g);color:#04121B}

/* Horizontal category rail — home */
.catrail{display:flex;gap:9px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;
  scroll-snap-type:x proximity;scrollbar-width:none}
.catrail::-webkit-scrollbar{display:none}
.catrail > *{flex:0 0 104px;scroll-snap-align:start}

/* Two-up grid — category pages */
.catgrid2{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
@media(min-width:700px){.catgrid2{grid-template-columns:repeat(3,1fr)}}
.cat.big{padding:18px 12px;gap:11px}
.cat.big .cat-i{width:64px;height:64px;border-radius:17px}
.cat.big .cat-i svg{width:29px;height:29px}
.cat.big .cat-n{font-size:14px}
.cat.big .cat-s{font-size:10.5px}
.cat.more .cat-i{background:var(--g-soft);color:var(--g)}

/* Breadcrumbs */
.crumbs{display:flex;align-items:center;gap:5px;flex-wrap:wrap;
  font-size:12px;color:var(--tx-3);margin-bottom:16px}
.crumbs button{color:var(--tx-2);font-weight:600}
.crumbs button:hover{color:var(--g)}
.crumbs b{color:var(--tx);font-weight:700}
.crumbs svg{width:13px;height:13px;opacity:.5}

/* ─── Products ───────────────────────────── */
.plist{display:flex;flex-direction:column;gap:9px}
.prod{display:flex;align-items:center;gap:12px;width:100%;padding:11px;
  border-radius:var(--r);border:1px solid var(--line);background:var(--s1);
  text-align:start;transition:.18s;animation:rise .4s var(--ease) backwards}
.prod:hover{border-color:var(--g);background:var(--s2)}
.prod:active{transform:scale(.99)}
.prod.out{opacity:.48}
.prod-i{width:54px;height:54px;border-radius:12px;flex:none;overflow:hidden;
  display:grid;place-items:center;background:var(--s3);color:var(--tx-3)}
.prod-i img{width:100%;height:100%;object-fit:cover}
.prod-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.prod-n{font-size:14px;font-weight:700;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.prod-s{font-size:11px;color:var(--tx-3)}
.prod-prow{display:flex;align-items:baseline;gap:8px;margin-top:3px}
.prod-p{font-size:15px;color:var(--g)}
.prod-old{font-size:12px;color:var(--tx-3);text-decoration:line-through}
.offbadge{position:absolute;top:8px;inset-inline-start:8px;
  padding:2px 7px;border-radius:99px;font-size:10px;font-weight:800;
  background:var(--bad);color:#fff;z-index:3}
.prod{position:relative}
.prod-a{width:34px;height:34px;border-radius:11px;flex:none;display:grid;
  place-items:center;background:var(--g-soft);color:var(--g);transition:.18s}
.prod:hover .prod-a{background:var(--g);color:#04121B}

/* Search & filter */
.search{position:relative;margin-bottom:13px}
.search svg{position:absolute;inset-inline-start:13px;top:50%;
  transform:translateY(-50%);color:var(--tx-3);width:17px;height:17px}
.search input{padding:12px 40px 12px 13px}
.pills{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px;margin-bottom:14px;
  scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:8px 14px;border-radius:99px;font-size:12.5px;font-weight:700;
  border:1px solid var(--line);background:var(--s1);color:var(--tx-2);transition:.16s}
.pill:hover{border-color:var(--line-2);color:var(--tx)}
.pill.on{background:var(--g);border-color:var(--g);color:#04121B}
.pill:active{transform:scale(.96)}

/* Cart items */
.citem{display:flex;gap:12px;padding:12px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--s1);
  animation:rise .34s var(--ease) backwards}
.citem-i{width:56px;height:56px;border-radius:13px;flex:none;overflow:hidden;
  display:grid;place-items:center;background:var(--s3);color:var(--tx-3)}
.citem-i img{width:100%;height:100%;object-fit:cover}
.citem-n{font-size:14px;font-weight:700;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.citem-q{display:inline-flex;align-items:center;gap:2px;margin-top:7px;
  border:1px solid var(--line-2);border-radius:9px;background:var(--s2)}
.citem-q button{width:30px;height:28px;display:grid;place-items:center;
  font-size:16px;color:var(--tx-2)}
.citem-q button:hover{background:var(--s3);color:var(--tx)}
.citem-q .num{min-width:26px;text-align:center;font-size:13.5px}
.citem-x{width:30px;height:30px;border-radius:9px;margin-top:8px;
  display:grid;place-items:center;color:var(--tx-3);transition:.16s}
.citem-x:hover{background:var(--bad-soft);color:var(--bad)}

/* ─── Inputs ─────────────────────────────── */
.inp{background:var(--s2);border:1px solid var(--line-2);border-radius:12px;
  padding:13px;color:var(--tx);font-size:15px;transition:.16s}
.inp::placeholder{color:var(--tx-3)}
.inp:hover:not(:focus){border-color:var(--tx-3)}
.inp:focus{outline:none;border-color:var(--g);background:var(--s3);
  box-shadow:0 0 0 3px var(--g-soft)}
.inp.bad{border-color:var(--bad)}
select.inp{appearance:none;background-image:
  linear-gradient(45deg,transparent 50%,var(--tx-2) 50%),
  linear-gradient(135deg,var(--tx-2) 50%,transparent 50%);
  background-position:14px 21px,20px 21px;background-size:6px 6px;
  background-repeat:no-repeat}
textarea.inp{resize:vertical;line-height:1.65}

/* Amount chips */
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.amt{padding:13px 4px;border:1.5px solid var(--line-2);border-radius:12px;
  background:var(--s2);font-weight:800;font-size:15px;text-align:center;

.row-b{flex:1;min-width:0}
.row-t{font-size:13.5px;font-weight:700;overflow:hidden;

.row-s{font-size:11.5px;color:var(--tx-3)}
.row-v{text-align:start;flex:none}
.row-a{font-size:14px;font-weight:800}

/* Menu rows */
.menu{display:flex;flex-direction:column;gap:2px}
.mrow{display:flex;align-items:center;gap:13px;width:100%;padding:14px;
  border-radius:12px;text-align:start;transition:.16s;
  animation:slideIn .34s var(--ease) backwards}
.mrow:hover{background:var(--s2)}
.mrow:active{transform:scale(.99)}
.mrow-i{width:36px;height:36px;border-radius:11px;flex:none;display:grid;
  place-items:center;background:var(--s2);color:var(--tx-2)}
.mrow:hover .mrow-i{background:var(--g-soft);color:var(--g)}
.mrow-t{flex:1;font-size:14px;font-weight:700}
.mrow-x{color:var(--tx-3)}
.mrow.danger .mrow-i{color:var(--bad)}
.mrow.danger .mrow-t{color:var(--bad)}

/* ─── Stats ──────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:var(--s1)}
.stat{padding:14px 12px;border-inline-end:1px solid var(--line);min-width:0}
.stat:last-child{border-inline-end:none}
.stat .v{font-size:19px;font-weight:800;letter-spacing:-.03em}
.stat .k{font-size:10.5px;color:var(--tx-3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ─── Quote box ──────────────────────────── */
.quote{background:var(--s2);border:1px solid var(--line);border-radius:12px;
  padding:14px;margin-top:14px}
.qrow{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px}
.qrow .k{color:var(--tx-2)}
.qrow.tot{border-top:1px dashed var(--line-2);margin-top:8px;padding-top:11px;
  font-weight:800;font-size:16px}

/* ─── Copy rows ──────────────────────────── */
.cprow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;padding:14px;border-radius:13px;text-align:start;
  background:var(--s2);border:1px solid var(--line);transition:.16s}
.cprow:hover{border-color:var(--g);background:var(--s3)}
.cprow:active{transform:scale(.99)}
.cpk{font-size:11.5px;color:var(--tx-3);margin-bottom:2px}

  border:1px solid rgba(255,255,255,.09);
  transform-style:preserve-3d;will-change:transform;backface-visibility:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,

.vcard::before{content:'';position:absolute;inset:-40%;z-index:3;pointer-events:none;

                             transparent 57%);

.vcard:hover{transform:translateY(-6px);

             0 0 80px -22px rgba(16,185,129,.45)}

.vcard.tilt{transform:perspective(900px) rotateX(var(--rx,0)) rotateY(var(--ry,0))

.vc-pan{font-size:14.5px;letter-spacing:.11em;color:#DCE5F2}

.vc-amt{font-size:19px;font-weight:800;letter-spacing:-.03em}

.crail > *{flex:0 0 min(74vw,264px);scroll-snap-align:start}
@media(min-width:700px){

/* ─── Sheet ──────────────────────────────── */
.ov{position:fixed;inset:0;z-index:120;background:rgba(4,7,13,.72);

.sheet > *:nth-child(3){animation-delay:.07s}

.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;

/* ─── Toast ──────────────────────────────── */
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;

.tbl td{padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}

.sdot.on{background:var(--g);color:#04121B}
.sdot.done{background:var(--g-soft);color:var(--g)}
.sline{height:2px;flex:1;background:var(--line-2);border-radius:2px;transition:.3s}
.sline.on{background:var(--g)}

/* ─── Motion ─────────────────────────────── */
@keyframes rise{from{opacity:0;transform:translate3d(0,14px,0) scale(.99)}
  to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translate3d(-14px,0,0)}
  to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%);opacity:.4}}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes cardin{from{opacity:0;
  transform:perspective(900px) translate3d(0,26px,-70px) rotateX(9deg) scale(.95)}}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

.wrap.anim > *{animation:rise .42s var(--ease) backwards}
.wrap.anim > *:nth-child(2){animation-delay:.045s}
.wrap.anim > *:nth-child(3){animation-delay:.09s}
.wrap.anim > *:nth-child(4){animation-delay:.13s}
.wrap.anim > *:nth-child(n+5){animation-delay:.16s}

.cats .cat:nth-child(2){animation-delay:.05s}
.cats .cat:nth-child(3){animation-delay:.1s}
.cats .cat:nth-child(4){animation-delay:.15s}
.plist .prod:nth-child(2){animation-delay:.04s}
.plist .prod:nth-child(3){animation-delay:.08s}
.plist .prod:nth-child(n+4){animation-delay:.11s}

.autochk{display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:14px;font-size:12px;color:var(--tx-3)}
.autochk i{width:7px;height:7px;border-radius:50%;background:var(--g);
  animation:pulse 1.6s ease-in-out infinite}

@supports not (backdrop-filter:blur(1px)){
  .bar,.dock{background:rgba(10,14,23,.97)}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .vcard::before{display:none}
}
.hide{display:none!important}
@media(min-width:1024px){.lg-off{display:none}}
</style>

const dt=v=>{if(!v)return '—';const d=v.toDate?v.toDate():new Date(v);

let _invTimer=null,_invPoll=null;

function countTo(el,target,fmt=usd,ms=700){
  if(!el)return;
  const from=parseFloat(el.dataset.v||0);
  el.dataset.v=target;
  if(Math.abs(target-from)<.005){el.textContent=fmt(target);return}
  const t0=performance.now();
  const step=now=>{
    const p=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-p,3);
    el.textContent=fmt(from+(target-from)*e);
    if(p<1)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function toast(msg,kind=''){
  const el=document.createElement('div');
  el.className='toast '+kind;
  el.innerHTML=(kind==='ok'?svg(I.check,2.4):kind==='bad'?svg(I.clock,2.2):'')
    +`<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(-10px)';
    el.style.transition='.26s';setTimeout(()=>el.remove(),270)},3600);
}

async function api(path,body){
  const token=await auth.currentUser.getIdToken();
  const res=await fetch(API_BASE+path,{method:'POST',
    headers:{'content-type':'application/json',authorization:'Bearer '+token},
    body:JSON.stringify(body||{})});
  const d=await res.json().catch(()=>({success:false,error:'رد غير مفهوم'}));
  if(!d.success)throw new Error(d.error||'فشلت العملية');
  return d;
}
async function apiGet(path){
  const res=await fetch(API_BASE+path);
  const d=await res.json();
  if(!d.success)throw new Error(d.error||'خطأ');
  return d;
}

function applyTheme(){
  const t=S.config.theme;if(!t)return;
  const r=document.documentElement.style;
  const dark=c=>{const m=/^#([\da-f]{6})$/i.exec(c||'');if(!m)return null;
    const v=parseInt(m[1],16),d=x=>Math.max(0,Math.round(x*.85));
    return '#'+[d(v>>16&255),d(v>>8&255),d(v&255)]
      .map(x=>x.toString(16).padStart(2,'0')).join('')};
  if(t.emerald){r.setProperty('--g',t.emerald);
    const d=dark(t.emerald);if(d)r.setProperty('--g-d',d)}
}

async function ensureProfile(user){
  const ref=doc(db,'users',user.uid);
  try{
    const snap=await getDoc(ref);
    if(!snap.exists())await setDoc(ref,{
      name:user.displayName||'مستخدم',email:user.email||'',phone:'',
      wallet_balance:0,total_spent:0,cards_count:0,banned:false,
      created_at:new Date().toISOString()},{merge:true});
  }catch{}
}

function subscribe(uid){
  S.unsub.push(onSnapshot(doc(db,'users',uid),s=>{
    if(s.exists())S.profile={...S.profile,...s.data()};render()},()=>{}));
  S.unsub.push(onSnapshot(query(collection(db,'cards'),
    where('uid','==',uid),orderBy('created_at','desc')),
    s=>{S.cards=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{}));
  S.unsub.push(onSnapshot(query(collection(db,'orders'),
    where('uid','==',uid),orderBy('created_at','desc'),limit(6)),
    s=>{S.shopOrders=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{}));
}

/* Lazy listeners — heavy lists load only on their page */
const _lazy={};
function lazySub(key,build){
  if(_lazy[key])return;
  _lazy[key]=onSnapshot(build(),snap=>{
    const rows=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(key==='orders')S.orders=rows;
    if(key==='deposits')S.deposits=rows;
    if(key==='shop')S.shopOrders=rows;
    if(key==='tickets')S.tickets=rows;
    if(key==='withdrawals')S.withdrawals=rows;
    render();
  },()=>{});
}
function dropLazy(except){
  Object.keys(_lazy).forEach(k=>{
    if(k!==except&&_lazy[k]){try{_lazy[k]()}catch{} delete _lazy[k]}
  });
}
function ensurePageData(){
  const uid=S.user&&S.user.uid;if(!uid)return;
  if(S.page==='orders'){
    lazySub('shop',()=>query(collection(db,'orders'),
      where('uid','==',uid),orderBy('created_at','desc'),limit(50)));
    dropLazy('shop');
  }else if(S.page==='wallet'){
    lazySub('deposits',()=>query(collection(db,'wallet_deposits'),
      where('uid','==',uid),orderBy('created_at','desc'),limit(40)));
    lazySub('withdrawals',()=>query(collection(db,'withdrawals'),
      where('uid','==',uid),orderBy('created_at','desc'),limit(20)));
  }else if(S.page==='tickets'){
    lazySub('tickets',()=>query(collection(db,'tickets'),
      where('uid','==',uid),orderBy('updated_at','desc'),limit(30)));
    dropLazy('tickets');
  }else if(S.page==='tx'){
    lazySub('orders',()=>query(collection(db,'card_orders'),
      where('uid','==',uid),orderBy('created_at','desc'),limit(60)));
    lazySub('deposits',()=>query(collection(db,'wallet_deposits'),
      where('uid','==',uid),orderBy('created_at','desc'),limit(40)));
  }else dropLazy(null);
}

  if(S.config.kill_switch===true){

    view.innerHTML=killScreen();
    _last=null;return;

    cards:vCards,issue:vIssue,tx:vTx,invite:vInvite,guide:vGuide,

  const moved=_last!==S.page+(S.cat||'');

  _last=S.page+(S.cat||'');

/* Category tree helpers */
const kidsOf=id=>S.catalog.categories.filter(c=>(c.parent||'')===(id||''));
const prodsOf=id=>S.catalog.products.filter(p=>p.cat===id);
function trailOf(id){
  const out=[];let cur=S.catalog.categories.find(c=>c.id===id);
  while(cur){out.unshift(cur);cur=S.catalog.categories.find(c=>c.id===cur.parent)}
  return out;
}
/* Counts everything beneath a node, at any depth */
function deepCount(id){
  let t=prodsOf(id).length;
  for(const k of kidsOf(id))t+=deepCount(k.id);
  return t;
}

      </div>`:''}

    <div class="quote" style="margin-top:0">
      <div class="qrow"><span class="k">عدد المنتجات</span>

        <span class="num" style="color:var(--g)">−${lyd(S.coupon.off_lyd)}</span></div>`:''}
      <div class="qrow"><span class="k">رصيدك</span>
        <span class="num">${lyd(S.profile.wallet_balance*rate())}</span></div>
      <div class="qrow tot"><span>الإجمالي</span>
        <span class="num">${lyd(tot-(S.coupon?S.coupon.off_lyd:0))}</span></div>

      <button style="color:var(--g);font-weight:800"

    <button class="btn lg wide" id="cPay" style="margin-top:16px" ${ok?'':'disabled'}>

    <button class="btn line wide" style="margin-top:9px"
      onclick="closeSheet()">متابعة التسوق</button>`);

    S.coupon=null;cartSheet();render();
  });

  onTap('#cpGo',async()=>{
    const code=$('#cpIn').value.trim().toUpperCase();
    if(!code){S.coupon=null;return cartSheet()}
    const b=$('#cpGo');b.disabled=true;
    try{
      const r=await api('/api/coupon/check',{code,subtotal_lyd:cartTotal()});
      S.coupon=r.coupon;toast('طُبّق الخصم '+lyd(r.coupon.off_lyd),'ok');cartSheet();

        items:S.cart.map(i=>({id:i.id,qty:i.qty,values:i.values})),

    }catch(e){
      toast(e.message,'bad');b.disabled=false;b.textContent='تأكيد الشراء';
    }
  });
}

function compressProof(file,maxW=900,quality=.55){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onerror=()=>reject(new Error('تعذّرت قراءة الصورة'));
    r.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('الملف ليس صورة صالحة'));
      img.onload=()=>{
        const s=Math.min(1,maxW/img.width);
        const w=Math.round(img.width*s),h=Math.round(img.height*s);
        const cv=document.createElement('canvas');
        cv.width=w;cv.height=h;
        const cx=cv.getContext('2d');
        cx.fillStyle='#fff';cx.fillRect(0,0,w,h);
        cx.drawImage(img,0,0,w,h);
        let q=quality,out=cv.toDataURL('image/jpeg',q);
        while(out.length>700000&&q>.2){q-=.1;out=cv.toDataURL('image/jpeg',q)}
        if(out.length>900000)return reject(new Error('الصورة كبيرة جدًا'));
        resolve(out);
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

         justify-content:space-between;align-items:center">
      <div><div class="cpk">الشبكة</div><div class="cpv">TRC20 (Tron)</div></div>
      <span class="chip ok">مطلوبة</span>
    </div>

    <div class="note" style="margin-top:12px">

    <div id="invMsg"></div>
    <div class="autochk"><i></i> نتابع الشبكة تلقائيًا…</div>

    <button class="btn line wide" style="margin-top:9px"
      onclick="closeInvoice()">إغلاق</button>`);

  const done=r=>{
    clearInterval(_invTimer);clearInterval(_invPoll);
    try{localStorage.removeItem('kardo_inv')}catch{}
    closeSheet();depositResult(true,r.credited||inv.amount_usd);render();
  };

  onTap('#cpAmt',()=>copy(String(inv.pay_amount),'المبلغ'));
  onTap('#cpAdr',()=>copy(inv.address,'العنوان'));

  const tick=()=>{
    const left=inv.expires_ms-Date.now();
    const el=$('#invClock');
    if(!el){clearInterval(_invTimer);return}
    if(left<=0){
      el.textContent='انتهت المهلة';el.style.color='var(--bad)';
      const b=$('#uChk');if(b){b.disabled=true;b.textContent='انتهت المهلة'}
      clearInterval(_invTimer);clearInterval(_invPoll);
      try{localStorage.removeItem('kardo_inv')}catch{}
      return;
    }
    const mm=String(Math.floor(left/60000)).padStart(2,'0');
    const ss=String(Math.floor(left%60000/1000)).padStart(2,'0');
    el.textContent=`تنتهي خلال ${mm}:${ss}`;
  };
  tick();
  _invTimer=setInterval(tick,1000);

  let busy=false;
  _invPoll=setInterval(async()=>{
    if(busy||!$('#uChk'))return;
    busy=true;
    try{
      const r=await api('/api/wallet/usdt/verify',{invoice_id:inv.id});
      if(r.paid)return done(r);
    }catch{}
    busy=false;
  },15000);

  onTap('#uChk',async()=>{
    const b=$('#uChk'),msg=$('#invMsg');
    b.disabled=true;
    b.innerHTML='<span class="sk" style="width:90px;height:14px;display:inline-block"></span>';
    msg.innerHTML='';
    try{
      const r=await api('/api/wallet/usdt/verify',{invoice_id:inv.id});
      if(r.paid)return done(r);
      msg.innerHTML=`<div class="note" style="margin-top:14px">${
        r.duplicate?'هذا التحويل مُستخدم بالفعل.'
        :'لم يصل التحويل بعد. الشبكة تحتاج دقيقة — سنتابع تلقائيًا.'}</div>`;
    }catch(e){
      msg.innerHTML=`<div class="note bad" style="margin-top:14px">${esc(e.message)}</div>`;
    }
    b.disabled=false;b.textContent='تحققت من التحويل';
  });
}

function bindTilt(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const MAX=7;
  $$('.vcard').forEach(el=>{
    if(el._t)return;el._t=true;
    const move=(x,y)=>{
      const r=el.getBoundingClientRect();
      const px=(x-r.left)/r.width-.5,py=(y-r.top)/r.height-.5;
      el.style.setProperty('--ry',(px*MAX*2).toFixed(2)+'deg');
      el.style.setProperty('--rx',(-py*MAX*2).toFixed(2)+'deg');
      el.classList.add('tilt');
    };
    const reset=()=>{el.classList.remove('tilt');
      el.style.removeProperty('--rx');el.style.removeProperty('--ry')};
    el.addEventListener('pointermove',e=>{
      if(e.pointerType==='touch')return;move(e.clientX,e.clientY)});
    el.addEventListener('pointerleave',reset);
    let raf=null;
    el.addEventListener('touchmove',e=>{
      const t=e.touches[0];if(!t||raf)return;
      raf=requestAnimationFrame(()=>{raf=null;move(t.clientX,t.clientY)})},{passive:true});
    el.addEventListener('touchend',reset,{passive:true});
    el.addEventListener('touchcancel',reset,{passive:true});
  });
}

function fundSheet(c){
  sheet(`
    <div class="h2" style="margin-bottom:4px">شحن البطاقة</div>
    <p class="row-s" style="margin-bottom:16px">
      ${esc(c.card_name||'بطاقة')} · ••${esc(c.last4)}</p>
    <label class="lbl">المبلغ — الحد الأدنى $${S.config.min_amount||10}</label>
    <input class="inp num" id="fA" type="number" inputmode="decimal"
           min="${S.config.min_amount||10}" placeholder="${S.config.min_amount||10}">
    <div id="fQ"></div>
    <button class="btn lg wide" id="fG" style="margin-top:16px" disabled>شحن البطاقة</button>
    <button class="btn line wide" style="margin-top:9px"
      onclick="openCard('${esc(c.id)}')">رجوع</button>`);

  let q=null,t=null;
  $('#fA').oninput=e=>{
    clearTimeout(t);
    const a=parseFloat(e.target.value);
    t=setTimeout(async()=>{
      const box=$('#fQ'),btn=$('#fG');
      if(!(a>=(S.config.min_amount||10))){q=null;box.innerHTML='';btn.disabled=true;return}
      box.innerHTML=`<div class="quote"><div class="sk" style="height:46px"></div></div>`;
      try{
        const d=await apiGet(`/api/quote?amount=${a}&kind=fund`);
        q=d.quote;box.innerHTML=quoteHtml(q);
        btn.disabled=(S.profile.wallet_balance||0)<q.total;
        if(btn.disabled)box.innerHTML+=`<div class="note" style="margin-top:11px">
          رصيدك غير كافٍ — المتاح ${usd(S.profile.wallet_balance)}.</div>`;
      }catch(err){q=null;box.innerHTML=`<div class="note bad">${esc(err.message)}</div>`;
        btn.disabled=true}
    },420);
  };

  onTap('#fG',async()=>{
    if(!q)return;
    $('#fG').disabled=true;
    try{
      await api('/api/cards/fund',{card_id:c.id,amount:q.amount,
        idempotency_key:crypto.randomUUID?crypto.randomUUID():'k'+Date.now()+Math.random()});
      toast('شُحنت البطاقة بمبلغ '+usd(q.amount),'ok');closeSheet();render();
    }catch(e){toast(e.message,'bad');$('#fG').disabled=false}
  });
}

/* ═══ Issue card ═══ */
function quoteHtml(q){
  return `<div class="quote">
    <div class="qrow"><span class="k">قيمة البطاقة</span>
      <span class="num">${usd(q.amount)}</span></div>
    <div class="qrow"><span class="k">رسوم الخدمة</span>
      <span class="num">${usd(q.service_fee)}</span></div>
    <div class="qrow tot"><span>الإجمالي</span><span class="num">${usd(q.total)}
      <span style="font-size:12px;color:var(--tx-3);font-weight:400">
        · ${lyd(q.total_lyd)}</span></span></div></div>`;
}

let qTimer=null;
async function fetchQuote(amount){
  const box=$('#qbox'),btn=$('#wN2');
  if(!box)return;
  const mn=S.config.min_amount||10,mx=S.config.max_amount||200;
  if(!(amount>=mn&&amount<=mx)){
    S.wiz.quote=null;
    box.innerHTML=amount?`<div class="note" style="margin-top:14px">
      المبلغ يجب أن يكون بين $${mn} و $${mx}.</div>`:'';
    if(btn)btn.disabled=true;return;
  }
  box.innerHTML=`<div class="quote">
    <div class="sk" style="height:15px;margin-bottom:10px"></div>
    <div class="sk" style="height:15px;width:68%;margin-bottom:10px"></div>
    <div class="sk" style="height:20px;width:46%"></div></div>`;
  try{
    const d=await apiGet(`/api/quote?amount=${amount}&kind=create`);
    S.wiz.quote=d.quote;S.wiz.amount=amount;
    box.innerHTML=quoteHtml(d.quote);
    if(btn)btn.disabled=false;
  }catch(e){
    S.wiz.quote=null;
    box.innerHTML=`<div class="note bad" style="margin-top:14px">${esc(e.message)}</div>`;
    if(btn)btn.disabled=true;
  }
}

    return `<div class="h1" style="margin-bottom:18px">إصدار بطاقة</div>

      </div></div>`;

  const w=S.wiz;
  const dot=k=>`<div class="sdot ${w.step===k?'on':w.step>k?'done':''}">${
    w.step>k?'✓':k}</div>`;
  const line=k=>`<div class="sline ${w.step>k?'on':''}"></div>`;
  let body='';

  if(w.step===1){
    body=`
    <label class="lbl">اسم البطاقة — لك وحدك</label>
    <input class="inp" id="wLabel" placeholder="بطاقة الاشتراكات"
           value="${esc(w.label)}" maxlength="40">

    <p class="sub" style="font-size:12px;margin-top:8px">

  }else if(w.step===2){
    const mn=S.config.min_amount||10,mx=S.config.max_amount||200;
    body=`
    <label class="lbl">قيمة البطاقة</label>
    <div class="amts">${[10,20,50,100].map(a=>
      `<button class="amt ${w.amount===a?'on':''}" data-amt="${a}">$${a}</button>`).join('')}</div>
    <label class="lbl" style="margin-top:16px">أو مبلغ آخر — من $${mn} إلى $${mx}</label>
    <input class="inp num" id="wCustom" type="number" inputmode="decimal"
           min="${mn}" max="${mx}" placeholder="${mn}"
           value="${w.amount&&![10,20,50,100].includes(w.amount)?w.amount:''}">
    <div id="qbox">${w.quote?quoteHtml(w.quote):''}</div>
    <button class="btn lg wide" id="wN2" style="margin-top:18px"
      ${w.quote?'':'disabled'}>التالي</button>
    <button class="btn line wide" style="margin-top:9px" data-step="1">رجوع</button>`;
  }else{
    const q=w.quote,ok=(S.profile.wallet_balance||0)>=q.total;
    body=`
    <div class="quote" style="margin-top:0">
      <div class="qrow"><span class="k">اسم البطاقة</span>
        <span>${esc(w.label||'بطاقة')}</span></div>
      <div class="qrow"><span class="k">حامل البطاقة</span>
        <span class="mono" dir="ltr">${esc(w.name)}</span></div>
      <div class="qrow"><span class="k">قيمة البطاقة</span>
        <span class="num">${usd(q.amount)}</span></div>
      <div class="qrow"><span class="k">رسوم الخدمة</span>
        <span class="num">${usd(q.service_fee)}</span></div>
      <div class="qrow tot"><span>الإجمالي</span><span class="num">${usd(q.total)}
        <span style="font-size:12px;color:var(--tx-3);font-weight:400">
          · ${lyd(q.total_lyd)}</span></span></div>
    </div>
    ${!ok?`<div class="note" style="margin:14px 0 0">
      رصيدك ${usd(S.profile.wallet_balance)} — تحتاج
      ${usd(q.total-S.profile.wallet_balance)} إضافية.
      <button style="color:var(--g);font-weight:800" data-act="deposit">
        إضافة رصيد</button></div>`:''}
    <label style="display:flex;gap:10px;align-items:flex-start;margin:16px 0;
           font-size:13px;cursor:pointer;color:var(--tx-2)">
      <input type="checkbox" id="wAgree" style="width:17px;height:17px;margin-top:2px;
             flex:none;accent-color:var(--g)">
      <span>أوافق على الشروط: البطاقة تُصدر عبر جهة خارجية، ورسوم الإصدار
        غير قابلة للاسترداد بعد نجاح العملية.</span></label>
    <button class="btn lg wide" id="wGo" ${ok?'':'disabled'}>إصدار البطاقة</button>
    <button class="btn line wide" style="margin-top:9px" data-step="2">رجوع</button>`;
  }

  return `
  <div class="eyebrow" style="margin-bottom:5px">خطوة ${w.step} من 3</div>
  <div class="h1" style="margin-bottom:20px">إصدار بطاقة</div>
  <div class="card" style="max-width:520px">
    <div class="steps">${dot(1)}${line(1)}${dot(2)}${line(2)}${dot(3)}</div>
    ${body}
  </div>`;
}

/* ═══ Transactions ═══ */
const TYPE={create:'إصدار بطاقة',fund:'شحن بطاقة',deposit:'إيداع رصيد'};
const STAT={completed:['ok','مكتملة'],processing:['wait','قيد المعالجة'],
  refunded:['bad','مستردة'],failed:['bad','فاشلة'],
  pending:['wait','قيد المراجعة'],approved:['ok','مقبول'],rejected:['bad','مرفوض']};

function vTx(){
  const F=[['all','الكل'],['create','إصدار'],['fund','شحن'],['deposit','إيداع']];
  let rows=[...S.orders.map(o=>({...o,kind:o.type})),
    ...S.deposits.map(d=>({id:d.id,kind:'deposit',status:d.status,
      amount:d.amount_usd,customer_price:d.amount_usd,created_at:d.created_at}))]
    .sort((a,b)=>{
      const av=a.created_at?.toDate?.()||new Date(a.created_at||0);
      const bv=b.created_at?.toDate?.()||new Date(b.created_at||0);
      return bv-av});
  if(S.filter!=='all')rows=rows.filter(r=>r.kind===S.filter);

  return `
  <div class="h1" style="margin-bottom:5px">المعاملات</div>
  <p class="sub" style="margin-bottom:14px">كل عمليات بطاقاتك ومحفظتك.</p>
  <div class="pills">
    ${F.map(([k,t])=>`<button class="pill ${S.filter===k?'on':''}"
      data-filter="${k}">${t}</button>`).join('')}
  </div>
  ${rows.length?`<div class="list">${rows.map(r=>{
    const st=STAT[r.status]||['off','—'];
    const isIn=r.kind==='deposit';
    const val=r.customer_price??r.amount??0;
    return `<div class="row">
      <div class="row-i" ${isIn?'style="color:var(--g);background:var(--g-soft)"':''}>
        ${svg(isIn?I.up:r.kind==='fund'?I.plus:I.card)}</div>
      <div class="row-b">
        <div class="row-t">${TYPE[r.kind]||'عملية'}</div>
        <div class="row-s">${dt(r.created_at)}</div></div>
      <div class="row-v">
        <div class="row-a num ${isIn&&r.status==='approved'?'in':''}">
          ${isIn?'+':'−'}${usd(val)}</div>
        <span class="chip ${st[0]}" style="margin-top:3px">${st[1]}</span>
      </div></div>`}).join('')}</div>`
   :`<div class="card"><div class="empty">
      <div class="ei">${svg(I.list,1.6)}</div>
      <p style="font-size:13.5px">لا معاملات بهذا التصنيف.</p></div></div>`}`;
}

/* ═══ Bind ═══ */
function bind(){
  $$('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='deposit')return depositSheet();
    go(a);
  });
  $$('[data-cat]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.cat;
    if(!id){S.cat=null;S.q='';S.page='shop';return render()}
    const c=S.catalog.categories.find(x=>x.id===id);
    if(c&&c.soon)return soonSheet(c);
    S.cat=id;S.q='';S.filter='all';S.page='shop';render();
  });
  $$('[data-prod]').forEach(b=>b.onclick=()=>productSheet(b.dataset.prod));
  $$('[data-back]').forEach(b=>b.onclick=()=>{
    const cur=S.catalog.categories.find(x=>x.id===S.cat);
    S.cat=(cur&&cur.parent)||null;   // اصعد طبقة واحدة
    S.q='';render();
  });
  $$('[data-order]').forEach(b=>b.onclick=()=>orderSheet(b.dataset.order));
  $$('[data-card]').forEach(b=>b.onclick=()=>openCard(b.dataset.card));
  $$('[data-filter]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.filter;render()});
  $$('[data-step]').forEach(b=>b.onclick=()=>{S.wiz.step=+b.dataset.step;render()});
  $$('[data-blink]').forEach(b=>b.onclick=()=>window.open(b.dataset.blink,'_blank'));
  $$('[data-wact]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.wact;
    if(a==='deposit')return depositSheet();
    if(a==='withdraw')return withdrawSheet();
    if(a==='transfer')return transferSheet();
    if(a==='points')return pointsSheet();
  });
  $$('[data-tic]').forEach(b=>b.onclick=()=>ticketSheet(b.dataset.tic));
  onTap('#newTic',()=>newTicketSheet());

  const sq=$('#shopQ');
  if(sq){
    sq.oninput=e=>{
      S.q=e.target.value;
      clearTimeout(sq._t);
      sq._t=setTimeout(()=>{const p=sq.selectionStart;render();
        const el=$('#shopQ');if(el){el.focus();el.setSelectionRange(p,p)}},260);
    };
  }

  const hb=$('#hBal');
  if(hb){hb.dataset.v=0;countTo(hb,S.profile.wallet_balance*rate(),lyd)}

  bannerSlider();

  onTap('#wN1',()=>{
    const name=$('#wName').value.trim().toUpperCase();
    if(!/^[A-Z][A-Z .'-]{1,23}$/.test(name)){
      $('#wName').classList.add('bad');
      return toast('اكتب الاسم بحروف لاتينية — حرفان على الأقل','bad');
    }
    S.wiz.label=$('#wLabel').value.trim()||'بطاقتي';
    S.wiz.name=name;S.wiz.step=2;render();
  });

  $$('[data-amt]').forEach(b=>b.onclick=()=>{
    $$('[data-amt]').forEach(x=>x.classList.toggle('on',x===b));
    const cu=$('#wCustom');if(cu)cu.value='';
    fetchQuote(+b.dataset.amt);
  });
  const cu=$('#wCustom');
  if(cu)cu.oninput=e=>{
    $$('[data-amt]').forEach(x=>x.classList.remove('on'));
    clearTimeout(qTimer);
    qTimer=setTimeout(()=>fetchQuote(parseFloat(e.target.value)),420);
  };
  onTap('#wN2',()=>{
    if(!S.wiz.quote)return;
    S.wiz.idem=crypto.randomUUID?crypto.randomUUID():'k'+Date.now()+Math.random();
    S.wiz.step=3;render();
  });
  onTap('#wGo',async()=>{
    const go3=$('#wGo');
    if(!$('#wAgree').checked)return toast('يجب الموافقة على الشروط','bad');
    go3.disabled=true;
    go3.innerHTML='<span class="sk" style="width:84px;height:14px;display:inline-block"></span>';
    try{
      const r=await api('/api/cards/create',{
        amount:S.wiz.quote.amount,name_on_card:S.wiz.name,
        card_name:S.wiz.label,idempotency_key:S.wiz.idem});
      successSheet(r.card);
      S.wiz={step:1,amount:null,name:S.wiz.name,label:'',idem:null,quote:null};
      S.page='cards';render();
    }catch(e){
      toast(e.message,'bad');go3.disabled=false;go3.textContent='إصدار البطاقة';
    }
  });

  const rb=$('#refBox');
  if(rb){
    api('/api/ref/code').then(r=>{
      rb.innerHTML=`<button id="cpRef" class="mono"
        style="display:inline-flex;align-items:center;gap:11px;background:var(--g);
               color:#04121B;padding:13px 24px;border-radius:13px;font-weight:800;
               font-size:26px;letter-spacing:.14em">
        ${svg(I.copy,2)} ${esc(r.code)}</button>`;
      onTap('#cpRef',()=>copy(r.code,'رمز الدعوة'));
    }).catch(e=>{
      rb.innerHTML=`<div class="sub" style="font-size:13px">${esc(e.message)}</div>`;
    });
  }
  onTap('#refGo',async()=>{
    const rg=$('#refGo');
    const c=$('#refIn').value.trim().toUpperCase();
    if(c.length!==6)return toast('الرمز 6 أحرف','bad');
    rg.disabled=true;
    try{
      const r=await api('/api/ref/claim',{code:c});
      toast(`فُعّل الرمز — ستحصل على ${usd(r.bonus)} بعد إنفاق ${usd(r.min_spend)}`,'ok');
      render();
    }catch(e){toast(e.message,'bad');rg.disabled=false}
  });

  const al=$('#actList');
  if(al&&S.user){
    const q=query(collection(db,'activity'),
      where('uid','==',S.user.uid),orderBy('created_at','desc'),limit(6));
    onSnapshot(q,snap=>{
      const rows=snap.docs.map(d=>d.data());
      al.innerHTML=rows.length?rows.map((a,i)=>`
        <div style="display:flex;justify-content:space-between;gap:11px;padding:11px 0;
             ${i<rows.length-1?'border-bottom:1px solid var(--line)':''}">
          <div style="min-width:0">
            <div style="font-size:13.5px;font-weight:700">${
              i===0?'الجلسة الحالية':'تسجيل دخول'}</div>
            <div class="row-s">${dt(a.created_at)}${
              a.city||a.country?' · '+esc([a.city,a.country].filter(Boolean).join(', ')):''}</div>
          </div>
          ${i===0?'<span class="chip ok">نشطة</span>':''}
        </div>`).join('')
        :`<p class="sub" style="font-size:13px">لا سجلات بعد.</p>`;
    },()=>{al.innerHTML='<p class="sub" style="font-size:13px">تعذّر تحميل السجل.</p>'});
  }

  onTap('#pS',async()=>{
    const ps=$('#pS');
    const name=$('#pN').value.trim(),phone=$('#pP').value.trim();
    if(name.length<2)return toast('الاسم قصير جدًا','bad');
    ps.disabled=true;
    try{
      await setDoc(doc(db,'users',S.user.uid),
        {name,phone,phone_key:phoneKey(phone)},{merge:true});
      toast('حُفظت التغييرات','ok');render();
    }catch{toast('تعذّر الحفظ','bad');ps.disabled=false}
  });
  onTap('#pR',async()=>{
    const pr=$('#pR');
    const em=S.profile.email||S.user?.email;
    if(!em)return toast('لا يوجد بريد مسجّل','bad');
    pr.disabled=true;
    try{await sendPasswordResetEmail(auth,em);toast('أُرسل رابط التغيير إلى '+em,'ok')}
    catch{toast('تعذّر الإرسال','bad');pr.disabled=false}
  });
}

/* Banner auto-advance and dot sync */
let _bnrTimer=null;
function bannerSlider(){
  clearInterval(_bnrTimer);
  const track=$('#bTrack'),dots=$('#bDots');
  if(!track)return;
  const slides=track.children.length;
  if(slides<2)return;

  const sync=()=>{
    const i=Math.round(track.scrollLeft/track.clientWidth);
    if(dots)[...dots.children].forEach((d,x)=>d.classList.toggle('on',x===Math.abs(i)));
  };
  track.onscroll=()=>{clearTimeout(track._t);track._t=setTimeout(sync,90)};

  _bnrTimer=setInterval(()=>{
    if(!document.body.contains(track)){clearInterval(_bnrTimer);return}
    const i=Math.round(Math.abs(track.scrollLeft)/track.clientWidth);
    const next=(i+1)%slides;
    track.scrollTo({left:next*track.clientWidth*(document.dir==='rtl'?-1:1),
      behavior:'smooth'});
  },6000);
}
