<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060B14">
<title>كاردو</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<meta name="description" content="كاردو — بطاقات ماستركارد افتراضية بالدولار للسوق الليبي.">
<link rel="preload" href="styles.css" as="style">
<link rel="stylesheet" href="styles.css">
<link rel="modulepreload" href="app.js">
</head>
<body>

<div id="app">
<div class="shell">

  <aside class="rail">
    <div class="brand">
      <span id="railMark"></span>
      <div><div class="en">Kardo</div><div class="ar">كاردو</div></div>
    </div>
    <p class="tag">بطاقات أكثر .. فرص أكبر</p>
    <nav id="navRail"></nav>
    <div class="rail-foot">
      <div style="display:flex;align-items:center;gap:11px;padding:0 3px 13px">
        <div id="av" style="width:34px;height:34px;border-radius:11px;flex:none;
             background:var(--accent-soft);color:var(--accent);
             display:grid;place-items:center;font-weight:700;font-size:13px"></div>
        <div style="min-width:0">
          <div id="railName" style="font-size:13px;font-weight:600;overflow:hidden;
               text-overflow:ellipsis;white-space:nowrap"></div>
          <div id="railBal" class="num" style="font-size:12px;color:var(--accent);font-weight:600"></div>
        </div>
      </div>
      <button class="nav" onclick="askOut()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        تسجيل الخروج</button>
    </div>
  </aside>

  <div class="main">
    <header class="bar">
      <div class="lg-off" style="display:flex;align-items:center;gap:10px">
        <span id="barMark"></span>
        <span style="font-size:16px;font-weight:700;letter-spacing:-.03em">Kardo</span>
      </div>
      <div style="margin-inline-start:auto;display:flex;align-items:center;gap:9px">
        <button class="btn line sm" onclick="go('wallet')">
          <span class="num" id="barBal">—</span></button>
      </div>
    </header>
    <main class="wrap" id="view"></main>
  </div>
</div>
<nav class="dock" id="navDock"></nav>
</div>

<div id="toasts"></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script type="module" src="app.js"></script>
</body>
</html>
