<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080F">
<meta name="description" content="كاردو — كل خدماتك الرقمية في مكان واحد">
<title>كاردو — الخدمات الرقمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#05080F;--bg-2:#0A0E17;--s1:#0F1623;--s2:#141C2B;--s3:#1A2335;--s4:#212B40;
  --line:#1E2839;--line-2:#2A3648;
  --tx:#EEF2F8;--tx-2:#97A5BD;--tx-3:#5F6E88;
  --g:#10B981;--g-2:#0E9E70;--g-3:#34D399;
  --g-soft:rgba(16,185,129,.10);--g-glow:rgba(16,185,129,.28);--g-line:rgba(16,185,129,.26);
  --bad:#EF5F5F;--bad-soft:rgba(239,95,95,.12);
  --warn:#E0A030;--warn-soft:rgba(224,160,48,.12);
  --spring:cubic-bezier(.34,1.4,.44,1);--ease:cubic-bezier(.22,1,.36,1);
  --rail-w:256px;--bar-h:62px;--dock-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Tajawal',system-ui,-apple-system,sans-serif;
  font-feature-settings:'lnum' 1,'tnum' 1;background:var(--bg-2);color:var(--tx);
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60vw 42vh at 88% -6%,rgba(16,185,129,.08),transparent 60%),
    radial-gradient(48vw 36vh at -8% 2%,rgba(74,158,255,.05),transparent 58%),
    radial-gradient(70vw 50vh at 50% 110%,rgba(16,185,129,.04),transparent 65%)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.025;
  background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(ellipse at center,black 25%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at center,black 25%,transparent 75%)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;width:100%}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--g);outline-offset:3px;border-radius:8px}
::selection{background:var(--g);color:#04121B}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}
svg{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}
svg[data-lg]{width:26px;height:26px}
.mono{font-family:'IBM Plex Mono',monospace;font-feature-settings:'lnum' 1,'tnum' 1}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-weight:700}
#app{display:none;position:relative;z-index:1}
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
@media(min-width:1024px){.shell{grid-template-columns:1fr var(--rail-w)}}
.rail{display:none;grid-column:2;position:sticky;top:0;height:100vh;
  flex-direction:column;padding:22px 14px;border-inline-start:1px solid var(--line);
  background:linear-gradient(180deg,rgba(10,14,23,.6) 0%,rgba(15,22,35,.9) 100%);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
@media(min-width:1024px){.rail{display:flex}}
.main{grid-column:1;min-width:0;
  padding-bottom:calc(var(--dock-h) + env(safe-area-inset-bottom) + 16px)}
@media(min-width:1024px){.main{padding-bottom:32px}}
.wrap{padding:16px;max-width:1120px;margin:0 auto}
@media(min-width:640px){.wrap{padding:24px 22px}}
.bar{position:sticky;top:0;z-index:40;height:var(--bar-h);display:flex;
  align-items:center;gap:10px;padding:0 16px;background:rgba(10,14,23,.78);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line)}
.bar-logo{display:flex;align-items:center;gap:10px;padding:6px 10px;
  border-radius:12px;transition:.16s;margin-inline-end:auto}
.bar-logo:hover{background:var(--s2)}
.bar-logo .txt{font-size:17px;font-weight:800;letter-spacing:-.02em}
.search-bar{display:none;flex:1;max-width:420px;position:relative}
@media(min-width:640px){.search-bar{display:block}}
.search-bar svg{position:absolute;inset-inline-start:14px;top:50%;
  transform:translateY(-50%);color:var(--tx-3);width:17px;height:17px;pointer-events:none}
.search-bar input{background:var(--s2);border:1px solid var(--line);border-radius:12px;
  padding:10px 42px 10px 14px;font-size:13.5px;color:var(--tx);transition:.18s}
.search-bar input::placeholder{color:var(--tx-3)}
.search-bar input:focus{outline:none;border-color:var(--g);background:var(--s3);
  box-shadow:0 0 0 3px var(--g-soft)}
.iconbtn{width:40px;height:40px;border-radius:12px;flex:none;display:grid;
  place-items:center;color:var(--tx-2);border:1px solid transparent;
  transition:.16s;position:relative}
.iconbtn:hover{background:var(--s2);color:var(--tx);border-color:var(--line)}
.iconbtn:active{transform:scale(.92)}
.cbadge{position:absolute;top:-3px;inset-inline-end:-3px;min-width:19px;height:19px;
  padding:0 5px;border-radius:99px;background:var(--g);color:#04121B;
  font-size:10.5px;font-weight:800;display:grid;place-items:center;
  box-shadow:0 0 0 2.5px var(--bg)}
.dock{position:fixed;inset:auto 0 0 0;z-index:50;display:grid;height:var(--dock-h);
  padding-bottom:env(safe-area-inset-bottom);background:rgba(10,14,23,.94);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line)}
@media(min-width:1024px){.dock{display:none}}
.dk{position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-size:10.5px;font-weight:700;
  color:var(--tx-3);transition:color .2s}
.dk .dkico{transition:transform .32s var(--spring)}
.dk::before{content:'';position:absolute;top:0;left:50%;width:26px;height:2.5px;
  border-radius:0 0 4px 4px;background:var(--g);transform:translateX(-50%) scaleX(0);
  transition:transform .32s var(--spring);box-shadow:0 0 12px var(--g-glow)}
.dk.on{color:var(--g)}
.dk.on::before{transform:translateX(-50%) scaleX(1)}
.dk.on .dkico{transform:translateY(-3px)}
.dk:active{transform:scale(.94)}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px;margin-bottom:22px}
.brand .en{font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.brand .ar{font-size:11px;color:var(--tx-3)}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;
  border-radius:11px;color:var(--tx-2);font-size:14px;font-weight:600;
  position:relative;margin-bottom:2px;transition:.16s}
.nav:hover{background:var(--s1);color:var(--tx)}
.nav.on{background:var(--s2);color:var(--tx)}
.nav.on::before{content:'';position:absolute;inset-inline-start:0;top:24%;bottom:24%;
  width:3px;border-radius:99px;background:var(--g);box-shadow:0 0 10px var(--g-glow)}
.nav.on svg{color:var(--g)}
.nav .cnt{margin-inline-start:auto;min-width:20px;height:20px;padding:0 6px;
  border-radius:99px;background:var(--g);color:#04121B;font-size:11px;
  font-weight:800;display:grid;place-items:center}
.rail-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
.h1{font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.2}
.h2{font-size:18px;font-weight:800;letter-spacing:-.025em;line-height:1.3}
.h3{font-size:15px;font-weight:700}
.sub{color:var(--tx-2);font-size:13.5px;line-height:1.6}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--tx-3);
  text-transform:uppercase}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--tx-2);margin-bottom:8px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;
  margin:26px 0 14px;gap:12px}
.sec-head:first-child{margin-top:0}
.more-link{color:var(--g);font-weight:700;font-size:13px;transition:.16s;
  display:inline-flex;align-items:center;gap:4px}
.more-link:hover{color:var(--g-3);gap:7px}
.card{background:linear-gradient(180deg,var(--s1) 0%,rgba(10,14,23,.6) 100%);
  border:1px solid var(--line);border-radius:14px;padding:18px;
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px -18px rgba(0,0,0,.7)}
.card-q{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:14px}
.hero{position:relative;border-radius:20px;overflow:hidden;margin-bottom:20px;
  box-shadow:0 20px 50px -22px rgba(0,0,0,.9),0 0 60px -30px rgba(16,185,129,.2)}
.hero-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none}
.hero-track::-webkit-scrollbar{display:none}
.hero-slide{position:relative;flex:0 0 100%;scroll-snap-align:center;
  aspect-ratio:2.35;background:var(--s2);min-height:200px}
.hero-slide img{width:100%;height:100%;object-fit:cover}
.hero-body{position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:center;gap:6px;padding:22px;
  background:linear-gradient(275deg,transparent 6%,rgba(5,8,15,.85) 58%)}
.hero-t{font-size:clamp(18px,4.5vw,26px);font-weight:800;letter-spacing:-.03em;line-height:1.2}
.hero-s{font-size:13.5px;color:var(--tx-2);max-width:420px;line-height:1.5}
.hero-cta{align-self:flex-start;margin-top:10px;padding:10px 20px;border-radius:99px;
  background:var(--g);color:#04121B;font-size:13px;font-weight:800;
  display:inline-flex;align-items:center;gap:6px;
  box-shadow:0 8px 20px -8px rgba(16,185,129,.5);transition:.18s var(--spring)}
.hero-cta:hover{transform:translateY(-2px);background:var(--g-3)}
.hero-dots{position:absolute;bottom:12px;inset-inline:0;display:flex;
  justify-content:center;gap:5px}
.hero-dots span{width:5px;height:5px;border-radius:99px;
  background:rgba(255,255,255,.32);transition:.28s var(--ease)}
.hero-dots span.on{width:18px;background:var(--g);box-shadow:0 0 10px var(--g-glow)}
.wallet-card{position:relative;overflow:hidden;border-radius:20px;padding:22px;
  margin-bottom:20px;border:1px solid var(--g-line);
  background:radial-gradient(120% 130% at 92% 0%,rgba(16,185,129,.18),transparent 62%),
    linear-gradient(160deg,#14202F 0%,#0D1420 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),
    0 20px 44px -22px rgba(0,0,0,.9),0 0 60px -30px rgba(16,185,129,.3)}
.wallet-card::after{content:'';position:absolute;inset-block:-30%;
  inset-inline-end:-12%;width:46%;background:var(--g);opacity:.09;
  clip-path:polygon(0 0,100% 22%,46% 50%,100% 78%,0 100%)}
.wallet-card > *{position:relative;z-index:2}
.wallet-top{display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:16px}
.wallet-ico{width:42px;height:42px;border-radius:13px;display:grid;
  place-items:center;background:var(--g-soft);color:var(--g)}
.wallet-bal{font-size:clamp(28px,8vw,34px);font-weight:800;letter-spacing:-.04em;
  line-height:1.05;font-variant-numeric:tabular-nums}
.wallet-sub{color:var(--tx-2);font-size:12.5px;margin-top:6px}
.wacts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:18px}
.wact{display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:11px 4px;border-radius:12px;font-size:10.5px;font-weight:700;
  color:var(--tx-2);transition:.16s}
.wact-i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:var(--s3);color:var(--tx-2);transition:.18s var(--spring)}
.wact:hover{color:var(--tx)}
.wact:hover .wact-i{background:var(--g-soft);color:var(--g);transform:translateY(-2px)}
.wact:active{transform:scale(.94)}
.wact.pri .wact-i{background:var(--g);color:#04121B}
.wact.off{opacity:.4;pointer-events:none}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:20px}
@media(min-width:640px){.quick{grid-template-columns:repeat(4,1fr)}}
.qbtn{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;
  border:1px solid var(--line);background:var(--s1);text-align:start;
  transition:.18s var(--spring)}
.qbtn:hover{border-color:var(--g);background:var(--s2);transform:translateY(-3px);
  box-shadow:0 12px 24px -14px rgba(16,185,129,.4)}
.qbtn:active{transform:translateY(0) scale(.98)}
.qbtn .qi{width:40px;height:40px;border-radius:12px;flex:none;display:grid;
  place-items:center;background:var(--s3);color:var(--tx-2);transition:.18s}
.qbtn:hover .qi{background:var(--g-soft);color:var(--g)}
.qbtn.pri .qi{background:var(--g);color:#04121B}
.qbtn .qt{font-size:13.5px;font-weight:700;display:block;line-height:1.3}
.qbtn .qs{font-size:11px;color:var(--tx-3);display:block;line-height:1.3;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;
  border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--g-soft);color:var(--g)}
.chip.wait{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.off{background:var(--s3);color:var(--tx-3)}
.cats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
@media(max-width:400px){.cats-grid{grid-template-columns:repeat(2,1fr)}}
.cat{position:relative;display:flex;flex-direction:column;align-items:center;
  gap:8px;padding:16px 8px;border-radius:14px;border:1px solid var(--line);
  background:var(--s1);transition:.18s var(--spring);overflow:hidden;text-align:center}
.cat:hover{border-color:var(--g);background:var(--s2);transform:translateY(-3px);
  box-shadow:0 12px 24px -14px rgba(16,185,129,.4)}
.cat:active{transform:translateY(0) scale(.97)}
.cat.soon{opacity:.55}
.cat.soon:hover{border-color:var(--line);transform:none}
.cat-i{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  background:var(--s3);color:var(--g);overflow:hidden;flex:none;transition:.18s}
.cat:hover .cat-i{background:var(--g-soft)}
.cat-i img{width:100%;height:100%;object-fit:cover}
.cat-i svg{width:22px;height:22px}
.cat-n{font-size:12.5px;font-weight:700;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cat-s{font-size:10px;color:var(--tx-3);line-height:1.3}
.soon-tag{position:absolute;top:7px;inset-inline-start:7px;z-index:3;font-size:9px;
  font-weight:800;padding:2px 7px;border-radius:99px;background:var(--g);color:#04121B}
.cats-rail{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 8px;
  margin:0 -16px;scroll-snap-type:x proximity;scrollbar-width:none}
.cats-rail::-webkit-scrollbar{display:none}
.cats-rail > *{flex:0 0 108px;scroll-snap-align:start}
.cats-big{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.cats-big{grid-template-columns:repeat(3,1fr)}}
.cat.big{padding:20px 12px;gap:12px}
.cat.big .cat-i{width:68px;height:68px;border-radius:18px}
.cat.big .cat-i svg{width:30px;height:30px}
.cat.big .cat-n{font-size:15px}
.cat.big .cat-s{font-size:11px}
.plist{display:flex;flex-direction:column;gap:9px}
.prod{position:relative;display:flex;align-items:center;gap:12px;width:100%;
  padding:12px;border-radius:14px;border:1px solid var(--line);
  background:var(--s1);text-align:start;transition:.18s var(--spring)}
.prod:hover{border-color:var(--g);background:var(--s2);transform:translateY(-2px);
  box-shadow:0 12px 24px -14px rgba(16,185,129,.35)}
.prod:active{transform:translateY(0) scale(.99)}
.prod.out{opacity:.5}
.prod-i{width:56px;height:56px;border-radius:13px;flex:none;overflow:hidden;
  display:grid;place-items:center;background:var(--s3);color:var(--tx-3)}
.prod-i img{width:100%;height:100%;object-fit:cover}
.prod-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prod-n{font-size:14px;font-weight:700;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.prod-s{font-size:11px;color:var(--tx-3)}
.prod-prow{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.prod-p{font-size:15.5px;color:var(--g);font-weight:800}
.prod-old{font-size:12px;color:var(--tx-3);text-decoration:line-through}
.perday{font-size:11px;color:var(--tx-3)}
.off-badge{position:absolute;top:8px;inset-inline-start:8px;padding:2px 8px;
  border-radius:99px;font-size:10px;font-weight:800;background:var(--bad);
  color:#fff;z-index:3}
.prod-a{width:36px;height:36px;border-radius:12px;flex:none;display:grid;
  place-items:center;background:var(--g-soft);color:var(--g);transition:.18s}
.prod:hover .prod-a{background:var(--g);color:#04121B}
.prod-a svg{width:17px;height:17px}
@media(min-width:700px){.plist.grid{display:grid;
  grid-template-columns:repeat(2,1fr);gap:11px}}
@media(min-width:1000px){.plist.grid{grid-template-columns:repeat(3,1fr)}}
.search{position:relative;margin-bottom:14px}
.search svg{position:absolute;inset-inline-start:14px;top:50%;
  transform:translateY(-50%);color:var(--tx-3);width:17px;height:17px;
  pointer-events:none}
.search input{background:var(--s1);border:1px solid var(--line);border-radius:12px;
  padding:12px 42px 12px 14px;font-size:14px;color:var(--tx);transition:.18s}
.search input::placeholder{color:var(--tx-3)}
.search input:focus{outline:none;border-color:var(--g);background:var(--s2);
  box-shadow:0 0 0 3px var(--g-soft)}
.pills{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;
  scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:9px 15px;border-radius:99px;font-size:12.5px;font-weight:700;
  border:1px solid var(--line);background:var(--s1);color:var(--tx-2);transition:.16s}
.pill:hover{border-color:var(--line-2);color:var(--tx)}
.pill.on{background:var(--g);border-color:var(--g);color:#04121B;
  box-shadow:0 4px 12px -4px rgba(16,185,129,.4)}
.pill:active{transform:scale(.96)}
.citem{display:flex;gap:12px;padding:12px;border-radius:13px;
  border:1px solid var(--line);background:var(--s1)}
.citem-i{width:58px;height:58px;border-radius:13px;flex:none;overflow:hidden;
  display:grid;place-items:center;background:var(--s3);color:var(--tx-3)}
.citem-i img{width:100%;height:100%;object-fit:cover}
.citem-n{font-size:14px;font-weight:700;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.citem-q{display:inline-flex;align-items:center;gap:2px;margin-top:8px;
  border:1px solid var(--line-2);border-radius:9px;background:var(--s2)}
.citem-q button{width:30px;height:30px;display:grid;place-items:center;
  font-size:16px;color:var(--tx-2);transition:.15s}
.citem-q button:hover{background:var(--s3);color:var(--tx)}
.citem-q .num{min-width:28px;text-align:center;font-size:13.5px}
.citem-x{width:32px;height:32px;border-radius:9px;margin-top:8px;display:grid;
  place-items:center;color:var(--tx-3);transition:.16s}
.citem-x:hover{background:var(--bad-soft);color:var(--bad)}
.inp{background:var(--s2);border:1.5px solid var(--line-2);border-radius:12px;
  padding:13px;color:var(--tx);font-size:15px;transition:.16s;font-family:inherit}
.inp::placeholder{color:var(--tx-3)}
.inp:hover:not(:focus){border-color:var(--tx-3)}
.inp:focus{outline:none;border-color:var(--g);background:var(--s3);
  box-shadow:0 0 0 3px var(--g-soft)}
.inp.bad{border-color:var(--bad)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx-2) 50%),linear-gradient(135deg,var(--tx-2) 50%,transparent 50%);
  background-position:14px 21px,20px 21px;background-size:6px 6px;
  background-repeat:no-repeat}
textarea.inp{resize:vertical;line-height:1.65;font-family:inherit}
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.amt{padding:14px 4px;border:1.5px solid var(--line-2);border-radius:12px;
  background:var(--s2);font-weight:800;font-size:15px;text-align:center;
  transition:.16s var(--spring);font-variant-numeric:tabular-nums}
.amt:hover{border-color:var(--tx-3);transform:translateY(-2px)}
.amt:active{transform:translateY(0) scale(.96)}
.amt.on{border-color:var(--g);background:var(--g-soft);color:var(--g);
  box-shadow:0 0 0 3px var(--g-soft)}
.qty{display:flex;align-items:center;border:1px solid var(--line-2);
  border-radius:12px;overflow:hidden;flex:none;background:var(--s2)}
.qty .num{min-width:46px;text-align:center;font-size:16px}
.qty button{width:42px;height:44px;display:grid;place-items:center;font-size:19px;
  color:var(--tx-2);transition:.15s}
.qty button:hover{background:var(--s3);color:var(--tx)}
.qty button:active{transform:scale(.9)}
.binpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:9px}
.binopt{display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:14px 8px;border-radius:12px;border:1.5px solid var(--line-2);
  background:var(--s2);transition:.16s var(--spring)}
.binopt:hover{border-color:var(--tx-3);transform:translateY(-2px)}
.binopt.on{border-color:var(--g);background:var(--g-soft);
  box-shadow:0 0 0 3px var(--g-soft)}
.binflag{font-size:22px;line-height:1}
.binname{font-size:12px;font-weight:700}
.binnum{font-size:10px;color:var(--tx-3);font-family:'IBM Plex Mono',monospace}
.list{border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:var(--s1)}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;
  border-bottom:1px solid var(--line);transition:background .15s}
.row:last-child{border-bottom:none}
.row:hover{background:var(--s2)}
.row-i{width:40px;height:40px;border-radius:12px;flex:none;display:grid;
  place-items:center;background:var(--s3);color:var(--tx-2);overflow:hidden}
.row-i img{width:100%;height:100%;object-fit:cover}
.row-b{flex:1;min-width:0}
.row-t{font-size:13.5px;font-weight:700;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row-s{font-size:11.5px;color:var(--tx-3)}
.row-v{text-align:start;flex:none}
.row-a{font-size:14.5px;font-weight:800}
.row-a.in{color:var(--g)}
.menu{display:flex;flex-direction:column;gap:3px}
.mrow{display:flex;align-items:center;gap:13px;width:100%;padding:14px;
  border-radius:12px;text-align:start;transition:.16s}
.mrow:hover{background:var(--s2)}
.mrow:active{transform:scale(.99)}
.mrow-i{width:38px;height:38px;border-radius:11px;flex:none;display:grid;
  place-items:center;background:var(--s2);color:var(--tx-2);transition:.18s}
.mrow:hover .mrow-i{background:var(--g-soft);color:var(--g)}
.mrow-t{flex:1;font-size:14px;font-weight:700}
.mrow-x{color:var(--tx-3)}
.mrow.danger .mrow-i{color:var(--bad)}
.mrow.danger .mrow-t{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);
  border-radius:14px;overflow:hidden;background:var(--s1)}
.stat{padding:16px 12px;border-inline-end:1px solid var(--line);min-width:0}
.stat:last-child{border-inline-end:none}
.stat .v{font-size:20px;font-weight:800;letter-spacing:-.03em}
.stat .k{font-size:10.5px;color:var(--tx-3);margin-top:3px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.quote{background:var(--s2);border:1px solid var(--line);border-radius:12px;
  padding:14px;margin-top:14px}
.qrow{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px}
.qrow .k{color:var(--tx-2)}
.qrow.tot{border-top:1px dashed var(--line-2);margin-top:8px;padding-top:12px;
  font-weight:800;font-size:16px}
.cprow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;padding:14px;border-radius:13px;text-align:start;background:var(--s2);
  border:1px solid var(--line);transition:.16s}
.cprow:hover{border-color:var(--g);background:var(--s3);transform:translateY(-1px)}
.cprow:active{transform:translateY(0) scale(.99)}
.cpk{font-size:11.5px;color:var(--tx-3);margin-bottom:3px}
.cpv{font-size:14px;font-weight:700;word-break:break-all;line-height:1.45}
.cpi{width:38px;height:38px;border-radius:11px;flex:none;display:grid;
  place-items:center;background:var(--s3);color:var(--tx-2);transition:.18s}
.cprow:hover .cpi{background:var(--g);color:#04121B}
.vcard{position:relative;aspect-ratio:1.586;border-radius:18px;overflow:hidden;
  padding:18px;display:flex;flex-direction:column;
  background:linear-gradient(102deg,rgba(255,255,255,.04) 0%,transparent 20%,transparent 80%,rgba(255,255,255,.03) 100%),
    linear-gradient(158deg,#1A2740 0%,#101A2C 46%,#080D17 100%);
  border:1px solid rgba(255,255,255,.09);transform-style:preserve-3d;
  backface-visibility:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,
    0 12px 26px -12px rgba(0,0,0,.75),0 0 50px -24px rgba(16,185,129,.3);
  transition:transform .45s var(--ease),box-shadow .45s var(--ease);cursor:pointer}
.vcard::after{content:'';position:absolute;inset-block:-18%;inset-inline-start:-10%;
  width:56%;background:var(--g);opacity:.15;
  clip-path:polygon(0 0,100% 22%,46% 50%,100% 78%,0 100%)}
.vcard::before{content:'';position:absolute;inset:-40%;z-index:3;pointer-events:none;
  background:linear-gradient(108deg,transparent 43%,rgba(255,255,255,.14) 50%,transparent 57%);
  transform:translateX(-120%);transition:transform .9s var(--ease)}
.vcard:hover{transform:translateY(-6px);
  box-shadow:0 1px 0 rgba(255,255,255,.09) inset,0 22px 44px -18px rgba(0,0,0,.9),
    0 0 80px -22px rgba(16,185,129,.45)}
.vcard:hover::before{transform:translateX(120%)}
.vcard.tilt{transform:perspective(900px) rotateX(var(--rx,0)) rotateY(var(--ry,0)) translateY(-4px);
  transition:transform .12s linear}
.vcard.frozen{background:linear-gradient(158deg,#22304A,#161F2E)}
.vcard.dead{opacity:.5;filter:saturate(.35)}
.vcard > *{position:relative;z-index:2}
.vc-top{display:flex;justify-content:space-between;align-items:flex-start}
.vc-wm{font-size:14px;font-weight:800;letter-spacing:-.02em}
.vc-chip{width:34px;height:26px;border-radius:5px;margin:auto 0 12px;
  background:linear-gradient(115deg,#F0F4F3,#B9C8C7 22%,#E8EEED 40%,#9FB2B1 62%,#DDE5E4 80%,#A8BAB9);
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.22)}
.vc-pan{font-size:14.5px;letter-spacing:.11em;color:#DCE5F2}
.vc-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px}
.vc-thru{font-size:8px;letter-spacing:.14em;color:var(--tx-3);margin-bottom:3px}
.vc-amt{font-size:20px;font-weight:800;letter-spacing:-.03em}
.crail{display:flex;gap:14px;overflow-x:auto;padding:2px 16px 8px;margin:0 -16px;
  scroll-snap-type:x mandatory;scrollbar-width:none}
.crail::-webkit-scrollbar{display:none}
.crail > *{flex:0 0 min(76vw,280px);scroll-snap-align:start}
@media(min-width:700px){.crail{display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));overflow:visible;
  margin:0;padding:0}.crail > *{flex:none}}
.cdcard{border:1px solid var(--g-line);border-radius:14px;padding:16px;
  margin-bottom:16px;
  background:linear-gradient(160deg,rgba(16,185,129,.09),rgba(16,185,129,.02))}
.cdtop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.cddays{font-size:32px;font-weight:800;letter-spacing:-.04em;line-height:1;
  color:var(--g);font-variant-numeric:tabular-nums}
.cddays span{font-size:14px;font-weight:700;color:var(--tx-2);margin-inline-start:5px}
.cdicon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--g-soft);color:var(--g)}
.cdbar{height:5px;border-radius:99px;background:var(--s3);overflow:hidden}
.cdbar i{display:block;height:100%;border-radius:99px;background:var(--g);
  box-shadow:0 0 10px var(--g-glow);transition:width .6s var(--ease)}
.cdrow{display:flex;justify-content:space-between;font-size:11.5px;
  color:var(--tx-3);margin-top:8px}
.cdcalc{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:12px;
  padding-top:12px;border-top:1px dashed var(--line-2);font-size:12.5px;
  color:var(--tx-2)}
.cdcalc .num{font-size:14.5px;color:var(--tx)}
.ov{position:fixed;inset:0;z-index:120;background:rgba(4,7,13,.72);display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px)}
.ov.show{display:flex;animation:ovIn .25s var(--ease)}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.ov.closing{animation:ovOut .22s var(--ease) forwards}
@keyframes ovOut{to{opacity:0}}
@media(min-width:640px){.ov{align-items:center}}
.sheet{background:var(--s1);border:1px solid var(--line);border-bottom:none;
  width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:22px;
  max-height:92vh;overflow-y:auto;
  box-shadow:0 -10px 44px -14px rgba(0,0,0,.9);animation:sheetUp .4s var(--ease)}
@keyframes sheetUp{from{transform:translateY(100%);opacity:.4}to{transform:none;opacity:1}}
@media(min-width:640px){.sheet{border-radius:20px;border-bottom:1px solid var(--line)}}
.sheet::before{content:'';display:block;width:38px;height:4px;border-radius:99px;
  background:var(--line-2);margin:-6px auto 16px}
@media(min-width:640px){.sheet::before{display:none}}
.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;
  padding-bottom:14px;border-bottom:1px solid var(--line)}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;gap:8px;width:min(92vw,400px);pointer-events:none}
.toast{background:var(--s3);border:1px solid var(--line-2);padding:13px 15px;
  border-radius:12px;font-size:13.5px;font-weight:600;display:flex;gap:10px;
  align-items:flex-start;box-shadow:0 16px 38px -14px rgba(0,0,0,.9);
  animation:tin .3s var(--spring);pointer-events:auto}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.toast.ok{border-color:var(--g-line);background:linear-gradient(180deg,#122e24,#0d1f18)}
.toast.ok svg{color:var(--g)}
.toast.bad{border-color:rgba(239,95,95,.4);background:linear-gradient(180deg,#2a1517,#1c0e10)}
.toast.bad svg{color:var(--bad)}
.toast svg{width:18px;height:18px;flex:none;margin-top:2px}
.sk{background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 37%,var(--s2) 63%);
  background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.empty{text-align:center;padding:46px 20px;color:var(--tx-2)}
.empty .ei{width:64px;height:64px;border-radius:18px;margin:0 auto 16px;
  display:grid;place-items:center;background:var(--s2);color:var(--tx-3)}
.empty .ei svg{width:28px;height:28px}
.empty .et{font-weight:800;color:var(--tx);font-size:15px;margin-bottom:6px}
.empty p{font-size:13.5px;line-height:1.55}
.note{background:var(--warn-soft);border:1px solid rgba(224,160,48,.24);
  color:#F0C878;padding:12px 14px;border-radius:12px;font-size:13px;
  line-height:1.55;margin-bottom:14px}
.note.bad{background:var(--bad-soft);border-color:rgba(239,95,95,.28);color:#F5A0A0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border-radius:12px;font-weight:800;font-size:14px;
  background:linear-gradient(135deg,var(--g) 0%,var(--g-2) 100%);color:#04121B;
  box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 8px 18px -8px rgba(16,185,129,.55);
  transition:transform .18s var(--spring),box-shadow .18s,background .16s;
  position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.3) 50%,transparent 60%);
  transform:translateX(-100%);transition:transform .7s var(--ease)}
.btn:hover:not(:disabled){transform:translateY(-2px);
  box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 14px 30px -10px rgba(16,185,129,.65)}
.btn:hover:not(:disabled)::before{transform:translateX(100%)}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.42;cursor:not-allowed;background:var(--s3);
  color:var(--tx-3);box-shadow:none}
.btn svg{width:17px;height:17px}
.btn.line{background:transparent;border:1px solid var(--line-2);color:var(--tx);
  box-shadow:none}
.btn.line:hover:not(:disabled){background:var(--s2);border-color:var(--tx-3);
  box-shadow:0 8px 20px -12px rgba(0,0,0,.5)}
.btn.ghost{background:var(--s2);color:var(--tx);box-shadow:none}
.btn.ghost:hover:not(:disabled){background:var(--s3)}
.btn.risk{background:transparent;border:1px solid rgba(239,95,95,.35);
  color:var(--bad);box-shadow:none}
.btn.risk:hover:not(:disabled){background:var(--bad-soft)}
.btn.wide{width:100%}
.btn.sm{padding:9px 14px;font-size:12.5px;border-radius:10px}
.btn.sm svg{width:15px;height:15px}
.btn.lg{padding:15px 22px;font-size:15.5px;border-radius:14px}
.steps{display:flex;align-items:center;gap:7px;margin-bottom:22px}
.sdot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:800;background:var(--s3);color:var(--tx-3);
  flex:none;transition:.25s var(--spring)}
.sdot.on{background:var(--g);color:#04121B;box-shadow:0 0 20px var(--g-glow);
  transform:scale(1.1)}
.sdot.done{background:var(--g-soft);color:var(--g)}
.sline{height:2px;flex:1;background:var(--line-2);border-radius:2px;transition:.3s}
.sline.on{background:var(--g);box-shadow:0 0 8px var(--g-glow)}
@keyframes riseIn{from{opacity:0;transform:translate3d(0,14px,0) scale(.99)}
  to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translate3d(-14px,0,0)}
  to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:.75;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
@keyframes successPop{0%{transform:scale(.5) rotate(-10deg);opacity:0}
  60%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.loading{color:transparent!important;pointer-events:none}
.btn.loading::after{content:'';position:absolute;width:18px;height:18px;
  border:2.5px solid rgba(4,18,27,.3);border-top-color:#04121B;border-radius:50%;
  animation:spin .7s linear infinite}
.wrap.anim > *{animation:riseIn .45s var(--ease) backwards}
.wrap.anim > *:nth-child(2){animation-delay:.05s}
.wrap.anim > *:nth-child(3){animation-delay:.1s}
.wrap.anim > *:nth-child(4){animation-delay:.14s}
.wrap.anim > *:nth-child(n+5){animation-delay:.17s}
.cats-grid .cat:nth-child(2){animation-delay:.05s}
.cats-grid .cat:nth-child(3){animation-delay:.1s}
.cats-grid .cat:nth-child(4){animation-delay:.15s}
.plist .prod:nth-child(2){animation-delay:.05s}
.plist .prod:nth-child(3){animation-delay:.09s}
.plist .prod:nth-child(n+4){animation-delay:.12s}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;
    animation-iteration-count:1!important;transition-duration:.01ms!important}
  .vcard::before,.btn::before{display:none}}
.hidden{display:none!important}
.kill{text-align:center;padding:60px 20px;animation:riseIn .5s var(--ease)}
.kill-ic{width:80px;height:80px;border-radius:24px;margin:0 auto 20px;
  display:grid;place-items:center;background:var(--bad-soft);color:var(--bad);
  animation:pulse 2s ease-in-out infinite}
</style>
</head>
<body>

<div id="app">
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <span id="railMark"></span>
      <div><div class="en">Kardo</div><div class="ar">كاردو</div></div>
    </div>
    <nav id="navRail"></nav>
    <div class="rail-foot">
      <div style="display:flex;align-items:center;gap:11px;padding:0 4px 14px">
        <div id="av" style="width:38px;height:38px;border-radius:12px;flex:none;
             background:var(--g-soft);color:var(--g);display:grid;
             place-items:center;font-weight:800;font-size:15px"></div>
        <div style="min-width:0;flex:1">
          <div id="railName" style="font-size:13px;font-weight:700;overflow:hidden;
               text-overflow:ellipsis;white-space:nowrap"></div>
          <div id="railBal" class="num" style="font-size:12.5px;color:var(--g)"></div>
        </div>
      </div>
      <button class="nav" id="railOut"></button>
    </div>
  </aside>

  <div class="main">
    <header class="bar">
      <button class="bar-logo" id="homeBtn" aria-label="الرئيسية">
        <span id="barMark"></span>
        <span class="txt">كاردو</span>
      </button>
      <div class="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><path d="M20.5 20.5 16.5 16.5"/>
        </svg>
        <input type="text" id="topSearch" placeholder="ابحث عن منتج أو خدمة…"
               autocomplete="off">
      </div>
      <button class="iconbtn" id="notifBtn" aria-label="الإشعارات">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5"/>
          <path d="M13.7 20a2 2 0 0 1-3.4 0"/>
        </svg>
        <span class="cbadge" id="notifBadge" hidden>0</span>
      </button>
      <button class="iconbtn" id="cartBtn" aria-label="السلة">
        <span id="cartIco"></span>
        <span class="cbadge" id="cartBadge" hidden>0</span>
      </button>
    </header>
    <main class="wrap" id="view"></main>
  </div>
</div>
<nav class="dock" id="navDock"></nav>
</div>

<div id="toasts"></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script type="module" src="index.js"></script>
</body>
</html>
