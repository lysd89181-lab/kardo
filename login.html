<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020617">
<meta name="description" content="كاردو — بطاقتك الرقمية الأولى في ليبيا">
<title>كاردو — تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --navy:#0F172A;--bg:#020617;--s1:#0D1421;--s2:#131C2C;--s3:#1A2436;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);
  --tx:#F8FAFC;--tx-2:#94A3B8;--tx-3:#5F6E88;
  --g:#10B981;--g-2:#0E9E70;--g-3:#34D399;
  --g-soft:rgba(16,185,129,.10);--g-line:rgba(16,185,129,.30);--g-glow:rgba(16,185,129,.35);
  --bad:#EF5F5F;--bad-soft:rgba(239,95,95,.10);--bad-line:rgba(239,95,95,.30);
  --spring:cubic-bezier(.34,1.4,.44,1);
  --ease:cubic-bezier(.22,1,.36,1);
  --swift:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Tajawal','IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  font-feature-settings:'lnum' 1,'tnum' 1;
  background:var(--bg);color:var(--tx);
  font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:20px;position:relative;overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(70vw 55vh at 88% -8%, rgba(16,185,129,.14), transparent 60%),
    radial-gradient(60vw 45vh at -8% 4%, rgba(52,211,153,.07), transparent 58%),
    radial-gradient(80vw 60vh at 50% 115%, rgba(16,185,129,.06), transparent 65%);
  animation:ambient 20s ease-in-out infinite alternate;
}
@keyframes ambient{0%{opacity:.85;transform:scale(1)}100%{opacity:1;transform:scale(1.05)}}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.03;
  background-image:linear-gradient(rgba(255,255,255,.7) 1px,transparent 1px),linear-gradient(90deg, rgba(255,255,255,.7) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse at center, black 20%, transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at center, black 20%, transparent 75%);
}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
.orb-1{width:400px;height:400px;background:radial-gradient(circle,var(--g) 0%,transparent 70%);top:-10%;right:-10%;opacity:.10;animation:float 22s ease-in-out infinite}
.orb-2{width:320px;height:320px;background:radial-gradient(circle,var(--g-3) 0%,transparent 70%);bottom:-10%;left:-8%;opacity:.07;animation:float 26s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,40px) scale(1.08)}}
.shell{position:relative;z-index:1;width:100%;max-width:430px;display:flex;flex-direction:column;gap:28px;animation:shellIn .7s var(--ease) backwards}
@keyframes shellIn{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.brand{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.brand-mark{animation:markFloat 4.5s ease-in-out infinite;filter:drop-shadow(0 10px 30px rgba(16,185,129,.32))}
@keyframes markFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.brand-en{font-size:26px;font-weight:800;letter-spacing:-.04em;background:linear-gradient(135deg,var(--tx) 0%,var(--tx-2) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-top:-6px}
.brand-ar{font-size:14px;color:var(--tx-3);font-weight:500}
.card{background:linear-gradient(180deg,rgba(13,20,33,.95) 0%,rgba(2,6,23,.92) 100%);border:1px solid var(--line);border-radius:24px;padding:28px 26px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 30px 80px -30px rgba(0,0,0,.9),0 0 100px -50px rgba(16,185,129,.28);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);animation:cardIn .85s var(--ease) .2s backwards;position:relative;overflow:hidden}
@keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.tabs{display:flex;gap:4px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:24px;position:relative}
.tab{flex:1;padding:11px 12px;font-size:13.5px;font-weight:700;color:var(--tx-3);border-radius:10px;transition:color .22s;position:relative;z-index:1;text-align:center;font-family:inherit}
.tab.on{color:var(--tx)}
.tab::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,var(--s3) 0%,var(--s2) 100%);border-radius:10px;opacity:0;transform:scale(.92);transition:opacity .25s var(--ease),transform .3s var(--spring);z-index:-1;box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 6px 16px -8px rgba(0,0,0,.5)}
.tab.on::before{opacity:1;transform:scale(1)}
.view{display:none}
.view.on{display:block}
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:9px}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--tx-2)}
.lbl a{color:var(--g);font-weight:600;font-size:12px;transition:color .18s}
.lbl a:hover{color:var(--g-3)}
.inp-wrap{position:relative}
.inp-wrap .lead{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--tx-3);pointer-events:none;width:18px;height:18px;transition:color .2s}
.inp-wrap .trail{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--tx-3);transition:.18s var(--swift);background:transparent;border:none;cursor:pointer}
.inp-wrap .trail:hover{background:var(--s3);color:var(--tx)}
.inp{background:var(--s1);border:1.5px solid var(--line);border-radius:12px;padding:13px 46px 13px 14px;color:var(--tx);font-size:15px;transition:border-color .2s,background .2s,box-shadow .2s;font-family:inherit;width:100%}
.inp::placeholder{color:var(--tx-3)}
.inp:hover:not(:focus){border-color:var(--line-2)}
.inp:focus{outline:none;border-color:var(--g);background:var(--s2);box-shadow:0 0 0 4px var(--g-soft)}
.inp-wrap:focus-within .lead{color:var(--g)}
.pw-strength{display:flex;gap:3px;margin-top:6px;height:3px;opacity:0;transition:opacity .3s}
.pw-strength.show{opacity:1}
.pw-strength span{flex:1;height:100%;border-radius:99px;background:var(--s3);transition:background .3s}
.pw-strength[data-level="1"] span:nth-child(1){background:var(--bad)}
.pw-strength[data-level="2"] span:nth-child(-n+2){background:#F59E0B}
.pw-strength[data-level="3"] span:nth-child(-n+3){background:#EAB308}
.pw-strength[data-level="4"] span{background:var(--g)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:15px 22px;border-radius:13px;font-weight:800;font-size:15px;font-family:inherit;transition:transform .18s var(--spring),box-shadow .2s,background .2s;background:linear-gradient(135deg,var(--g) 0%,var(--g-2) 100%);color:#04121B;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 10px 26px -10px var(--g-glow);position:relative;overflow:hidden;cursor:pointer;border:none;width:100%}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);transition:transform .8s var(--ease);pointer-events:none}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:hover:not(:disabled)::before{transform:translateX(120%)}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed;background:var(--s3);color:var(--tx-3);box-shadow:none}
.btn svg{width:18px;height:18px;flex:none}
.btn.loading{color:transparent;pointer-events:none}
.btn.loading::after{content:'';position:absolute;width:20px;height:20px;border:2.5px solid rgba(4,18,27,.25);border-top-color:#04121B;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.line{background:transparent;color:var(--tx-2);border:1px solid var(--line);box-shadow:none}
.btn.line:hover:not(:disabled){background:var(--s2);border-color:var(--line-2);color:var(--tx)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:13px 15px;border-radius:12px;font-size:13px;line-height:1.55;animation:alertIn .35s var(--spring);border:1px solid var(--bad-line);background:var(--bad-soft);color:#F5A0A0}
.alert svg{width:18px;height:18px;flex:none;margin-top:1px}
@keyframes alertIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.hidden{display:none!important}
.success{text-align:center;padding:20px 8px;animation:successIn .5s var(--spring)}
@keyframes successIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.success-ic{width:76px;height:76px;border-radius:22px;margin:0 auto 18px;display:grid;place-items:center;background:var(--g-soft);color:var(--g);animation:successPop .7s var(--spring)}
.success-ic svg{width:36px;height:36px;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s var(--ease) .25s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes successPop{0%{transform:scale(.4) rotate(-12deg);opacity:0}60%{transform:scale(1.15) rotate(4deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.success h2{font-size:21px;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.success p{color:var(--tx-2);font-size:13.5px;margin-bottom:22px;line-height:1.7}
.foot{text-align:center;color:var(--tx-3);font-size:12px;padding-top:6px;line-height:1.7}
.foot a{color:var(--tx-2);font-weight:600;transition:color .18s}
.foot a:hover{color:var(--g)}
#toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:min(92vw,400px);pointer-events:none}
.toast{background:var(--s3);border:1px solid var(--line-2);padding:13px 15px;border-radius:12px;font-size:13.5px;font-weight:600;display:flex;gap:10px;align-items:flex-start;box-shadow:0 20px 44px -16px rgba(0,0,0,.9);animation:toastIn .35s var(--spring);pointer-events:auto;backdrop-filter:blur(16px)}
.toast.ok{border-color:var(--g-line);background:linear-gradient(180deg,rgba(16,185,129,.15),rgba(13,20,33,.95))}
.toast.ok svg{color:var(--g)}
.toast.bad{border-color:var(--bad-line);background:linear-gradient(180deg,rgba(239,95,95,.15),rgba(13,20,33,.95))}
.toast.bad svg{color:var(--bad)}
.toast svg{width:18px;height:18px;flex:none;margin-top:1px}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="shell">
  <div class="brand">
    <svg class="brand-mark" width="72" height="72" viewBox="0 0 40 40">
      <defs><linearGradient id="kg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#34D399"/></linearGradient></defs>
      <rect width="40" height="40" rx="11" fill="#0D1421"/>
      <rect x="0.5" y="0.5" width="39" height="39" rx="10.5" fill="none" stroke="rgba(16,185,129,.28)"/>
      <path d="M11 9h4.4v22H11z" fill="url(#kg)"/>
      <path d="M17 20.2 27.5 9H33L22.4 20.2 33 31h-5.6z" fill="url(#kg)"/>
      <rect x="19" y="15.6" width="12.4" height="8.8" rx="2.2" fill="#F8FAFC" opacity=".95"/>
      <rect x="21" y="18.4" width="3.4" height="2.6" rx=".7" fill="#0D1421" opacity=".6"/>
    </svg>
    <div class="brand-en">KARDO</div>
    <div class="brand-ar">بطاقتك الرقمية الأولى في ليبيا</div>
  </div>

  <div class="card">
    <div class="tabs" role="tablist">
      <button class="tab on" data-view="login" type="button">دخول</button>
      <button class="tab" data-view="register" type="button">حساب جديد</button>
    </div>

    <div class="view on" id="vLogin">
      <form class="form on" id="fLogin" autocomplete="on">
        <div class="field">
          <label class="lbl" for="liEmail">البريد الإلكتروني</label>
          <div class="inp-wrap">
            <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3 8 9 6 9-6"/></svg>
            <input class="inp" id="liEmail" type="email" dir="ltr" placeholder="name@example.com" autocomplete="email" required>
          </div>
        </div>
        <div class="field">
          <div class="lbl"><label for="liPass">كلمة المرور</label><a href="#" id="forgotLink">نسيت كلمة المرور؟</a></div>
          <div class="inp-wrap">
            <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input class="inp" id="liPass" type="password" dir="ltr" placeholder="••••••••" autocomplete="current-password" required>
            <button class="trail" type="button" data-eye="liPass"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <div class="alert hidden" id="liErr"></div>
        <button class="btn" type="submit" id="liGo">دخول</button>
      </form>
    </div>

    <div class="view" id="vRegister">
      <form class="form" id="fRegister" autocomplete="on">
        <div class="field">
          <label class="lbl" for="rgName">الاسم الكامل</label>
          <div class="inp-wrap">
            <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>
            <input class="inp" id="rgName" placeholder="محمد أحمد" autocomplete="name" required maxlength="60">
          </div>
        </div>
        <div class="field">
          <label class="lbl" for="rgEmail">البريد الإلكتروني</label>
          <div class="inp-wrap">
            <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3 8 9 6 9-6"/></svg>
            <input class="inp" id="rgEmail" type="email" dir="ltr" placeholder="name@example.com" autocomplete="email" required>
          </div>
        </div>
        <div class="field">
          <label class="lbl" for="rgPhone">رقم الهاتف</label>
          <div class="inp-wrap">
            <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>
            <input class="inp" id="rgPhone" type="tel" dir="ltr" placeholder="0912345678" inputmode="numeric" autocomplete="tel" required maxlength="13">
          </div>
        </div>
        <div class="field">
          <label class="lbl" for="rgPass">كلمة المرور</label>
          <div class="inp-wrap">
            <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input class="inp" id="rgPass" type="password" dir="ltr" placeholder="8 أحرف على الأقل" autocomplete="new-password" minlength="8" required>
            <button class="trail" type="button" data-eye="rgPass"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <div class="pw-strength" id="pwBar" data-level="0"><span></span><span></span><span></span><span></span></div>
        </div>
        <div class="alert hidden" id="rgErr"></div>
        <button class="btn" type="submit" id="rgGo">إنشاء الحساب</button>
      </form>
    </div>

    <div class="view" id="vReset">
      <form class="form" id="fReset">
        <div class="field"><p style="color:var(--tx-2);font-size:13.5px;line-height:1.7">أدخل بريدك الإلكتروني وسنرسل لك رابطًا لإعادة تعيين كلمة المرور.</p></div>
        <div class="field">
          <label class="lbl" for="rsEmail">البريد الإلكتروني</label>
          <div class="inp-wrap">
            <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3 8 9 6 9-6"/></svg>
            <input class="inp" id="rsEmail" type="email" dir="ltr" placeholder="name@example.com" required>
          </div>
        </div>
        <div class="alert hidden" id="rsErr"></div>
        <button class="btn" type="submit" id="rsGo">إرسال رابط الاستعادة</button>
        <button class="btn line" type="button" id="rsBack">رجوع</button>
      </form>
    </div>

    <div class="view" id="vSuccess">
      <div class="success">
        <div class="success-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
        <h2 id="scTitle">تم</h2>
        <p id="scText"></p>
        <button class="btn" id="scGo">حسنًا</button>
      </div>
    </div>
  </div>

  <div class="foot">بمتابعتك أنت توافق على <a href="#" onclick="return false">شروط الاستخدام</a> و <a href="#" onclick="return false">سياسة الخصوصية</a></div>
</div>

<div id="toasts"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, updateProfile, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyC-GntWur6r_Ow_v0wTNymQqQa6brzgvW8",
  authDomain: "kardo-1c657.firebaseapp.com",
  projectId: "kardo-1c657",
  storageBucket: "kardo-1c657.firebasestorage.app",
  messagingSenderId: "593934928630",
  appId: "1:593934928630:web:d36ea455a284e974043ad7"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  const ic = kind === 'ok' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' : kind === 'bad' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>' : '';
  el.innerHTML = ic + `<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.28s'; setTimeout(() => el.remove(), 280); }, 3600);
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showErr(id, msg) { const el = $('#' + id); el.classList.remove('hidden'); el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><span>${esc(msg)}</span>`; }
function clearErr(id) { const el = $('#' + id); el.classList.add('hidden'); el.innerHTML = ''; }
function setLoading(btn, on) { if(!btn) return; btn.disabled = on; btn.classList.toggle('loading', on); }

const VIEWS = { login: { view: 'vLogin', err: 'liErr' }, register: { view: 'vRegister', err: 'rgErr' }, reset: { view: 'vReset', err: 'rsErr' } };
function showView(name) {
  Object.entries(VIEWS).forEach(([k, v]) => { $('#' + v.view).classList.toggle('on', k === name); });
  $('#vSuccess').classList.remove('on');
  $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === name));
}
$$('.tab').forEach(t => { t.addEventListener('click', () => { Object.values(VIEWS).forEach(v => clearErr(v.err)); showView(t.dataset.view); }); });

function showSuccess(title, text, btnText = 'حسنًا', onBtn = null) {
  Object.values(VIEWS).forEach(v => $('#' + v.view).classList.remove('on'));
  $('#scTitle').textContent = title;
  $('#scText').textContent = text;
  const btn = $('#scGo');
  btn.textContent = btnText;
  btn.onclick = onBtn || (() => showView('login'));
  $('#vSuccess').classList.add('on');
}

const eyeOpen = '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7"/><circle cx="12" cy="12" r="3"/>';
const eyeClose = '<path d="M17.9 17.9A10.6 10.6 0 0 1 12 19c-6.4 0-10-7-10-7a18 18 0 0 1 4.1-5M9.9 4.2A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-2.2 3.2M3 3l18 18"/>';
$$('[data-eye]').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.eye);
    if(!input) return;
    const isPass = input.type === 'password';
    input.type = isPass ? 'text' : 'password';
    btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${isPass ? eyeClose : eyeOpen}</svg>`;
  });
});

function phoneKey(raw) {
  let p = String(raw || '').replace(/\D/g, '');
  if(p.startsWith('00218')) p = p.slice(5);
  else if(p.startsWith('218')) p = p.slice(3);
  if(p.startsWith('0')) p = p.slice(1);
  return p.slice(-9);
}

const pwInput = $('#rgPass');
const pwBar = $('#pwBar');
pwInput.addEventListener('input', () => {
  const v = pwInput.value;
  if(!v) { pwBar.classList.remove('show'); pwBar.dataset.level = '0'; return; }
  pwBar.classList.add('show');
  let score = 0;
  if(v.length >= 8) score++;
  if(/[a-z]/.test(v) && /[A-Z]/.test(v)) score++;
  if(/\d/.test(v)) score++;
  if(/[^a-zA-Z0-9]/.test(v)) score++;
  pwBar.dataset.level = String(Math.max(1, score));
});

function firebaseMsg(code) {
  const map = {
    'auth/invalid-email':'البريد الإلكتروني غير صحيح',
    'auth/user-disabled':'هذا الحساب معطّل',
    'auth/user-not-found':'لا يوجد حساب بهذا البريد',
    'auth/wrong-password':'كلمة المرور غير صحيحة',
    'auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة',
    'auth/email-already-in-use':'هذا البريد مُسجّل مسبقًا',
    'auth/weak-password':'كلمة المرور ضعيفة — 8 أحرف على الأقل',
    'auth/too-many-requests':'محاولات كثيرة — حاول بعد قليل',
    'auth/network-request-failed':'تعذّر الاتصال — تحقق من الإنترنت',
    'auth/operation-not-allowed':'هذه العملية غير مسموح بها حاليًا'
  };
  return map[code] || 'حدث خطأ — حاول مجددًا';
}

/* ═══════════════════════════════════════════════════════════
   التوجيه بعد تسجيل الدخول — الحل النهائي
   ═══════════════════════════════════════════════════════════ */
let _redirecting = false;
onAuthStateChanged(auth, async user => {
  if(!user || _redirecting) return;
  _redirecting = true;

  try {
    // فحص هل هذا المستخدم أدمن؟
    const adminSnap = await getDoc(doc(db, 'admins', user.uid));
    if (adminSnap.exists()) {
      // ═══ أدمن → لوحة التحكم
      location.replace('admin.html');
    } else {
      // ═══ مستخدم عادي → لوحة المستخدم
      location.replace('dashboard.html');
    }
  } catch (e) {
    // في حال فشل الفحص → dashboard
    location.replace('dashboard.html');
  }
});

/* ═══ LOGIN ═══ */
$('#fLogin').addEventListener('submit', async e => {
  e.preventDefault();
  clearErr('liErr');
  const btn = $('#liGo');
  const email = $('#liEmail').value.trim();
  const pass  = $('#liPass').value;
  if(!email || !pass) { showErr('liErr', 'أكمل جميع الحقول'); return; }
  setLoading(btn, true);
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    // onAuthStateChanged سيتكفل بالتحويل
  } catch(err) {
    showErr('liErr', firebaseMsg(err.code));
    _redirecting = false;
    setLoading(btn, false);
  }
});

/* ═══ REGISTER ═══ */
$('#fRegister').addEventListener('submit', async e => {
  e.preventDefault();
  clearErr('rgErr');
  const btn = $('#rgGo');
  const name  = $('#rgName').value.trim();
  const email = $('#rgEmail').value.trim();
  const phone = $('#rgPhone').value.trim();
  const pass  = $('#rgPass').value;

  if(!name || name.length < 2) { showErr('rgErr', 'الاسم قصير جدًا'); return; }
  if(!email) { showErr('rgErr', 'البريد الإلكتروني مطلوب'); return; }
  const pk = phoneKey(phone);
  if(pk.length !== 9) { showErr('rgErr', 'رقم الهاتف يجب أن يكون 9 أرقام'); return; }
  if(pass.length < 8) { showErr('rgErr', 'كلمة المرور يجب أن تكون 8 أحرف على الأقل'); return; }

  setLoading(btn, true);
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });

    await setDoc(doc(db, 'users', cred.user.uid), {
      name, email, phone, phone_key: pk,
      wallet_balance: 0, total_spent: 0, points: 0,
      vip_status: 'none', vip_cards_limit: 1,
      cards_count: 0, referrals_count: 0, banned: false,
      created_at: serverTimestamp()
    });

    _redirecting = true;
    showSuccess('مرحبًا بك في كاردو', 'حسابك جاهز — جاري تحويلك…', 'الانتقال', () => location.replace('dashboard.html'));
    setTimeout(() => location.replace('dashboard.html'), 1800);
  } catch(err) {
    showErr('rgErr', firebaseMsg(err.code));
    setLoading(btn, false);
  }
});

/* ═══ RESET ═══ */
$('#forgotLink').addEventListener('click', e => {
  e.preventDefault();
  clearErr('rsErr');
  const email = $('#liEmail').value.trim();
  if(email) $('#rsEmail').value = email;
  showView('reset');
});
$('#rsBack').addEventListener('click', () => { clearErr('rsErr'); showView('login'); });
$('#fReset').addEventListener('submit', async e => {
  e.preventDefault();
  clearErr('rsErr');
  const btn = $('#rsGo');
  const email = $('#rsEmail').value.trim();
  if(!email) { showErr('rsErr', 'أدخل بريدك الإلكتروني'); return; }
  setLoading(btn, true);
  try {
    await sendPasswordResetEmail(auth, email);
    showSuccess('تفقّد بريدك', `أرسلنا رابط إعادة التعيين إلى ${email}`, 'رجوع لتسجيل الدخول', () => showView('login'));
  } catch(err) {
    showErr('rsErr', firebaseMsg(err.code));
    setLoading(btn, false);
  }
});

const params = new URLSearchParams(location.search);
const ref = params.get('ref');
if(ref) { sessionStorage.setItem('kardo_ref', ref.toUpperCase()); showView('register'); }
else { showView('login'); }
</script>
