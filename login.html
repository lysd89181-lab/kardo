<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176B4D">
<meta name="description" content="كاردو — تسجيل الدخول">
<title>كاردو — تسجيل الدخول</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./styles.css">

<style>
/* ── Login-specific ── */
body {
  display: grid;
  place-items: center;
  min-height: 100vh;
  padding: 24px 16px;
  background: var(--bg);
}

.login-wrap {
  width: 100%;
  max-width: 400px;
}

.login-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: center;
  margin-bottom: 32px;
}

.login-brand-name {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.025em;
  color: var(--text);
}

.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px 28px;
  box-shadow: 0 1px 3px rgba(20, 30, 25, 0.04);
}

@media (max-width: 480px) {
  .login-card { padding: 24px 20px; }
}

.login-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text);
  margin-bottom: 6px;
}

.login-sub {
  font-size: 13.5px;
  color: var(--text-2);
  margin-bottom: 24px;
}

.login-switch {
  text-align: center;
  margin-top: 20px;
  font-size: 13.5px;
  color: var(--text-2);
}

.login-switch button {
  color: var(--brand);
  font-weight: 600;
  cursor: pointer;
}

.login-switch button:hover {
  text-decoration: underline;
}

.login-foot {
  text-align: center;
  margin-top: 24px;
  font-size: 12px;
  color: var(--text-3);
  line-height: 1.7;
}

.login-foot a {
  color: var(--text-2);
  font-weight: 500;
}

.login-foot a:hover {
  color: var(--brand);
}

.pass-toggle {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  color: var(--text-3);
  transition: all .15s;
}

.pass-toggle:hover {
  background: var(--surface-2);
  color: var(--text);
}

.pass-toggle svg { width: 18px; height: 18px; }

/* Error/success messages */
.auth-msg {
  display: none;
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.55;
  margin-bottom: 16px;
  border: 1px solid;
}

.auth-msg.show { display: block; }

.auth-msg.error {
  background: var(--error-bg);
  border-color: var(--error-border);
  color: #8B3030;
}

.auth-msg.success {
  background: var(--success-bg);
  border-color: var(--success-border);
  color: #0E5C3F;
}

.auth-msg.info {
  background: var(--info-bg);
  border-color: var(--info-border);
  color: #1E4D6F;
}
</style>
</head>
<body>

<div class="login-wrap">

  <!-- Brand -->
  <div class="login-brand">
    <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
      <rect width="40" height="40" rx="10" fill="#176B4D"/>
      <path d="M11 9h4.4v22H11z" fill="#FFFFFF"/>
      <path d="M17 20.2 27.5 9H33L22.4 20.2 33 31h-5.6z" fill="#FFFFFF"/>
      <rect x="19" y="15.6" width="12.4" height="8.8" rx="2" fill="#176B4D"/>
      <rect x="21" y="18.4" width="3.4" height="2.6" rx=".7" fill="#E8F3EE" opacity=".9"/>
    </svg>
    <span class="login-brand-name">كاردو</span>
  </div>

  <!-- Card -->
  <div class="login-card">

    <!-- Login / Register Tabs -->
    <div class="segments" style="width:100%;margin-bottom:24px;justify-content:center">
      <button class="segment active" id="tabLogin" style="flex:1">دخول</button>
      <button class="segment" id="tabRegister" style="flex:1">حساب جديد</button>
    </div>

    <!-- Message -->
    <div class="auth-msg" id="msg"></div>

    <!-- ═══ LOGIN FORM ═══ -->
    <form id="formLogin" style="display:block">

      <h1 class="login-title">تسجيل الدخول</h1>
      <p class="login-sub">أدخل بياناتك للوصول إلى حسابك.</p>

      <div class="field mb-3">
        <label class="field-label" for="liEmail">البريد الإلكتروني</label>
        <input class="input" id="liEmail" type="email" dir="ltr"
               placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="field mb-3" style="position:relative">
        <label class="field-label" for="liPass">كلمة المرور</label>
        <input class="input" id="liPass" type="password" dir="ltr"
               placeholder="••••••••" autocomplete="current-password" required
               style="padding-left:48px">
        <button class="pass-toggle" type="button" data-eye="liPass" aria-label="إظهار">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <div style="text-align:left;margin-bottom:20px">
        <button type="button" id="forgotBtn"
                style="color:var(--text-2);font-size:12.5px;text-decoration:underline">
          نسيت كلمة المرور؟
        </button>
      </div>

      <button class="btn btn-primary btn-block" type="submit" id="liSubmit">
        تسجيل الدخول
      </button>
    </form>

    <!-- ═══ REGISTER FORM ═══ -->
    <form id="formRegister" style="display:none">

      <h1 class="login-title">إنشاء حساب</h1>
      <p class="login-sub">أنشئ حسابك وابدأ بإصدار بطاقتك الأولى.</p>

      <div class="field mb-3">
        <label class="field-label" for="rgName">الاسم الكامل</label>
        <input class="input" id="rgName" placeholder="محمد أحمد" autocomplete="name" maxlength="60" required>
      </div>

      <div class="field mb-3">
        <label class="field-label" for="rgEmail">البريد الإلكتروني</label>
        <input class="input" id="rgEmail" type="email" dir="ltr"
               placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="field mb-3">
        <label class="field-label" for="rgPhone">رقم الهاتف</label>
        <input class="input" id="rgPhone" type="tel" dir="ltr"
               placeholder="0912345678" inputmode="numeric"
               autocomplete="tel" maxlength="13" required>
        <span class="field-hint">يُستخدم لمطابقة تحويلاتك</span>
      </div>

      <div class="field mb-4" style="position:relative">
        <label class="field-label" for="rgPass">كلمة المرور</label>
        <input class="input" id="rgPass" type="password" dir="ltr"
               placeholder="8 أحرف على الأقل" autocomplete="new-password"
               minlength="8" required style="padding-left:48px">
        <button class="pass-toggle" type="button" data-eye="rgPass" aria-label="إظهار">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <button class="btn btn-primary btn-block" type="submit" id="rgSubmit">
        إنشاء الحساب
      </button>
    </form>

    <!-- ═══ RESET PASSWORD FORM ═══ -->
    <form id="formReset" style="display:none">

      <h1 class="login-title">إعادة تعيين كلمة المرور</h1>
      <p class="login-sub">سنرسل رابط الاستعادة إلى بريدك الإلكتروني.</p>

      <div class="field mb-4">
        <label class="field-label" for="rsEmail">البريد الإلكتروني</label>
        <input class="input" id="rsEmail" type="email" dir="ltr"
               placeholder="you@example.com" required>
      </div>

      <button class="btn btn-primary btn-block" type="submit" id="rsSubmit">
        إرسال رابط الاستعادة
      </button>

      <button type="button" class="btn btn-secondary btn-block" id="rsBack" style="margin-top:10px">
        رجوع
      </button>
    </form>

  </div>

  <!-- Switch login/register -->
  <p class="login-switch" id="switchText">
    ليس لديك حساب؟
    <button type="button" id="switchBtn">أنشئ حساباً</button>
  </p>

  <!-- Footer -->
  <p class="login-foot">
    بمتابعتك أنت توافق على
    <a href="#" onclick="return false">شروط الاستخدام</a>
    و
    <a href="#" onclick="return false">سياسة الخصوصية</a>
  </p>

</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, updateProfile, sendPasswordResetEmail,
  setPersistence, browserLocalPersistence
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {
  getFirestore, doc, getDoc, setDoc
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ═══ Config ═══ */
const firebaseConfig = {
  apiKey: "AIzaSyC-GntWur6r_Ow_v0wTNymQqQa6brzgvW8",
  authDomain: "kardo-1c657.firebaseapp.com",
  projectId: "kardo-1c657",
  storageBucket: "kardo-1c657.firebasestorage.app",
  messagingSenderId: "593934928630",
  appId: "1:593934928630:web:d36ea455a284e974043ad7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

setPersistence(auth, browserLocalPersistence).catch(() => {});

/* ═══ Helpers ═══ */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function phoneKey(raw) {
  let p = String(raw || '').replace(/\D/g, '');
  if (p.startsWith('00218')) p = p.slice(5);
  else if (p.startsWith('218')) p = p.slice(3);
  if (p.startsWith('0')) p = p.slice(1);
  return p.slice(-9);
}

function showMsg(text, kind = 'error') {
  const m = $('#msg');
  m.textContent = text;
  m.className = 'auth-msg show ' + kind;
}

function clearMsg() {
  $('#msg').className = 'auth-msg';
}

function setLoading(btn, on, label) {
  if (!btn) return;
  btn.disabled = on;
  btn.classList.toggle('loading', on);
  if (label) btn.textContent = label;
}

/* ═══ View Switch ═══ */
function showView(name) {
  $('#formLogin').style.display = name === 'login' ? 'block' : 'none';
  $('#formRegister').style.display = name === 'register' ? 'block' : 'none';
  $('#formReset').style.display = name === 'reset' ? 'block' : 'none';

  $('#tabLogin').classList.toggle('active', name === 'login');
  $('#tabRegister').classList.toggle('active', name === 'register');

  const sw = $('#switchText');
  if (name === 'login') {
    sw.innerHTML = 'ليس لديك حساب؟ <button type="button" id="switchBtn">أنشئ حساباً</button>';
  } else if (name === 'register') {
    sw.innerHTML = 'لديك حساب بالفعل؟ <button type="button" id="switchBtn">تسجيل الدخول</button>';
  } else {
    sw.innerHTML = '';
  }

  const sb = $('#switchBtn');
  if (sb) sb.onclick = () => showView(name === 'login' ? 'register' : 'login');

  clearMsg();
}

/* ═══ Password Toggle ═══ */
const eyeOpen = '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7"/><circle cx="12" cy="12" r="3"/>';
const eyeOff = '<path d="M17.9 17.9A10.6 10.6 0 0 1 12 19c-6.4 0-10-7-10-7a18 18 0 0 1 4.1-5M9.9 4.2A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-2.2 3.2M3 3l18 18"/>';

$$('[data-eye]').forEach(btn => {
  btn.onclick = () => {
    const input = document.getElementById(btn.dataset.eye);
    if (!input) return;
    const isPass = input.type === 'password';
    input.type = isPass ? 'text' : 'password';
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${isPass ? eyeOff : eyeOpen}</svg>`;
  };
});

/* ═══ Tabs ═══ */
$('#tabLogin').onclick = () => showView('login');
$('#tabRegister').onclick = () => showView('register');

/* ═══ Forgot ═══ */
$('#forgotBtn').onclick = () => {
  const email = $('#liEmail').value.trim();
  if (email) $('#rsEmail').value = email;
  showView('reset');
};

$('#rsBack').onclick = () => showView('login');

/* ═══ Firebase Errors ═══ */
function fbMsg(code) {
  const map = {
    'auth/invalid-email': 'البريد الإلكتروني غير صحيح',
    'auth/user-disabled': 'هذا الحساب معطّل',
    'auth/user-not-found': 'البريد أو كلمة المرور غير صحيحة',
    'auth/wrong-password': 'البريد أو كلمة المرور غير صحيحة',
    'auth/invalid-credential': 'البريد أو كلمة المرور غير صحيحة',
    'auth/email-already-in-use': 'هذا البريد مُسجّل مسبقًا',
    'auth/weak-password': 'كلمة المرور ضعيفة — 8 أحرف على الأقل',
    'auth/too-many-requests': 'محاولات كثيرة — حاول بعد قليل',
    'auth/network-request-failed': 'تعذّر الاتصال — تحقق من الإنترنت',
    'auth/operation-not-allowed': 'هذه العملية غير مسموح بها',
    'auth/unauthorized-domain': 'هذا النطاق غير مُصرّح به',
  };
  return map[code] || 'تعذّر إتمام العملية، حاول مرة أخرى';
}

/* ═══ LOGIN ═══ */
$('#formLogin').onsubmit = async (e) => {
  e.preventDefault();
  clearMsg();

  const email = $('#liEmail').value.trim();
  const pass = $('#liPass').value;
  const btn = $('#liSubmit');

  if (!email || !pass) return showMsg('أكمل جميع الحقول');

  setLoading(btn, true);
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    // onAuthStateChanged سيتولى التوجيه
  } catch (err) {
    showMsg(fbMsg(err.code));
    setLoading(btn, false, 'تسجيل الدخول');
  }
};

/* ═══ REGISTER ═══ */
$('#formRegister').onsubmit = async (e) => {
  e.preventDefault();
  clearMsg();

  const name = $('#rgName').value.trim();
  const email = $('#rgEmail').value.trim();
  const phone = $('#rgPhone').value.trim();
  const pass = $('#rgPass').value;
  const btn = $('#rgSubmit');

  if (!name || name.length < 2) return showMsg('الاسم قصير جدًا');
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showMsg('البريد الإلكتروني غير صحيح');
  if (phoneKey(phone).length !== 9) return showMsg('رقم الهاتف يجب أن يكون 9 أرقام');
  if (pass.length < 8) return showMsg('كلمة المرور 8 أحرف على الأقل');

  setLoading(btn, true);
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });

    // إنشاء مستند المستخدم
    try {
      await setDoc(doc(db, 'users', cred.user.uid), {
        name,
        email,
        phone,
        phone_key: phoneKey(phone),
        wallet_balance: 0,
        total_spent: 0,
        cards_count: 0,
        banned: false,
        created_at: new Date().toISOString(),
      }, { merge: true });
    } catch (docErr) {
      console.warn('user doc creation failed:', docErr.code);
    }

    showMsg('تم إنشاء حسابك — جاري التحويل...', 'success');
    // onAuthStateChanged سيتولى التوجيه
  } catch (err) {
    showMsg(fbMsg(err.code));
    setLoading(btn, false, 'إنشاء الحساب');
  }
};

/* ═══ RESET ═══ */
$('#formReset').onsubmit = async (e) => {
  e.preventDefault();
  clearMsg();

  const email = $('#rsEmail').value.trim();
  const btn = $('#rsSubmit');

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    return showMsg('أدخل بريدًا صحيحًا');
  }

  setLoading(btn, true);
  try {
    await sendPasswordResetEmail(auth, email);
    showMsg('أرسلنا رابط الاستعادة إلى ' + email, 'success');
    setLoading(btn, false, 'إرسال رابط الاستعادة');
  } catch (err) {
    showMsg(fbMsg(err.code));
    setLoading(btn, false, 'إرسال رابط الاستعادة');
  }
};

/* ═══ Smart Redirect ═══ */
onAuthStateChanged(auth, async (user) => {
  if (!user) return;

  // فحص إذا كان أدمن
  try {
    const adminSnap = await getDoc(doc(db, 'admins', user.uid));
    if (adminSnap.exists()) {
      location.replace('admin.html');
      return;
    }
  } catch (e) {
    console.warn('admin check failed:', e.code);
  }

  // عميل عادي
  location.replace('index.html');
});

/* ═══ URL params ═══ */
const params = new URLSearchParams(location.search);
if (params.get('mode') === 'signup') {
  showView('register');
} else {
  showView('login');
}
</script>
</body>
</html>
