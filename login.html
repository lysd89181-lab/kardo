<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>كاردو — تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#020617;--s1:#0D1421;--s2:#131C2C;--s3:#1A2436;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);--tx:#F8FAFC;--tx-2:#94A3B8;--tx-3:#5F6E88;--g:#10B981;--g-2:#0E9E70;--g-3:#34D399;--g-soft:rgba(16,185,129,.10);--g-line:rgba(16,185,129,.30);--bad:#EF5F5F;--bad-soft:rgba(239,95,95,.10);--bad-line:rgba(239,95,95,.30);--spring:cubic-bezier(.34,1.4,.44,1);--ease:cubic-bezier(.22,1,.36,1);--swift:cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(70vw 55vh at 88% -8%,rgba(16,185,129,.14),transparent 60%),radial-gradient(60vw 45vh at -8% 4%,rgba(52,211,153,.07),transparent 58%)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit;width:100%}
:focus-visible{outline:2px solid var(--g);outline-offset:3px;border-radius:8px}
.shell{position:relative;z-index:1;width:100%;max-width:430px;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.brand-en{font-size:26px;font-weight:800;letter-spacing:-.04em}
.brand-ar{font-size:14px;color:var(--tx-3)}
.card{background:linear-gradient(180deg,rgba(13,20,33,.95),rgba(2,6,23,.92));border:1px solid var(--line);border-radius:24px;padding:28px 26px;box-shadow:0 30px 80px -30px rgba(0,0,0,.9)}
.tabs{display:flex;gap:4px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:24px}
.tab{flex:1;padding:11px 12px;font-size:13.5px;font-weight:700;color:var(--tx-3);border-radius:10px;text-align:center;font-family:inherit}
.tab.on{color:var(--tx);background:var(--s3)}
.view{display:none}.view.on{display:block}
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:9px}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--tx-2)}
.lbl a{color:var(--g);font-weight:600;font-size:12px}
.inp{background:var(--s1);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--tx);font-size:15px;font-family:inherit;width:100%}
.inp:focus{outline:none;border-color:var(--g);background:var(--s2);box-shadow:0 0 0 4px var(--g-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:15px 22px;border-radius:13px;font-weight:800;font-size:15px;font-family:inherit;background:linear-gradient(135deg,var(--g),var(--g-2));color:#04121B;box-shadow:0 10px 26px -10px rgba(16,185,129,.5);cursor:pointer;border:none;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;background:var(--s3);color:var(--tx-3);box-shadow:none}
.btn.loading{color:transparent;pointer-events:none;position:relative}
.btn.loading::after{content:'';position:absolute;width:20px;height:20px;border:2.5px solid rgba(4,18,27,.25);border-top-color:#04121B;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.line{background:transparent;color:var(--tx-2);border:1px solid var(--line);box-shadow:none}
.alert{display:flex;gap:10px;padding:13px 15px;border-radius:12px;font-size:13px;border:1px solid var(--bad-line);background:var(--bad-soft);color:#F5A0A0}
.hidden{display:none!important}
.foot{text-align:center;color:var(--tx-3);font-size:12px}
</style>
</head>
<body>
<div class="shell">
  <div class="brand">
    <svg width="72" height="72" viewBox="0 0 40 40">
      <defs><linearGradient id="kg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#34D399"/></linearGradient></defs>
      <rect width="40" height="40" rx="11" fill="#0D1421"/>
      <path d="M11 9h4.4v22H11z" fill="url(#kg)"/>
      <path d="M17 20.2 27.5 9H33L22.4 20.2 33 31h-5.6z" fill="url(#kg)"/>
      <rect x="19" y="15.6" width="12.4" height="8.8" rx="2.2" fill="#F8FAFC" opacity=".95"/>
    </svg>
    <div class="brand-en">KARDO</div>
    <div class="brand-ar">بطاقتك الرقمية الأولى في ليبيا</div>
  </div>
  <div class="card">
    <div class="tabs">
      <button class="tab on" data-view="login" type="button">دخول</button>
      <button class="tab" data-view="register" type="button">حساب جديد</button>
    </div>

    <div class="view on" id="vLogin">
      <form class="form" id="fLogin">
        <div class="field"><label class="lbl">البريد الإلكتروني</label>
          <input class="inp" id="liEmail" type="email" dir="ltr" placeholder="name@example.com" required></div>
        <div class="field"><div class="lbl"><span>كلمة المرور</span><a href="#" id="forgotLink">نسيت؟</a></div>
          <input class="inp" id="liPass" type="password" dir="ltr" placeholder="••••••••" required></div>
        <div class="alert hidden" id="liErr"></div>
        <button class="btn" type="submit" id="liGo">دخول</button>
      </form>
    </div>

    <div class="view" id="vRegister">
      <form class="form" id="fRegister">
        <div class="field"><label class="lbl">الاسم الكامل</label>
          <input class="inp" id="rgName" placeholder="محمد أحمد" required maxlength="60"></div>
        <div class="field"><label class="lbl">البريد الإلكتروني</label>
          <input class="inp" id="rgEmail" type="email" dir="ltr" placeholder="name@example.com" required></div>
        <div class="field"><label class="lbl">رقم الهاتف</label>
          <input class="inp" id="rgPhone" type="tel" dir="ltr" placeholder="0912345678" required maxlength="13"></div>
        <div class="field"><label class="lbl">كلمة المرور</label>
          <input class="inp" id="rgPass" type="password" dir="ltr" placeholder="8 أحرف على الأقل" minlength="8" required></div>
        <div class="alert hidden" id="rgErr"></div>
        <button class="btn" type="submit" id="rgGo">إنشاء الحساب</button>
      </form>
    </div>

    <div class="view" id="vReset">
      <form class="form" id="fReset">
        <p style="color:var(--tx-2);font-size:13.5px">أدخل بريدك وسنرسل رابط الاستعادة.</p>
        <div class="field"><label class="lbl">البريد الإلكتروني</label>
          <input class="inp" id="rsEmail" type="email" dir="ltr" required></div>
        <div class="alert hidden" id="rsErr"></div>
        <button class="btn" type="submit" id="rsGo">إرسال الرابط</button>
        <button class="btn line" type="button" id="rsBack">رجوع</button>
      </form>
    </div>
  </div>
  <div class="foot">بمتابعتك أنت توافق على الشروط وسياسة الخصوصية</div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, updateProfile, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyC-GntWur6r_Ow_v0wTNymQqQa6brzgvW8",
  authDomain: "kardo-1c657.firebaseapp.com",
  projectId: "kardo-1c657",
  storageBucket: "kardo-1c657.firebasestorage.app",
  messagingSenderId: "593934928630",
  appId: "1:593934928630:web:d36ea455a284e974043ad7"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function showErr(id, m) { const el = $('#'+id); el.classList.remove('hidden'); el.textContent = m; }
function clearErr(id) { $('#'+id).classList.add('hidden'); }
function setLoad(b, on) { if(!b) return; b.disabled = on; b.classList.toggle('loading', on); }

const VIEWS = { login:'vLogin', register:'vRegister', reset:'vReset' };
function showView(n) {
  Object.entries(VIEWS).forEach(([k,v]) => $('#'+v).classList.toggle('on', k === n));
  $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === n));
}
$$('.tab').forEach(t => t.onclick = () => showView(t.dataset.view));

function phoneKey(raw) {
  let p = String(raw||'').replace(/\D/g,'');
  if(p.startsWith('00218')) p = p.slice(5);
  else if(p.startsWith('218')) p = p.slice(3);
  if(p.startsWith('0')) p = p.slice(1);
  return p.slice(-9);
}

function fbMsg(code) {
  const m = {
    'auth/invalid-email':'البريد غير صحيح',
    'auth/user-disabled':'الحساب معطّل',
    'auth/user-not-found':'لا يوجد حساب',
    'auth/wrong-password':'كلمة المرور خاطئة',
    'auth/invalid-credential':'البريد أو كلمة المرور خاطئة',
    'auth/email-already-in-use':'البريد مُسجّل مسبقاً',
    'auth/weak-password':'كلمة المرور ضعيفة',
    'auth/too-many-requests':'محاولات كثيرة',
    'auth/network-request-failed':'تعذّر الاتصال'
  };
  return m[code] || 'حدث خطأ';
}

/* ═══════════════════════════════════════════════════════════
   التوجيه + إنشاء ملف المستخدم تلقائياً
   ═══════════════════════════════════════════════════════════ */
let _redirecting = false;
onAuthStateChanged(auth, async user => {
  if(!user || _redirecting) return;
  _redirecting = true;

  let isAdmin = false;
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));

    if (snap.exists()) {
      // موجود → افحص الدور
      if (snap.data().role === 'admin') isAdmin = true;
    } else {
      // ما موجود → أنشئه تلقائياً
      try {
        await setDoc(doc(db, 'users', user.uid), {
          name: user.displayName || '',
          email: user.email || '',
          phone: '',
          phone_key: '',
          wallet_balance: 0,
          total_spent: 0,
          points: 0,
          vip_status: 'none',
          vip_cards_limit: 1,
          cards_count: 0,
          referrals_count: 0,
          banned: false,
          role: 'user',
          created_at: serverTimestamp()
        });
      } catch (err) {
        console.warn('create user doc:', err.code);
      }
    }
  } catch (e) {
    console.warn('user check:', e.code);
  }

  location.replace(isAdmin ? 'admin.html' : 'dashboard.html');
});

/* ═══ LOGIN ═══ */
$('#fLogin').addEventListener('submit', async e => {
  e.preventDefault();
  clearErr('liErr');
  const btn = $('#liGo');
  const email = $('#liEmail').value.trim();
  const pass = $('#liPass').value;
  if(!email || !pass) { showErr('liErr','أكمل الحقول'); return; }
  setLoad(btn, true);
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(err) {
    showErr('liErr', fbMsg(err.code));
    _redirecting = false;
    setLoad(btn, false);
  }
});

/* ═══ REGISTER ═══ */
$('#fRegister').addEventListener('submit', async e => {
  e.preventDefault();
  clearErr('rgErr');
  const btn = $('#rgGo');
  const name = $('#rgName').value.trim();
  const email = $('#rgEmail').value.trim();
  const phone = $('#rgPhone').value.trim();
  const pass = $('#rgPass').value;

  if(name.length < 2) { showErr('rgErr','الاسم قصير'); return; }
  if(!email) { showErr('rgErr','البريد مطلوب'); return; }
  const pk = phoneKey(phone);
  if(pk.length !== 9) { showErr('rgErr','رقم الهاتف 9 أرقام'); return; }
  if(pass.length < 8) { showErr('rgErr','كلمة المرور 8 أحرف على الأقل'); return; }

  setLoad(btn, true);
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });
    try {
      await setDoc(doc(db, 'users', cred.user.uid), {
        name, email, phone, phone_key: pk,
        wallet_balance: 0, total_spent: 0, points: 0,
        vip_status: 'none', vip_cards_limit: 1,
        cards_count: 0, referrals_count: 0, banned: false,
        role: 'user',
        created_at: serverTimestamp()
      });
    } catch (err) {
      console.warn('create user doc:', err.code);
    }
    _redirecting = true;
    location.replace('dashboard.html');
  } catch(err) {
    showErr('rgErr', fbMsg(err.code));
    setLoad(btn, false);
  }
});

/* ═══ RESET ═══ */
$('#forgotLink').onclick = e => {
  e.preventDefault();
  clearErr('rsErr');
  const email = $('#liEmail').value.trim();
  if(email) $('#rsEmail').value = email;
  showView('reset');
};
$('#rsBack').onclick = () => { clearErr('rsErr'); showView('login'); };
$('#fReset').addEventListener('submit', async e => {
  e.preventDefault();
  clearErr('rsErr');
  const btn = $('#rsGo');
  const email = $('#rsEmail').value.trim();
  if(!email) { showErr('rsErr','أدخل البريد'); return; }
  setLoad(btn, true);
  try {
    await sendPasswordResetEmail(auth, email);
    alert('تم إرسال الرابط إلى ' + email);
    showView('login');
  } catch(err) {
    showErr('rsErr', fbMsg(err.code));
    setLoad(btn, false);
  }
});

showView('login');
</script>
</body>
</html>
