<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080F">
<meta name="description" content="كاردو — منصة الخدمات الرقمية. سجّل دخولك وابدأ التسوق.">
<title>كاردو — تسجيل الدخول</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* ═══════════════════════════════════════════════════════════
   KARDO — Auth Screen
   Navy · Emerald · Premium Dark Fintech
   ═══════════════════════════════════════════════════════════ */

:root{
  --bg:#05080F;
  --bg-2:#0A0E17;
  --s1:#0F1623;
  --s2:#141C2B;
  --s3:#1A2335;
  --line:#1E2839;
  --line-2:#2A3648;

  --tx:#EEF2F8;
  --tx-2:#97A5BD;
  --tx-3:#5F6E88;

  --g:#10B981;
  --g-2:#0E9E70;
  --g-3:#34D399;
  --g-soft:rgba(16,185,129,.10);
  --g-glow:rgba(16,185,129,.28);
  --g-line:rgba(16,185,129,.26);

  --bad:#EF5F5F;
  --bad-soft:rgba(239,95,95,.12);
  --warn:#E0A030;

  --spring:cubic-bezier(.34,1.4,.44,1);
  --ease:cubic-bezier(.22,1,.36,1);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}

body{
  font-family:'Tajawal','IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  font-feature-settings:'lnum' 1,'tnum' 1;
  background:var(--bg-2);
  color:var(--tx);
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  position:relative;
}

/* Ambient glow */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(60vw 45vh at 85% -8%, rgba(16,185,129,.13), transparent 60%),
    radial-gradient(50vw 38vh at -6% 4%, rgba(74,158,255,.06), transparent 58%),
    radial-gradient(70vw 55vh at 50% 112%, rgba(16,185,129,.06), transparent 65%);
  animation:ambient 18s ease-in-out infinite alternate;
}
@keyframes ambient{
  0%{opacity:.85}
  100%{opacity:1}
}

/* Grid overlay */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.03;
  background-image:
    linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(ellipse at center, black 25%, transparent 72%);
  -webkit-mask-image:radial-gradient(ellipse at center, black 25%, transparent 72%);
}

button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit;width:100%}
a{color:inherit;text-decoration:none}

:focus-visible{outline:2px solid var(--g);outline-offset:3px;border-radius:8px}
::selection{background:var(--g);color:#04121B}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}

/* ─── Layout ─── */
.shell{
  position:relative;z-index:1;
  width:100%;max-width:440px;
  display:flex;flex-direction:column;
  gap:26px;
  animation:shellIn .7s var(--ease) backwards;
}
@keyframes shellIn{
  from{opacity:0;transform:translateY(22px) scale(.985)}
  to{opacity:1;transform:none}
}

/* ─── Logo ─── */
.logo{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  text-align:center;
  animation:logoIn .9s var(--spring) backwards;
}
@keyframes logoIn{
  from{opacity:0;transform:translateY(-16px) scale(.9)}
  to{opacity:1;transform:none}
}
.logo svg{
  filter:drop-shadow(0 8px 24px rgba(16,185,129,.28));
  animation:markFloat 4s ease-in-out infinite;
}
@keyframes markFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}
.logo .en{
  font-size:26px;font-weight:800;letter-spacing:-.04em;
  background:linear-gradient(135deg,var(--tx) 0%,var(--tx-2) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-top:-4px;
}
.logo .tag{
  font-size:13px;color:var(--tx-3);font-weight:500;
  max-width:320px;
}

/* ─── Card ─── */
.card{
  background:linear-gradient(180deg,rgba(15,22,35,.9) 0%,rgba(10,14,23,.9) 100%);
  border:1px solid var(--line);
  border-radius:22px;
  padding:26px 24px;
  box-shadow:
    0 1px 0 rgba(255,255,255,.04) inset,
    0 20px 60px -24px rgba(0,0,0,.9),
    0 0 80px -40px rgba(16,185,129,.25);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  animation:cardIn .8s var(--ease) .1s backwards;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:none}
}

/* ─── Tabs ─── */
.tabs{
  display:flex;gap:4px;
  background:var(--s1);
  border:1px solid var(--line);
  border-radius:14px;
  padding:4px;
  margin-bottom:22px;
  position:relative;
}
.tab{
  flex:1;
  padding:10px 12px;
  font-size:13.5px;
  font-weight:700;
  color:var(--tx-3);
  border-radius:10px;
  transition:color .2s, background .25s var(--ease);
  position:relative;z-index:1;
  text-align:center;
}
.tab:hover{color:var(--tx-2)}
.tab.on{color:var(--tx)}
.tab.on::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,var(--s3) 0%,var(--s2) 100%);
  border-radius:10px;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,
             0 4px 12px -4px rgba(0,0,0,.5);
  z-index:-1;
  animation:tabBg .3s var(--ease);
}
@keyframes tabBg{
  from{opacity:0;transform:scale(.96)}
  to{opacity:1;transform:none}
}

/* ─── Form ─── */
.form{display:flex;flex-direction:column;gap:16px}
.field{
  display:flex;flex-direction:column;gap:8px;
  animation:fieldIn .55s var(--ease) backwards;
}
.field:nth-child(1){animation-delay:.15s}
.field:nth-child(2){animation-delay:.2s}
.field:nth-child(3){animation-delay:.25s}
.field:nth-child(4){animation-delay:.3s}
@keyframes fieldIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}
.lbl{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12.5px;font-weight:700;color:var(--tx-2);
}
.lbl a{color:var(--g);font-weight:600;font-size:12px}
.lbl a:hover{color:var(--g-3)}

.inp-wrap{position:relative}
.inp-wrap .lead{
  position:absolute;inset-inline-start:14px;top:50%;
  transform:translateY(-50%);
  color:var(--tx-3);pointer-events:none;
  width:18px;height:18px;
  transition:color .18s;
}
.inp-wrap .trail{
  position:absolute;inset-inline-end:8px;top:50%;
  transform:translateY(-50%);
  width:34px;height:34px;
  border-radius:9px;
  display:grid;place-items:center;
  color:var(--tx-3);
  transition:.15s;
}
.inp-wrap .trail:hover{background:var(--s3);color:var(--tx)}

.inp{
  background:var(--s1);
  border:1.5px solid var(--line);
  border-radius:12px;
  padding:13px 44px 13px 14px;
  color:var(--tx);
  font-size:15px;
  transition:.18s;
  font-family:inherit;
}
.inp[type=password]{padding-inline-end:50px}
.inp.no-lead{padding-inline-start:14px}
.inp::placeholder{color:var(--tx-3)}
.inp:hover:not(:focus){border-color:var(--line-2)}
.inp:focus{
  outline:none;
  border-color:var(--g);
  background:var(--s2);
  box-shadow:0 0 0 4px var(--g-soft);
}
.inp-wrap:focus-within .lead{color:var(--g)}
.inp.bad{border-color:var(--bad)}
.inp.bad:focus{box-shadow:0 0 0 4px var(--bad-soft)}
.num-inp{font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* ─── Buttons ─── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 20px;
  border-radius:13px;
  font-weight:800;
  font-size:15px;
  transition:.18s var(--spring);
  background:linear-gradient(135deg,var(--g) 0%,var(--g-2) 100%);
  color:#04121B;
  box-shadow:
    0 1px 0 rgba(255,255,255,.15) inset,
    0 8px 20px -8px rgba(16,185,129,.5);
  position:relative;overflow:hidden;
}
.btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);
  transform:translateX(-100%);
  transition:transform .65s var(--ease);
}
.btn:hover:not(:disabled){transform:translateY(-2px);
  box-shadow:0 1px 0 rgba(255,255,255,.18) inset,
             0 14px 30px -10px rgba(16,185,129,.6)}
.btn:hover:not(:disabled)::before{transform:translateX(100%)}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed;
  background:var(--s3);color:var(--tx-3);box-shadow:none}
.btn.wide{width:100%}
.btn svg{width:18px;height:18px}

.btn.loading{
  color:transparent;pointer-events:none;
}
.btn.loading::after{
  content:'';position:absolute;
  width:18px;height:18px;
  border:2.5px solid rgba(4,18,27,.3);
  border-top-color:#04121B;
  border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── Divider ─── */
.divider{
  display:flex;align-items:center;gap:12px;
  color:var(--tx-3);
  font-size:12px;font-weight:600;
  margin:4px 0;
}
.divider::before,.divider::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--line),transparent);
}

/* ─── Error / Note ─── */
.alert{
  display:flex;gap:10px;align-items:flex-start;
  padding:12px 14px;
  border-radius:12px;
  font-size:13px;
  line-height:1.55;
  background:var(--bad-soft);
  border:1px solid rgba(239,95,95,.3);
  color:#F5A0A0;
  animation:shake .4s var(--ease);
}
.alert svg{width:18px;height:18px;flex:none;margin-top:2px}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-3px)}
  80%{transform:translateX(3px)}
}
.alert.ok{background:var(--g-soft);border-color:var(--g-line);color:var(--g-3)}

.hidden{display:none!important}

/* ─── Success screen ─── */
.success{
  text-align:center;
  padding:24px 8px;
  animation:successIn .55s var(--spring);
}
@keyframes successIn{
  from{opacity:0;transform:scale(.9)}
  to{opacity:1;transform:none}
}
.success-ic{
  width:72px;height:72px;
  border-radius:22px;
  margin:0 auto 16px;
  display:grid;place-items:center;
  background:var(--g-soft);
  color:var(--g);
  animation:successPop .6s var(--spring);
}
.success-ic svg{width:34px;height:34px}
@keyframes successPop{
  0%{transform:scale(.5) rotate(-10deg);opacity:0}
  60%{transform:scale(1.12) rotate(3deg)}
  100%{transform:scale(1) rotate(0);opacity:1}
}
.success h2{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px}
.success p{color:var(--tx-2);font-size:13.5px;margin-bottom:22px}

/* ─── Footer ─── */
.foot{
  text-align:center;
  color:var(--tx-3);
  font-size:12px;
  padding-top:8px;
  animation:fadeIn .7s var(--ease) .35s backwards;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.foot a{color:var(--tx-2);font-weight:600}
.foot a:hover{color:var(--g)}

/* ─── Reduced motion ─── */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  body::before{animation:none}
  .logo svg{animation:none}
}
</style>
</head>
<body>

<div class="shell">

  <!-- Logo -->
  <div class="logo">
    <svg width="68" height="68" viewBox="0 0 40 40">
      <defs>
        <linearGradient id="kg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#10B981"/>
          <stop offset="1" stop-color="#34D399"/>
        </linearGradient>
      </defs>
      <rect width="40" height="40" rx="11" fill="#0F1623"/>
      <rect x="0.5" y="0.5" width="39" height="39" rx="10.5"
            fill="none" stroke="rgba(16,185,129,.25)"/>
      <path d="M11 9h4.4v22H11z" fill="url(#kg)"/>
      <path d="M17 20.2 27.5 9H33L22.4 20.2 33 31h-5.6z" fill="url(#kg)"/>
      <rect x="19" y="15.6" width="12.4" height="8.8" rx="2.2"
            fill="#EEF2F8" opacity=".95"/>
      <rect x="21" y="18.4" width="3.4" height="2.6" rx=".7"
            fill="#0F1623" opacity=".6"/>
    </svg>
    <div class="en">KARDO</div>
    <div class="tag">منصة الخدمات الرقمية — بطاقات، اشتراكات، ألعاب</div>
  </div>

  <!-- Card -->
  <div class="card">

    <!-- Tabs -->
    <div class="tabs" role="tablist">
      <button class="tab on" data-view="login" role="tab">تسجيل الدخول</button>
      <button class="tab" data-view="register" role="tab">حساب جديد</button>
    </div>

    <!-- ═══ LOGIN ═══ -->
    <form class="form" id="viewLogin" autocomplete="on">
      <div class="field">
        <label class="lbl" for="liEmail">البريد الإلكتروني</label>
        <div class="inp-wrap">
          <svg class="lead" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2.5"/>
            <path d="m3 8 9 6 9-6"/>
          </svg>
          <input class="inp" id="liEmail" type="email" dir="ltr"
                 placeholder="name@example.com" autocomplete="email" required>
        </div>
      </div>

      <div class="field">
        <div class="lbl">
          <label for="liPass">كلمة المرور</label>
          <a href="#" id="forgotLink">نسيت كلمة المرور؟</a>
        </div>
        <div class="inp-wrap">
          <svg class="lead" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="11" rx="2.5"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
          </svg>
          <input class="inp" id="liPass" type="password" dir="ltr"
                 placeholder="••••••••" autocomplete="current-password" required>
          <button class="trail" type="button" data-eye="liPass" aria-label="إظهار">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="alert hidden" id="liErr"></div>

      <button class="btn wide" type="submit" id="liGo" style="margin-top:4px">
        دخول
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 6l-6 6 6 6"/>
        </svg>
      </button>
    </form>

    <!-- ═══ REGISTER ═══ -->
    <form class="form hidden" id="viewRegister" autocomplete="on">
      <div class="field">
        <label class="lbl" for="rgName">الاسم الكامل</label>
        <div class="inp-wrap">
          <svg class="lead" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="3.6"/>
            <path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>
          </svg>
          <input class="inp" id="rgName" placeholder="محمد أحمد"
                 autocomplete="name" required>
        </div>
      </div>

      <div class="field">
        <label class="lbl" for="rgEmail">البريد الإلكتروني</label>
        <div class="inp-wrap">
          <svg class="lead" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2.5"/>
            <path d="m3 8 9 6 9-6"/>
          </svg>
          <input class="inp" id="rgEmail" type="email" dir="ltr"
                 placeholder="name@example.com" autocomplete="email" required>
        </div>
      </div>

      <div class="field">
        <label class="lbl" for="rgPhone">رقم الهاتف</label>
        <div class="inp-wrap">
          <svg class="lead" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="2" width="12" height="20" rx="3"/>
            <path d="M11 18h2"/>
          </svg>
          <input class="inp num-inp" id="rgPhone" type="tel" dir="ltr"
                 placeholder="0912345678" inputmode="numeric"
                 autocomplete="tel" required>
        </div>
      </div>

      <div class="field">
        <label class="lbl" for="rgPass">كلمة المرور</label>
        <div class="inp-wrap">
          <svg class="lead" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="11" rx="2.5"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
          </svg>
          <input class="inp" id="rgPass" type="password" dir="ltr"
                 placeholder="8 أحرف على الأقل" autocomplete="new-password"
                 minlength="8" required>
          <button class="trail" type="button" data-eye="rgPass" aria-label="إظهار">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="alert hidden" id="rgErr"></div>

      <button class="btn wide" type="submit" id="rgGo" style="margin-top:4px">
        إنشاء الحساب
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 6l-6 6 6 6"/>
        </svg>
      </button>
    </form>

    <!-- ═══ RESET ═══ -->
    <form class="form hidden" id="viewReset">
      <div class="field">
        <p class="sub" style="margin-bottom:4px">
          أدخل بريدك الإلكتروني وسنرسل لك رابطًا لإعادة تعيين كلمة المرور.
        </p>
      </div>
      <div class="field">
        <label class="lbl" for="rsEmail">البريد الإلكتروني</label>
        <div class="inp-wrap">
          <svg class="lead" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2.5"/>
            <path d="m3 8 9 6 9-6"/>
          </svg>
          <input class="inp" id="rsEmail" type="email" dir="ltr"
                 placeholder="name@example.com" required>
        </div>
      </div>

      <div class="alert hidden" id="rsErr"></div>

      <button class="btn wide" type="submit" id="rsGo">
        إرسال رابط الاستعادة
      </button>
      <button class="btn wide" type="button" id="rsBack"
              style="background:transparent;color:var(--tx-2);
                     border:1px solid var(--line);box-shadow:none">
        رجوع
      </button>
    </form>

    <!-- ═══ SUCCESS ═══ -->
    <div class="success hidden" id="viewSuccess">
      <div class="success-ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
      </div>
      <h2 id="scTitle">تم بنجاح</h2>
      <p id="scText"></p>
      <button class="btn wide" id="scGo">حسنًا</button>
    </div>

  </div>

  <div class="foot">
    بمتابعتك أنت توافق على
    <a href="#">شروط الاستخدام</a> و <a href="#">سياسة الخصوصية</a>
  </div>

</div>

<script type="module">
/* ═══════════════════════════════════════════════════════════
   KARDO — Auth
   Firebase Authentication (Email/Password)
   ═══════════════════════════════════════════════════════════ */

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail,
  updateProfile,
  onAuthStateChanged
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  serverTimestamp
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyC-GntWur6r_Ow_v0wTNymQqQa6brzgvW8",
  authDomain: "kardo-1c657.firebaseapp.com",
  projectId: "kardo-1c657",
  storageBucket: "kardo-1c657.firebasestorage.app",
  messagingSenderId: "593934928630",
  appId: "1:593934928630:web:d36ea455a284e974043ad7"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

/* ─── Helpers ─── */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const views = ['viewLogin', 'viewRegister', 'viewReset', 'viewSuccess'];
const tabs  = ['login', 'register'];

function showView(name){
  views.forEach(v => {
    const el = $('#' + v);
    if(el) el.classList.toggle('hidden', v !== 'view' + name.charAt(0).toUpperCase() + name.slice(1));
  });
  const tabName = name === 'login' || name === 'register' ? name : null;
  if(tabName){
    $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === tabName));
  }
}

$$('.tab').forEach(t => {
  t.addEventListener('click', () => {
    showView(t.dataset.view);
    clearErrors();
  });
});

function clearErrors(){
  ['liErr','rgErr','rsErr'].forEach(id => {
    const el = $('#' + id);
    if(el){ el.classList.add('hidden'); el.textContent = ''; }
  });
}

function showErr(id, msg, kind='bad'){
  const el = $('#' + id);
  if(!el) return;
  el.classList.remove('hidden','ok');
  if(kind === 'ok') el.classList.add('ok');
  const icon = kind === 'ok'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>';
  el.innerHTML = icon + '<span>' + msg + '</span>';
}

function setLoading(btn, loading){
  if(!btn) return;
  btn.disabled = loading;
  btn.classList.toggle('loading', loading);
}

/* ─── Eye toggle ─── */
const eyeOpen  = '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7"/><circle cx="12" cy="12" r="3"/>';
const eyeClose = '<path d="M17.9 17.9A10.6 10.6 0 0 1 12 19c-6.4 0-10-7-10-7a18 18 0 0 1 4.1-5M9.9 4.2A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-2.2 3.2M3 3l18 18"/>';

$$('[data-eye]').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.eye);
    if(!input) return;
    const isPass = input.type === 'password';
    input.type = isPass ? 'text' : 'password';
    btn.innerHTML =
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
      'stroke-linejoin="round">' + (isPass ? eyeClose : eyeOpen) + '</svg>';
  });
});

/* ─── Phone normalize ─── */
function phoneKey(raw){
  let p = String(raw || '').replace(/\D/g, '');
  if(p.startsWith('00218')) p = p.slice(5);
  else if(p.startsWith('218')) p = p.slice(3);
  if(p.startsWith('0')) p = p.slice(1);
  return p.slice(-9);
}

/* ─── Firebase error mapper ─── */
function firebaseMsg(code){
  const map = {
    'auth/invalid-email':       'البريد الإلكتروني غير صحيح',
    'auth/user-disabled':       'هذا الحساب معطّل',
    'auth/user-not-found':      'لا يوجد حساب بهذا البريد',
    'auth/wrong-password':      'كلمة المرور غير صحيحة',
    'auth/invalid-credential':  'البريد أو كلمة المرور غير صحيحة',
    'auth/email-already-in-use':'هذا البريد مُسجّل مسبقًا',
    'auth/weak-password':       'كلمة المرور ضعيفة — 8 أحرف على الأقل',
    'auth/too-many-requests':   'محاولات كثيرة — حاول بعد قليل',
    'auth/network-request-failed':'تعذّر الاتصال — تحقق من الإنترنت'
  };
  return map[code] || 'حدث خطأ، حاول مجددًا';
}

/* ─── Redirect if already logged in ─── */
onAuthStateChanged(auth, user => {
  if(user){
    // لا تحوّل مباشرة — انتظر قليلًا حتى تُبنى الجلسة
    setTimeout(() => {
      location.replace('index.html');
    }, 100);
  }
});

/* ═══ LOGIN ═══ */
$('#viewLogin').addEventListener('submit', async e => {
  e.preventDefault();
  clearErrors();
  const btn = $('#liGo');
  const email = $('#liEmail').value.trim();
  const pass  = $('#liPass').value;

  if(!email || !pass){
    showErr('liErr', 'أكمل جميع الحقول');
    return;
  }

  setLoading(btn, true);
  try{
    await signInWithEmailAndPassword(auth, email, pass);
    // onAuthStateChanged سيتكفّل بالتحويل
  } catch(err){
    showErr('liErr', firebaseMsg(err.code));
    setLoading(btn, false);
  }
});

/* ═══ REGISTER ═══ */
$('#viewRegister').addEventListener('submit', async e => {
  e.preventDefault();
  clearErrors();
  const btn = $('#rgGo');
  const name  = $('#rgName').value.trim();
  const email = $('#rgEmail').value.trim();
  const phone = $('#rgPhone').value.trim();
  const pass  = $('#rgPass').value;

  if(!name || name.length < 2){
    showErr('rgErr', 'الاسم قصير جدًا');
    return;
  }
  if(!email){
    showErr('rgErr', 'البريد الإلكتروني مطلوب');
    return;
  }
  const pk = phoneKey(phone);
  if(pk.length !== 9){
    showErr('rgErr', 'رقم الهاتف يجب أن يكون 9 أرقام');
    return;
  }
  if(pass.length < 8){
    showErr('rgErr', 'كلمة المرور يجب أن تكون 8 أحرف على الأقل');
    return;
  }

  setLoading(btn, true);
  try{
    // 1) إنشاء المستخدم في Firebase Auth
    const cred = await createUserWithEmailAndPassword(auth, email, pass);

    // 2) تحديث الاسم في Auth
    await updateProfile(cred.user, { displayName: name });

    // 3) إنشاء وثيقة المستخدم في Firestore
    await setDoc(doc(db, 'users', cred.user.uid), {
      name,
      email,
      phone,
      phone_key: pk,
      wallet_balance: 0,
      total_spent: 0,
      cards_count: 0,
      points: 0,
      referrals_count: 0,
      banned: false,
      created_at: serverTimestamp()
    });

    // 4) عرض شاشة النجاح
    $('#scTitle').textContent = 'مرحبًا بك في كاردو';
    $('#scText').textContent  = 'حسابك جاهز — جاري تحويلك للمتجر…';
    $('#scGo').textContent    = 'الانتقال للمتجر';
    showView('success');

    // 5) تحويل تلقائي بعد ثانيتين
    setTimeout(() => location.replace('index.html'), 2000);

    $('#scGo').onclick = () => location.replace('index.html');

  } catch(err){
    showErr('rgErr', firebaseMsg(err.code));
    setLoading(btn, false);
  }
});

/* ═══ RESET ═══ */
$('#forgotLink').addEventListener('click', e => {
  e.preventDefault();
  clearErrors();
  const email = $('#liEmail').value.trim();
  if(email) $('#rsEmail').value = email;
  showView('reset');
});

$('#rsBack').addEventListener('click', () => {
  clearErrors();
  showView('login');
});

$('#viewReset').addEventListener('submit', async e => {
  e.preventDefault();
  clearErrors();
  const btn = $('#rsGo');
  const email = $('#rsEmail').value.trim();

  if(!email){
    showErr('rsErr', 'أدخل بريدك الإلكتروني');
    return;
  }

  setLoading(btn, true);
  try{
    await sendPasswordResetEmail(auth, email);
    $('#scTitle').textContent = 'تفقّد بريدك';
    $('#scText').textContent  = 'أرسلنا رابط إعادة التعيين إلى ' + email;
    $('#scGo').textContent    = 'رجوع لتسجيل الدخول';
    showView('success');
    $('#scGo').onclick = () => { showView('login'); clearErrors(); };
  } catch(err){
    showErr('rsErr', firebaseMsg(err.code));
    setLoading(btn, false);
  }
});

/* ─── Prefill: إن كان المستخدم قادمًا من رابط دعوة ─── */
const params = new URLSearchParams(location.search);
const ref = params.get('ref');
if(ref){
  sessionStorage.setItem('kardo_ref', ref.toUpperCase());
  showView('register');
}
</script>
</body>
</html>
